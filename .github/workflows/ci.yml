name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # a version tag also publishes a release
  pull_request:

# Jobs only read the repo unless they ask for more (pages does).
permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            type: Release
            flags: ""
            renders: true
          - name: sanitizers
            type: Debug
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
            renders: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Core tests
        run: ./build/synthkit_tests
      - name: Example synth checks
        run: ./build/examples/basic/basic_render --check examples/basic ${{ matrix.renders && '--out renders' || '' }}
      - name: Upload renders
        if: matrix.renders && always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-basic
          path: |
            renders/tests/*.wav
            renders/presets/*.wav
            renders/failures/*
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Browser build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 lld-18 wasi-libc libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32
      - name: Build the page
        run: |
          cmake -S . -B build-web -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/wasm32-wasi.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web
      - name: Build the native renderer (for comparison)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target basic_render
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Check the page in Chromium
        run: node web/test/browser-test.cjs build-web/web/basic.html web-test examples/basic/tests/demo-pump.json --kit-ui
      - name: Check the page's plugin mode (page <-> plugin messages)
        run: node web/test/plugin-ui-test.cjs build-web/web/basic.html web-test
      - name: Browser output matches the native engine
        run: |
          ./build/examples/basic/basic_render examples/basic/tests/demo-pump.json --block 128 --out web-test/native.wav
          python3 web/test/compare.py web-test/web-render.f32 web-test/native.wav
      - name: Upload the page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-basic
          path: |
            build-web/web/basic.html
            web-test/*.png
            web-test/*.f32
            web-test/native.wav
          if-no-files-found: ignore
          retention-days: 30

  # Scaffolds a synth from template/ (as tools/new-synth.py does for a new
  # repo, but linked to this checkout) and runs what its own CI would run:
  # native checks, the page in Chromium vs native, and the Linux plugin.
  template:
    name: Template synth
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/deps.sh web && tools/ci/deps.sh plugin
      - name: Scaffold
        run: python3 tools/new-synth.py "$RUNNER_TEMP/newsynth" --name "Template Test" --plugin-code Ttst --link-synthkit "$PWD"
      - name: Native checks
        working-directory: ${{ runner.temp }}/newsynth
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
          ./build/template_test_render --check .
      - name: Page in Chromium, compared with native
        working-directory: ${{ runner.temp }}/newsynth
        run: |
          cmake -S . -B build-web -G Ninja -DCMAKE_TOOLCHAIN_FILE=synthkit/cmake/wasm32-wasi.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          NODE_PATH="$PWD/node_modules" node synthkit/web/test/browser-test.cjs build-web/web/template_test.html web-test tests/chord.json
          ./build/template_test_render tests/chord.json --block 128 --out web-test/native.wav
          python3 synthkit/web/test/compare.py web-test/web-render.f32 web-test/native.wav
      - name: Plugin (Linux)
        working-directory: ${{ runner.temp }}/newsynth
        run: synthkit/tools/ci/plugin.sh . template_test . build-web/web plugin.zip

  # VST3 (+ AU on macOS) and Standalone builds. The plugin window is the page
  # built by the web job, so these wait for it.
  plugin:
    name: Plugin (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            slug: windows
          - name: macOS
            os: macos-15
            slug: macos
          - name: Linux
            os: ubuntu-24.04
            slug: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-basic
          path: page
      - name: Install dependencies
        shell: bash
        run: tools/ci/deps.sh plugin
      - name: Build, check (plugin check, pluginval, auval) and package
        shell: bash
        run: tools/ci/plugin.sh . basic examples/basic page/build-web/web plugin.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: synthkit-basic-${{ matrix.slug }}
          path: plugin.zip
          retention-days: 30

  # On a version tag (v0.2.0 …): a GitHub release with the plugin zips.
  release:
    name: Release
    needs: plugin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthkit-basic-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for os in windows macos linux; do mv "synthkit-basic-$os/plugin.zip" "synthkit-Basic-$TAG-$os.zip"; done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "synthkit Basic $TAG" \
            --notes "Install: unzip, then follow INSTALL.md inside." synthkit-Basic-*.zip

  # Publishes the page with GitHub Pages: main at the site root, each PR under
  # pr/<number>/. Runs only once the repo is public (free-plan Pages needs
  # that) and Pages is set to deploy from the gh-pages branch.
  pages:
    name: Publish preview
    needs: web
    if: ${{ !github.event.repository.private && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency: pages-branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-basic
          path: page
      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          dest="."
          [ -n "$PR" ] && dest="pr/$PR"
          git init -q site && cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin gh-pages; then git checkout -q gh-pages; else git checkout -q --orphan gh-pages; fi
          mkdir -p "$dest"
          cp ../page/build-web/web/basic.html "$dest/index.html"
          touch .nojekyll
          git add -A
          what="main"; [ -n "$PR" ] && what="PR #$PR"
          git commit -q -m "Preview for $what (${{ github.sha }})" || exit 0
          git push -q origin gh-pages
      - name: Link the preview on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/pr/${PR}/"
          marker="<!-- synthkit-preview -->"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[].body' | grep -q "$marker"; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${marker}
          Play this PR in the browser: ${url} (updates on every push; give Pages a minute)."
          fi
