name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # a version tag also publishes a release
  pull_request:

# Jobs only read the repo unless they ask for more (pages does).
permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            type: Release
            flags: ""
            renders: true
          - name: sanitizers
            type: Debug
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
            renders: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Core tests
        run: ./build/synthkit_tests
      - name: Example synth checks
        run: ./build/examples/basic/basic_render --check examples/basic ${{ matrix.renders && '--out renders' || '' }}
      - name: Upload renders
        if: matrix.renders && always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-basic
          path: |
            renders/tests/*.wav
            renders/presets/*.wav
            renders/failures/*
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Browser build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 lld-18 wasi-libc libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32
      - name: Build the page
        run: |
          cmake -S . -B build-web -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/wasm32-wasi.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web
      - name: Build the native renderer (for comparison)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target basic_render
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Check the page in Chromium
        run: node web/test/browser-test.cjs build-web/web/basic.html web-test examples/basic/tests/demo-pump.json
      - name: Check the page's plugin mode (page <-> plugin messages)
        run: node web/test/plugin-ui-test.cjs build-web/web/basic.html web-test
      - name: Browser output matches the native engine
        run: |
          ./build/examples/basic/basic_render examples/basic/tests/demo-pump.json --block 128 --out web-test/native.wav
          python3 web/test/compare.py web-test/web-render.f32 web-test/native.wav
      - name: Upload the page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-basic
          path: |
            build-web/web/basic.html
            web-test/*.png
            web-test/*.f32
            web-test/native.wav
          if-no-files-found: ignore
          retention-days: 30

  # VST3 (+ AU on macOS) and Standalone builds. The plugin window is the page
  # built by the web job, so these wait for it.
  plugin:
    name: Plugin (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            slug: windows
          - name: macOS
            os: macos-15
            slug: macos
          - name: Linux
            os: ubuntu-24.04
            slug: linux
    env:
      ART: build/examples/basic/basic_plugin_artefacts/Release
      CHECK: build/examples/basic/basic_plugin_check_artefacts/Release/basic_plugin_check
      PRODUCT: synthkit Basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-basic
          path: page
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libegl-dev libglu1-mesa-dev mesa-common-dev
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Get the WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory "$RUNNER_TEMP/nuget" -NonInteractive
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DSYNTHKIT_PLUGIN=ON -DSYNTHKIT_BUILD_TESTS=OFF -DSYNTHKIT_WEB_UI_DIR="$PWD/page/build-web/web")
          case "$RUNNER_OS" in
            Windows) args+=(-DJUCE_WEBVIEW2_PACKAGE_LOCATION="$RUNNER_TEMP/nuget") ;;
            macOS)   args+=(-G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0) ;;
            Linux)   args+=(-G Ninja) ;;
          esac
          cmake -S . -B build "${args[@]}"
      - name: Build
        shell: bash
        run: |
          targets=(basic_plugin_VST3 basic_plugin_Standalone basic_plugin_check)
          [ "$RUNNER_OS" = macOS ] && targets+=(basic_plugin_AU)
          cmake --build build --config Release --parallel --target "${targets[@]}"
      - name: Sign for local use (macOS, ad hoc)
        if: runner.os == 'macOS'
        run: |
          for b in "$ART/VST3/$PRODUCT.vst3" "$ART/AU/$PRODUCT.component" "$ART/Standalone/$PRODUCT.app"; do
            codesign --force --deep --sign - "$b"
          done
      - name: Plays like the engine, as a DAW loads it
        shell: bash
        run: |
          run=(); [ "$RUNNER_OS" = Linux ] && run=(xvfb-run -a)
          "${run[@]}" "$CHECK" "$ART/VST3/$PRODUCT.vst3"
      - name: pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) zip=pluginval_Windows.zip; bin=./pluginval.exe ;;
            macOS)   zip=pluginval_macOS.zip;   bin=./pluginval.app/Contents/MacOS/pluginval ;;
            Linux)   zip=pluginval_Linux.zip;   bin=./pluginval ;;
          esac
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$zip"
          unzip -q pv.zip
          run=(); [ "$RUNNER_OS" = Linux ] && run=(xvfb-run -a)
          "${run[@]}" $bin --strictness-level 10 --validate-in-process --timeout-ms 300000 "$ART/VST3/$PRODUCT.vst3"
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p ~/Library/Audio/Plug-Ins/Components
            cp -R "$ART/AU/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            auval -a > /dev/null
            auval -strict -v aumu Skba Tend
            $bin --strictness-level 10 --validate-in-process --timeout-ms 300000 ~/Library/Audio/Plug-Ins/Components/"$PRODUCT.component"
          fi
      - name: Package
        shell: bash
        run: |
          out="pkg/$PRODUCT"
          mkdir -p "$out"
          cp -R "$ART/VST3/$PRODUCT.vst3" "$out/"
          [ -d "$ART/AU" ] && cp -R "$ART/AU/$PRODUCT.component" "$out/"
          cp -R "$ART/Standalone/"* "$out/"
          cp plugin/INSTALL.md "$out/INSTALL.md"
          cd pkg
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip -bd ../plugin.zip "$PRODUCT" > /dev/null; else zip -qry ../plugin.zip "$PRODUCT"; fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: synthkit-basic-${{ matrix.slug }}
          path: plugin.zip
          retention-days: 30

  # On a version tag (v0.2.0 …): a GitHub release with the plugin zips.
  release:
    name: Release
    needs: plugin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthkit-basic-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for os in windows macos linux; do mv "synthkit-basic-$os/plugin.zip" "synthkit-Basic-$TAG-$os.zip"; done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "synthkit Basic $TAG" \
            --notes "Install: unzip, then follow INSTALL.md inside." synthkit-Basic-*.zip

  # Publishes the page with GitHub Pages: main at the site root, each PR under
  # pr/<number>/. Runs only once the repo is public (free-plan Pages needs
  # that) and Pages is set to deploy from the gh-pages branch.
  pages:
    name: Publish preview
    needs: web
    if: ${{ !github.event.repository.private && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency: pages-branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-basic
          path: page
      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          dest="."
          [ -n "$PR" ] && dest="pr/$PR"
          git init -q site && cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin gh-pages; then git checkout -q gh-pages; else git checkout -q --orphan gh-pages; fi
          mkdir -p "$dest"
          cp ../page/build-web/web/basic.html "$dest/index.html"
          touch .nojekyll
          git add -A
          what="main"; [ -n "$PR" ] && what="PR #$PR"
          git commit -q -m "Preview for $what (${{ github.sha }})" || exit 0
          git push -q origin gh-pages
      - name: Link the preview on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/pr/${PR}/"
          marker="<!-- synthkit-preview -->"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[].body' | grep -q "$marker"; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${marker}
          Play this PR in the browser: ${url} (updates on every push; give Pages a minute)."
          fi
