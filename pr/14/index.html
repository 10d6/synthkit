    if (skHasHandles(a) || skHasHandles(b)) {  // already a Bezier segment
      if (skHasHandles(a)) { out[i][4] = a[4]; out[i][5] = a[5]; }
      if (skHasHandles(b)) { out[i + 1][6] = b[6]; out[i + 1][7] = b[7]; }
      continue;
    }
    if (!a[2]) continue;  // a straight line needs no handles
    const [ox, oy, ix, iy] = skFitSegment(a[0], a[1], b[0], b[1], a[2]);
    out[i][4] = ox; out[i][5] = oy;
    out[i + 1][6] = ix; out[i + 1][7] = iy;
  }
  pts.length = 0;
  pts.push(...out);
}

// Shorten a handle (keeping its direction) so its end stays inside the editor:
// heights 0..1, and no further than xMax across (xMax is signed: + for out
// handles, - for in handles).
function skFitHandle(py, dx, dy, xMax) {
  let s = 1;
  if (Math.abs(dx) > Math.abs(xMax) && dx !== 0) s = Math.min(s, Math.abs(xMax / dx));
  if (py + dy > 1) s = Math.min(s, (1 - py) / dy);
  if (py + dy < 0) s = Math.min(s, -py / dy);
  s = Math.max(0, s);
  return [dx * s, dy * s];
}

// Smooth handles for point i: tangent through its neighbours, a third of the
// way to each (shortened if that would leave the editor).
function skSmoothHandles(pts, i) {
  const p = pts[i], prev = pts[i - 1], next = pts[i + 1];
  const slope = prev && next ? (next[1] - prev[1]) / Math.max(1e-6, next[0] - prev[0])
    : next ? (next[1] - p[1]) / Math.max(1e-6, next[0] - p[0])
    : prev ? (p[1] - prev[1]) / Math.max(1e-6, p[0] - prev[0]) : 0;
  const wo = next ? (next[0] - p[0]) / 3 : 0, wi = prev ? (p[0] - prev[0]) / 3 : 0;
  [p[4], p[5]] = skFitHandle(p[1], wo, slope * wo, wo);
  [p[6], p[7]] = skFitHandle(p[1], -wi, -slope * wi, -wi);
  p[8] = 0;
}

class ShapeEditor {
  constructor(app, n) {
    this.app = app; this.m = app.model; this.n = n; this.pre = `shape${n}.`;
    this.tool = "points";
    this.snap = true;
    this.sel = -1;
    this.W = 600; this.H = 170; this.pad = 10;
    this.svg = svg("svg", { class: "shape-svg", "aria-hidden": "true" });
    this.g = { grid: svg("g"), fill: svg("path", { class: "shape-fill" }), line: svg("path", { class: "shape-line" }),
      rel: svg("g", { class: "shape-release" }), handles: svg("g"), points: svg("g"), head: svg("line", { class: "shape-head" }) };
    this.svg.append(this.g.grid, this.g.fill, this.g.line, this.g.rel, this.g.handles, this.g.points, this.g.head);
    this.g.head.setAttribute("visibility", "hidden");
    this.area = h("div", { class: "shape-area", tabindex: 0, role: "application",
      "aria-label": `Shape ${n} curve editor. Comma and period select points; arrow keys move the selected point; S smooths it; H makes it a step; Delete removes it.` }, this.svg);
    const toolSeg = h("div", { class: "seg seg-small", role: "radiogroup", "aria-label": "Editing tool" });
    this.toolBtns = ["points", "steps"].map((t) => h("button", { type: "button", class: "seg-btn", role: "radio", text: t === "points" ? "Points" : "Steps", onclick: () => this.setTool(t) }));
    toolSeg.append(...this.toolBtns);
    this.snapBtn = h("button", { type: "button", class: "btn btn-small", "aria-pressed": "true", title: "Snap to the beat grid (hold Shift to place freely)", onclick: () => { this.snap = !this.snap; this.snapBtn.setAttribute("aria-pressed", String(this.snap)); } }, "Snap");
    const presets = h("button", { type: "button", class: "btn btn-small btn-quiet", onclick: (e) => this.presetMenu(e) }, "Curves\u2026");
    this.hint = h("span", { class: "shape-hint" });
    this.bar = h("div", { class: "shape-bar" }, toolSeg, this.snapBtn, presets, this.hint);
    this.root = h("div", { class: "shape-editor" }, this.bar, this.area);
    this.setTool("points");

    this.load();
    this.m.onShapes(() => { this.load(); this.draw(); });
    for (const id of ["curve", "loop", "length", "sync"]) this.m.on(this.pre + id, () => { this.load(); this.draw(); });
    this.app.onTransport(() => this.draw());
    new ResizeObserver(() => this.resize()).observe(this.area);
    this.app.modMeters.on((mm) => this.playhead(mm.active ? mm.shape(n - 1) : null));
    this.bindPointer();
    this.bindKeys();
  }

  setTool(t) {
    this.tool = t;
    this.toolBtns.forEach((b, i) => b.setAttribute("aria-checked", String(["points", "steps"][i] === t)));
    this.hint.textContent = t === "points"
      ? "Click a point to show its handles, then drag them to curve the line. Double-click to add or remove a point; right-click a point for more."
      : "Click or drag to set each step's level.";
    this.draw();
  }

  // Data ---------------------------------------------------------------------------
  curveIndex() { return Math.max(0, Math.round(this.m.get(this.pre + "curve")) - 1); }
  load() {
    this.all = this.m.shapes();
    const s = this.all[this.n - 1] || (this.all[this.n - 1] = { curves: [] });
    while (s.curves.length <= this.curveIndex()) s.curves.push({ points: [[0, 1, -0.5, 0], [1, 0, 0, 0]] });
    this.curve = s.curves[this.curveIndex()];
    this.preview = null;
    if (this.sel >= this.curve.points.length) this.sel = -1;
  }
  // Older curves switch to handles the first time they're edited; until then
  // they display (and play) exactly as saved.
  editable() { skToHandles(this.curve.points); this.preview = null; return this.curve.points; }
  // Points with handles for display: an older curve shows the handles it will
  // get, without changing it until it's edited.
  shown() {
    const pts = this.curve.points;
    if (pts.every(skHasHandles)) return pts;
    if (!this.preview) { this.preview = pts.map((p) => p.slice()); skToHandles(this.preview); }
    return this.preview;
  }
  commit() {
    // Keep points ordered and the ends pinned to 0 and 1.
    const p = this.curve.points;
    this.preview = null;
    p.sort((a, b) => a[0] - b[0]);
    p[0][0] = 0;
    p[p.length - 1][0] = 1;
    // Write only this shape's curve into the current data: other shape
    // editors may have changed theirs since this one loaded.
    const fresh = this.m.shapes();
    const mine = this.all[this.n - 1];
    fresh[this.n - 1] = mine;
    this.all = fresh;
    this.m.setShapes(fresh, true);
    this.draw();
  }
  lengthBeats() {
    if (this.m.get(this.pre + "sync") < 0.5) return 0;
    const p = this.m.param(this.pre + "length");
    return skDivisionBeats(p.choices[Math.round(this.m.get(p.index))], this.app.transport);
  }
  snapStep() {
    const beats = this.lengthBeats();
    if (!beats) return 1 / 16;
    return Math.max(1 / 64, 0.25 / beats);  // sixteenth notes
  }

  // Geometry -------------------------------------------------------------------------
  resize() {
    const w = Math.max(240, Math.round(this.area.clientWidth));
    this.W = w;
    this.H = w < 480 ? 140 : 170;
    this.svg.setAttribute("viewBox", `0 0 ${this.W} ${this.H}`);
    this.svg.setAttribute("width", this.W);
    this.svg.setAttribute("height", this.H);
    this.draw();
  }
  px(x) { return this.pad + x * (this.W - 2 * this.pad); }
  py(y) { return this.pad + (1 - y) * (this.H - 2 * this.pad); }
  sx() { return this.W - 2 * this.pad; }   // pixels per unit x
  sy() { return this.H - 2 * this.pad; }   // pixels per unit y
  local(e) {
    const r = this.svg.getBoundingClientRect();
    return { mx: (e.clientX - r.left) * (this.W / r.width), my: (e.clientY - r.top) * (this.H / r.height) };
  }
  fromEvent(e) {
    const { mx, my } = this.local(e);
    const x = (mx - this.pad) / this.sx(), y = 1 - (my - this.pad) / this.sy();
    return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
  }
  snapX(x, e) {
    if (!this.snap || (e && e.shiftKey)) return x;
    const s = this.snapStep();
    return Math.round(x / s) * s;
  }

  // Where the selected point's handles are drawn (in pixels). Handles of zero
  // length are shown a short way out along the curve's direction, so there's
  // always something to grab.
  handlePositions(i) {
    const pts = this.shown(), p = pts[i];
    const out = [];
    const ghost = 26;
    const add = (kind, dx, dy, neighbour) => {
      if (!neighbour) return;
      let hx = this.px(p[0] + dx), hy = this.py(p[1] + dy);
      if (Math.hypot(hx - this.px(p[0]), hy - this.py(p[1])) < 3) {
        const dirx = this.px(neighbour[0]) - this.px(p[0]), diry = this.py(neighbour[1]) - this.py(p[1]);
        const len = Math.hypot(dirx, diry) || 1, reach = Math.min(ghost, len / 3);
        hx = this.px(p[0]) + (dirx / len) * reach; hy = this.py(p[1]) + (diry / len) * reach;
      }
      // A handle outside the editor (from an older patch) is shown pinned to
      // the edge, where it can still be grabbed; dragging brings it inside.
      const top = this.py(1), bottom = this.py(0);
      const pinned = hy < top - 0.5 || hy > bottom + 0.5;
      if (pinned) {
        const cy = Math.min(bottom, Math.max(top, hy));
        hx = this.px(p[0]) + (hx - this.px(p[0])) * ((cy - this.py(p[1])) / ((hy - this.py(p[1])) || 1));
        hy = cy;
      }
      out.push({ kind, x: hx, y: hy, pinned });
    };
    const has = skHasHandles(p);
    if (!p[3]) add("out", has ? Math.min(Math.max(p[4], 0), pts[i + 1] ? (pts[i + 1][0] - p[0]) / 2 : 0) : 0, has ? p[5] : 0, pts[i + 1]);
    add("in", has ? Math.max(Math.min(p[6], 0), pts[i - 1] ? -(p[0] - pts[i - 1][0]) / 2 : 0) : 0, has ? p[7] : 0, pts[i - 1]);
    return out;
  }

  // What's under the pointer, by position rather than by DOM element (the
  // editor redraws between clicks, so element targets go stale).
  hit(e) {
    const { mx, my } = this.local(e);
    const pts = this.curve.points;
    if (Math.round(this.m.get(this.pre + "loop")) === 4) {
      const rx = this.px(this.curve.release >= 0 ? this.curve.release : 1);
      if (Math.abs(mx - rx) <= 8 && my <= 16) return { kind: "rel" };
    }
    if (this.tool === "points" && this.sel >= 0 && this.sel < pts.length) {
      for (const hp of this.handlePositions(this.sel)) if (Math.hypot(mx - hp.x, my - hp.y) < 9) return { kind: "handle", i: this.sel, which: hp.kind };
    }
    let best = null, bd = 10;
    pts.forEach((p, i) => { const d = Math.hypot(mx - this.px(p[0]), my - this.py(p[1])); if (d < bd) { bd = d; best = { kind: "pt", i }; } });
    return best || { kind: "none" };
  }

  // Drawing ----------------------------------------------------------------------------
  draw() {
    if (!this.curve) return;
    const { grid } = this.g;
    grid.textContent = "";
    const beats = this.lengthBeats();
    const t = this.app.transport;
    const lines = [];
    if (beats) {
      const beatUnit = 4 / t.den, barLen = t.num * beatUnit;
      for (let b = 0; b <= beats + 1e-9; b += 0.25) {
        const x = b / beats;
        const kind = Math.abs(b / barLen - Math.round(b / barLen)) < 1e-9 ? "bar" : Math.abs(b / beatUnit - Math.round(b / beatUnit)) < 1e-9 ? "beat" : "sub";
        lines.push([x, kind]);
      }
      if (lines.filter((l) => l[1] === "sub").length > 64) for (const l of lines) if (l[1] === "sub") l[1] = "";
    } else {
      for (let i = 0; i <= 16; i++) lines.push([i / 16, i % 4 === 0 ? "beat" : "sub"]);
    }
    for (const [x, kind] of lines) {
      if (!kind) continue;
      grid.append(svg("line", { class: "grid-" + kind, x1: this.px(x), x2: this.px(x), y1: this.pad, y2: this.H - this.pad }));
    }
    for (const y of [0, 0.5, 1]) grid.append(svg("line", { class: y === 0.5 ? "grid-sub" : "grid-beat", x1: this.pad, x2: this.W - this.pad, y1: this.py(y), y2: this.py(y) }));

    const pts = this.curve.points;
    let d = "";
    const steps = Math.max(120, Math.round(this.W / 2));
    for (let i = 0; i <= steps; i++) {
      const x = i / steps;
      d += (i ? "L" : "M") + this.px(x).toFixed(1) + " " + this.py(skEvalCurve(pts, x)).toFixed(1) + " ";
    }
    this.g.line.setAttribute("d", d);
    this.g.fill.setAttribute("d", d + `L ${this.px(1)} ${this.py(0)} L ${this.px(0)} ${this.py(0)} Z`);

    this.g.points.textContent = "";
    this.g.handles.textContent = "";
    if (this.tool === "points") {
      if (this.sel >= 0 && this.sel < pts.length) {
        const p = this.shown()[this.sel];
        for (const hp of this.handlePositions(this.sel)) {
          this.g.handles.append(svg("line", { class: "handle-arm", x1: this.px(p[0]), y1: this.py(p[1]), x2: hp.x, y2: hp.y }),
            svg("circle", { class: "handle-knob" + (hp.pinned ? " is-pinned" : ""), cx: hp.x, cy: hp.y, r: 4.5 }));
        }
      }
      pts.forEach((p, i) => {
        const smooth = skHasHandles(p) && !p[8];
        this.g.points.append(svg(smooth || !skHasHandles(p) ? "circle" : "rect", Object.assign(
          { class: "shape-point" + (p[3] ? " is-step" : "") + (i === this.sel ? " is-sel" : "") },
          smooth || !skHasHandles(p)
            ? { cx: this.px(p[0]), cy: this.py(p[1]), r: i === this.sel ? 6 : 5 }
            : { x: this.px(p[0]) - 5, y: this.py(p[1]) - 5, width: 10, height: 10, rx: 1.5 })));
      });
    }

    this.g.rel.textContent = "";
    if (Math.round(this.m.get(this.pre + "loop")) === 4) {
      const rx = this.px(this.curve.release >= 0 ? this.curve.release : 1);
      this.g.rel.append(svg("line", { x1: rx, x2: rx, y1: this.pad, y2: this.H - this.pad }),
        svg("rect", { class: "release-grip", x: rx - 6, y: 0, width: 12, height: 12, rx: 2 }));
    }
  }

  playhead(s) {
    if (!s || s.phase < 0) { this.g.head.setAttribute("visibility", "hidden"); return; }
    const x = this.px(s.phase);
    this.g.head.setAttribute("visibility", "visible");
    this.g.head.setAttribute("x1", x); this.g.head.setAttribute("x2", x);
    this.g.head.setAttribute("y1", this.pad); this.g.head.setAttribute("y2", this.H - this.pad);
  }

  // Editing ---------------------------------------------------------------------------
  moveHandle(i, which, e) {
    const pts = this.editable(), p = pts[i];
    const { mx, my } = this.local(e);
    const sx = this.sx(), sy = this.sy();
    let dx = (mx - this.px(p[0])) / sx, dy = -(my - this.py(p[1])) / sy;
    const wOut = pts[i + 1] ? (pts[i + 1][0] - p[0]) / 2 : 0, wIn = pts[i - 1] ? (p[0] - pts[i - 1][0]) / 2 : 0;
    if (e.altKey) p[8] = 1;  // Alt/Option breaks the pair
    dy = Math.min(1 - p[1], Math.max(-p[1], dy));   // keep the handle inside the editor
    if (which === "out") { p[4] = Math.min(Math.max(dx, 0), wOut); p[5] = dy; }
    else { p[6] = Math.max(Math.min(dx, 0), -wIn); p[7] = dy; }
    if (!p[8]) {
      // Smooth point: the other handle points the opposite way, keeping its length.
      const [ax, ay] = which === "out" ? [p[4], p[5]] : [p[6], p[7]];
      const [ox, oy] = which === "out" ? [p[6], p[7]] : [p[4], p[5]];
      const aLen = Math.hypot(ax * sx, ay * sy);
      let oLen = Math.hypot(ox * sx, oy * sy);
      if (oLen < 3) oLen = aLen;
      if (aLen > 0.5) {
        const nx = (-ax * sx / aLen) * oLen / sx, ny = (-ay * sy / aLen) * oLen / sy;
        if (which === "out") [p[6], p[7]] = skFitHandle(p[1], Math.min(nx, 0), ny, -wIn);
        else [p[4], p[5]] = skFitHandle(p[1], Math.max(nx, 0), ny, wOut);
      }
    }
  }

  bindPointer() {
    let drag = null;
    let lastDown = { t: 0, x: 0, y: 0 };
    this.svg.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      // Without this the browser starts selecting text as the drag drifts out
      // of the editor, and a selection over the editor hijacks the next press.
      e.preventDefault();
      window.getSelection().removeAllRanges();
      this.area.focus({ preventScroll: true });
      const now = performance.now();
      const isDouble = now - lastDown.t < 400 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 8;
      lastDown = isDouble ? { t: 0, x: 0, y: 0 } : { t: now, x: e.clientX, y: e.clientY };
      if (isDouble && this.tool === "points") { e.preventDefault(); this.onDouble(e); return; }
      const hit = this.hit(e);
      this.svg.setPointerCapture(e.pointerId);
      if (hit.kind === "rel") { drag = { kind: "rel" }; return; }
      if (this.tool === "steps") { drag = { kind: "steps" }; this.paintStep(e); return; }
      if (hit.kind === "handle") { drag = hit; return; }
      if (hit.kind === "pt") { this.sel = hit.i; drag = { kind: "pt", i: hit.i }; this.draw(); return; }
      this.sel = -1;
      this.draw();
    });
    this.svg.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (drag.kind === "steps") { this.paintStep(e); return; }
      const { x, y } = this.fromEvent(e);
      if (drag.kind === "pt") {
        const pts = this.editable(), i = drag.i;
        const lo = i === 0 ? 0 : pts[i - 1][0], hi = i === pts.length - 1 ? 1 : pts[i + 1][0];
        if (i !== 0 && i !== pts.length - 1) pts[i][0] = Math.min(hi, Math.max(lo, this.snapX(x, e)));
        pts[i][1] = y;
      } else if (drag.kind === "handle") {
        this.moveHandle(drag.i, drag.which, e);
      } else if (drag.kind === "rel") {
        this.curve.release = Math.min(1, Math.max(0, this.snapX(x, e)));
      }
      this.commit();
    });
    const end = () => { drag = null; };
    this.svg.addEventListener("pointerup", end);
    this.svg.addEventListener("pointercancel", end);
    // Double-click (or double-tap), detected here rather than with the dblclick
    // event, which browsers drop when the editor redraws between the clicks.
    this.onDouble = (e) => {
      const hit = this.hit(e);
      if (hit.kind === "pt") { this.removePoint(hit.i); return; }
      if (hit.kind !== "none") return;
      const pts = this.editable();
      if (pts.length >= 64) { this.app.toast("A curve can have up to 64 points."); return; }
      const { x, y } = this.fromEvent(e);
      const sx = this.snapX(x, e);
      if (sx <= 0 || sx >= 1) return;
      const p = [sx, y, 0, 0, 0, 0, 0, 0, 0];
      pts.push(p);
      pts.sort((a, b) => a[0] - b[0]);
      this.sel = pts.indexOf(p);
      skSmoothHandles(pts, this.sel);
      this.commit();
    };
    this.svg.addEventListener("contextmenu", (e) => {
      const hit = this.hit(e);
      if (hit.kind !== "pt") return;
      e.preventDefault();
      this.sel = hit.i;
      this.draw();
      this.pointMenu(hit.i, e.clientX, e.clientY);
    });
  }

  removePoint(i) {
    const pts = this.editable();
    if (i <= 0 || i >= pts.length - 1) { this.app.toast("The first and last points can't be removed, but you can drag them up and down."); return; }
    pts.splice(i, 1);
    this.sel = -1;
    this.commit();
  }

  pointMenu(i, x, y) {
    const pts = this.editable(), p = pts[i];
    const mid = i > 0 && i < pts.length - 1;
    this.app.menu(x, y, [
      { label: "Smooth (handles move together)", run: () => { skSmoothHandles(pts, i); this.commit(); } },
      { label: "Corner (handles move separately)", run: () => { p[8] = 1; this.commit(); } },
      { label: "Straight lines", run: () => { p[4] = p[5] = p[6] = p[7] = 0; p[8] = 1; this.commit(); } },
      { label: p[3] ? "Not a step" : "Step (hold until the next point)", run: () => { p[3] = p[3] ? 0 : 1; this.commit(); } },
      null,
      { label: "Delete point", run: () => this.removePoint(i), disabled: !mid },
    ]);
  }

  // Steps tool: cells on the snap grid, each a flat step.
  paintStep(e) {
    const { x, y } = this.fromEvent(e);
    const step = this.snapStep();
    const cells = Math.round(1 / step);
    const pts = this.curve.points;
    const isSteps = pts.length === cells + 1 && pts.slice(0, -1).every((p, i) => p[3] && Math.abs(p[0] - i * step) < 1e-6);
    const levels = isSteps ? pts.slice(0, -1).map((p) => p[1]) : [...Array(cells).keys()].map((i) => skEvalCurve(pts, (i + 0.5) * step));
    const c = Math.min(cells - 1, Math.floor(x / step));
    levels[c] = Math.round(y * 20) / 20;
    this.curve.points = levels.map((v, i) => [i * step, v, 0, 1]).concat([[1, levels[cells - 1], 0, 0]]);
    this.sel = -1;
    this.commit();
  }

  bindKeys() {
    this.area.addEventListener("keydown", (e) => {
      const n = this.curve.points.length;
      if (e.key === "," || e.key === ".") {
        this.sel = this.sel < 0 ? 0 : (this.sel + (e.key === "." ? 1 : -1) + n) % n;
        e.preventDefault(); e.stopPropagation(); this.draw(); return;
      }
      if (this.sel < 0) return;
      const pts = this.editable(), p = pts[this.sel], fine = e.shiftKey;
      const dx = fine ? 0.005 : this.snapStep(), dy = fine ? 0.01 : 0.05;
      let used = true;
      if (e.key === "ArrowUp") p[1] = Math.min(1, p[1] + dy);
      else if (e.key === "ArrowDown") p[1] = Math.max(0, p[1] - dy);
      else if (e.key === "ArrowLeft" && this.sel > 0 && this.sel < pts.length - 1) p[0] = Math.max(pts[this.sel - 1][0], p[0] - dx);
      else if (e.key === "ArrowRight" && this.sel > 0 && this.sel < pts.length - 1) p[0] = Math.min(pts[this.sel + 1][0], p[0] + dx);
      else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); e.stopPropagation(); this.removePoint(this.sel); return; }
      else if (e.key === "h" || e.key === "H") p[3] = p[3] ? 0 : 1;
      else if (e.key === "s" || e.key === "S") skSmoothHandles(pts, this.sel);
      else used = false;
      if (used) { e.preventDefault(); e.stopPropagation(); this.commit(); }
    });
  }

  presetMenu(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const set = (pts) => { this.curve.points = pts.map((p) => p.slice()); this.sel = -1; this.commit(); };
    this.app.menu(r.left, r.bottom + 4, [
      ...SK_SHAPE_PRESETS.map(([name, pts]) => ({ label: name, run: () => set(pts) })),
      null,
      { label: "Random steps", run: () => {
        const step = this.snapStep(), cells = Math.round(1 / step);
        const lv = [...Array(cells)].map(() => Math.round(Math.random() * 10) / 10);
        set(lv.map((v, i) => [i * step, v, 0, 1]).concat([[1, lv[cells - 1], 0, 0]]));
      } },
      { label: this.curve.release >= 0 ? "Remove release point" : "Add release point at the middle", run: () => {
        this.curve.release = this.curve.release >= 0 ? -1 : 0.5;
        this.commit();
        if (this.curve.release >= 0 && Math.round(this.m.get(this.pre + "loop")) !== 4) this.app.toast('Set Loop to "Release" for the release point to take effect.');
      } },
    ]);
  }
}

class ShapePanel {
  constructor(app, n, title) {
    const pre = `shape${n}.`, m = app.model;
    const { root, controls } = skSection(title || `Shape ${n}`, "shape-panel is-wide");
    this.editor = new ShapeEditor(app, n);
    const body = h("div", { class: "shape-body" }, this.editor.root, controls);
    root.append(body);
    const c = skAddControls(app, controls, [
      [pre + "trigger", "Trigger", "menu"], [pre + "loop", "Loop", "menu"], [pre + "start", "Start", "menu"],
      [pre + "sync", "Sync", "toggle"], [pre + "length", "Length", "menu"], [pre + "time", "Time"],
      [pre + "curve", "Curve", "menu"], [pre + "rate", "Rate"], [pre + "offset", "Offset"], [pre + "depth", "Depth"],
      [pre + "smooth", "Smooth"], [pre + "keyLow", "Lowest key", "menu"], [pre + "keyHigh", "Highest key", "menu"],
      [pre + "velLow", "Lowest vel."], [pre + "velHigh", "Highest vel."]]);
    const sync = (v) => {
      if (c[pre + "length"]) c[pre + "length"].root.hidden = v < 0.5;
      if (c[pre + "time"]) c[pre + "time"].root.hidden = v >= 0.5;
    };
    m.on(pre + "sync", sync);
    sync(m.get(pre + "sync"));
    // Key/velocity ranges only matter for note triggers; a quantised start
    // only for triggers that start the shape (not bar, beat or free).
    const trig = (v) => {
      const t = Math.round(v);
      for (const k of ["keyLow", "keyHigh", "velLow", "velHigh"]) if (c[pre + k]) c[pre + k].root.hidden = t > 1;
      if (c[pre + "start"]) c[pre + "start"].root.hidden = t >= 2 && t <= 4;
    };
    m.on(pre + "trigger", trig);
    trig(m.get(pre + "trigger"));
    // Key ranges read better as note names.
    for (const k of ["keyLow", "keyHigh"]) {
      const sel = c[pre + k] && c[pre + k].select;
      if (sel) for (const o of sel.options) o.textContent = skNoteName(Number(o.value));
    }
    this.root = root;
  }
}

// ---- matrix ---------------------------------------------------------------------------

const SK_SOURCE_GROUPS = [
  ["Envelopes", (s) => /^env\d/.test(s.id)],
  ["LFOs", (s) => /^lfo\d/.test(s.id)],
  ["Shapes", (s) => /^shape\d/.test(s.id)],
  ["Note", (s) => ["velocity", "key", "random", "aftertouch", "note.age", "note.offbeat"].includes(s.id)],
  ["Controllers", (s) => ["modwheel", "bend"].includes(s.id)],
  ["Musical time", (s) => ["beat.phase", "bar.phase", "bar.beat", "downbeat"].includes(s.id)],
  ["Other", (s) => s.id === "const"],
];

function skSourceSelect(model, value, onchange, allowNone) {
  const sel = h("select", { class: "menu-select", onchange: () => onchange(sel.value) });
  if (allowNone) sel.append(h("option", { value: "", text: "No scaling" }));
  const used = new Set();
  for (const [label, test] of SK_SOURCE_GROUPS) {
    const og = h("optgroup", { label });
    for (const s of model.mod.sources) if (test(s)) { og.append(h("option", { value: s.id, text: s.name })); used.add(s.id); }
    if (og.children.length) sel.append(og);
  }
  const custom = model.mod.sources.filter((s) => !used.has(s.id));
  if (custom.length) {
    const og = h("optgroup", { label: model.info.synth.name });
    for (const s of custom) og.append(h("option", { value: s.id, text: s.name }));
    sel.append(og);
  }
  sel.value = value || "";
  return sel;
}

// Bipolar amount slider for a route (not a parameter).
class AmountSlider {
  constructor(value, onchange) {
    this.v = value; this.onchange = onchange;
    this.fill = h("div", { class: "amt-fill" });
    this.track = h("div", { class: "amt-track", role: "slider", tabindex: 0, "aria-label": "Amount", "aria-valuemin": -100, "aria-valuemax": 100 }, h("div", { class: "amt-zero" }), this.fill);
    this.label = h("button", { type: "button", class: "ctl-value amt-value", title: "Type an amount" });
    this.root = h("div", { class: "amt" }, this.track, this.label);
    let start = null;
    this.track.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      this.track.focus({ preventScroll: true });
      this.track.setPointerCapture(e.pointerId);
      start = { x: e.clientX, v: this.v };
    });
    this.track.addEventListener("pointermove", (e) => {
      if (!start) return;
      const w = this.track.clientWidth || 120;
      this.set(start.v + ((e.clientX - start.x) / w) * 2 * (e.shiftKey ? 0.1 : 1));
    });
    this.track.addEventListener("pointerup", () => { start = null; });
    this.track.addEventListener("pointercancel", () => { start = null; });
    this.track.addEventListener("dblclick", () => this.set(0));
    this.track.addEventListener("keydown", (e) => {
      const s = e.shiftKey ? 0.002 : 0.02;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); e.stopPropagation(); this.set(this.v + s); }
      if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); e.stopPropagation(); this.set(this.v - s); }
    });
    this.label.addEventListener("click", () => {
      const input = h("input", { class: "ctl-edit", type: "text", value: (this.v * 100).toFixed(1), "aria-label": "Amount in percent" });
      this.label.replaceWith(input);
      input.select();
      let done = false;
      const finish = (ok) => {
        if (done) return; done = true;
        const n = parseFloat(input.value);
        input.replaceWith(this.label);
        if (ok && Number.isFinite(n)) this.set(n / 100);
      };
      input.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
      input.addEventListener("blur", () => finish(true));
    });
    this.draw();
  }
  set(v) {
    v = Math.max(-1, Math.min(1, v));
    if (v === this.v) return;
    this.v = v;
    this.draw();
    this.onchange(v);
  }
  draw() {
    const a = 50 + Math.min(0, this.v) * 50, b = 50 + Math.max(0, this.v) * 50;
    this.fill.style.left = a + "%";
    this.fill.style.width = (b - a) + "%";
    const pct = this.v * 100;
    this.label.textContent = (pct > 0 ? "+" : "") + (Math.abs(pct) < 10 ? pct.toFixed(1) : pct.toFixed(0)) + "%";
    this.track.setAttribute("aria-valuenow", pct.toFixed(1));
  }
}

class MatrixPanel {
  constructor(app) {
    this.app = app; this.m = app.model;
    const { root } = skSection("Modulation", "matrix-panel is-wide");
    this.list = h("div", { class: "matrix" });
    this.count = h("span", { class: "matrix-count" });
    this.add = h("button", { type: "button", class: "btn", onclick: () => this.addRoute() }, "Add route");
    root.append(this.list, h("div", { class: "matrix-foot" }, this.add, this.count));
    this.root = root;
    // Rows edit the matrix themselves; rebuilding them mid-drag would end the
    // drag, so only rebuild for changes made elsewhere (presets, Modulate\u2026).
    this.m.onMod(() => { if (!this.editing) this.build(); });
    app.modMeters.on((mm) => this.meter(mm));
    this.build();
  }
  build() {
    const routes = this.m.routes();
    this.routes = routes;
    this.list.textContent = "";
    this.meters = [];
    if (!routes.length) {
      this.list.append(h("p", { class: "matrix-empty", text: "Nothing is modulated yet. Add a route here, or right-click a knob and choose Modulate." }));
    }
    const dsts = this.m.modulatable();
    routes.forEach((r, i) => {
      const update = (patch) => { const next = this.m.routes(); Object.assign(next[i], patch); if (patch.via === "") delete next[i].via; this.m.setRoutes(next); };
      const setAmt = (v) => {
        const next = this.m.routes();
        next[i].amt = v;
        this.editing = true;
        try { this.m.setRoutes(next); } finally { this.editing = false; }
      };
      const src = skSourceSelect(this.m, r.src, (v) => update({ src: v }));
      src.setAttribute("aria-label", `Route ${i + 1} source`);
      const dst = h("select", { class: "menu-select", "aria-label": `Route ${i + 1} destination`, onchange: () => update({ dst: dst.value }) });
      const groups = new Map();
      for (const p of dsts) {
        const g = p.group || "Sound";
        if (!groups.has(g)) groups.set(g, h("optgroup", { label: g }));
        groups.get(g).append(h("option", { value: p.id, text: p.name }));
      }
      for (const og of groups.values()) dst.append(og);
      dst.value = r.dst;
      const amt = new AmountSlider(r.amt, setAmt);
      const via = skSourceSelect(this.m, r.via, (v) => update({ via: v }), true);
      via.setAttribute("aria-label", `Route ${i + 1} scaled by`);
      const meter = h("span", { class: "route-meter" }, h("span", { class: "route-meter-fill" }));
      this.meters.push({ el: meter.firstChild, src: this.m.sourceIndex.get(r.src) });
      const remove = h("button", { type: "button", class: "btn btn-quiet btn-small", "aria-label": `Remove route ${i + 1}`, onclick: () => { const next = this.m.routes(); next.splice(i, 1); this.m.setRoutes(next); } }, "Remove");
      this.list.append(h("div", { class: "route" },
        h("div", { class: "route-src" }, meter, src),
        h("span", { class: "route-to", text: "to" }), dst, amt.root,
        h("label", { class: "route-via" }, h("span", { text: "scaled by" }), via), remove));
    });
    this.count.textContent = `${routes.length} of ${this.m.mod.slots} routes`;
    this.add.disabled = routes.length >= this.m.mod.slots;
  }
  addRoute(src, dst, amt = 0.25) {
    const routes = this.m.routes();
    if (routes.length >= this.m.mod.slots) { this.app.toast(`All ${this.m.mod.slots} modulation routes are in use. Remove one to add another.`); return false; }
    const firstLfo = this.m.mod.sources.find((s) => s.id.startsWith("lfo")) || this.m.mod.sources[0];
    routes.push({ src: src || firstLfo.id, dst: dst || this.m.modulatable()[0].id, amt });
    this.m.setRoutes(routes);
    return true;
  }
  meter(mm) {
    for (const r of this.meters || []) {
      const v = mm.active ? Math.max(-1, Math.min(1, mm.source(r.src))) : 0;
      r.el.style.left = (50 + Math.min(0, v) * 50) + "%";
      r.el.style.width = Math.abs(v) * 50 + "%";
    }
  }
}

// ---- presets.js
// Preset bar: factory presets (embedded in the build), your own presets
// (kept in this browser), import/export as files, and the session (the
// current sound is restored when you come back).

// Settings that outlive the page: the browser's local storage, or in the
// plugin a file shared by every instance (the plugin passes its contents in
// and is told about each change).
const skStore = {
  subs: new Map(),
  get(key, fallback) {
    if (skHost) { const v = (skHost.store || {})[key]; return v === undefined || v === null ? fallback : JSON.parse(JSON.stringify(v)); }
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
  },
  set(key, value) {
    if (skHost) {
      (skHost.store = skHost.store || {})[key] = JSON.parse(JSON.stringify(value));
      window.__JUCE__.backend.emitEvent("sk", { t: "store", key, value });
      return true;
    }
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  },
  // Another plugin window changed a setting.
  external(key, value) {
    if (skHost) (skHost.store = skHost.store || {})[key] = value;
    for (const fn of this.subs.get(key) || []) fn(value);
  },
  on(key, fn) {
    if (!this.subs.has(key)) this.subs.set(key, new Set());
    this.subs.get(key).add(fn);
  },
};

class PresetBar {
  constructor(app) {
    this.app = app;
    this.model = app.model;
    this.key = (k) => `synthkit:${this.model.info.synth.id}:${k}`;
    this.factory = this.model.info.presets
      .filter((p) => p.patch)
      .map((p) => ({ name: p.patch.name || p.path, patch: p.patch, file: p.path }));
    this.user = skStore.get(this.key("presets"), {});
    skStore.on(this.key("presets"), () => { this.user = skStore.get(this.key("presets"), {}); this.refresh(); });
    this.current = { kind: "factory", name: "Init" };
    this.listeners = new Set();   // a synth's own page following the presets
    this.build();
    this.model.onAny(() => this.changed());
  }

  build() {
    this.select = h("select", { class: "preset-select", "aria-label": "Preset", onchange: () => this.pick(this.select.value) });
    this.dirtyDot = h("span", { class: "preset-dirty", title: "Changed since loaded", "aria-label": "Changed since loaded", hidden: true });
    this.nameInput = h("input", { class: "preset-name", type: "text", "aria-label": "Preset name", hidden: true });
    this.nameInput.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") this.finishNaming(true);
      if (e.key === "Escape") this.finishNaming(false);
    });
    this.nameInput.addEventListener("blur", () => { if (!this.nameInput.hidden) this.finishNaming(true); });
    this.fileInput = h("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: () => this.importFile() });
    const btn = (label, title, fn, cls = "") => h("button", { type: "button", class: "btn " + cls, title, "aria-label": title, onclick: fn }, label);
    this.saveBtn = btn("Save", "Save preset", () => this.save());
    this.moreBtn = btn("More", "More preset actions", (e) => this.moreMenu(e), "btn-quiet");
    this.root = h("div", { class: "presets" },
      btn("\u2039", "Previous preset", () => this.step(-1), "btn-icon"),
      h("div", { class: "preset-field" }, this.select, this.nameInput, this.dirtyDot),
      btn("\u203a", "Next preset", () => this.step(1), "btn-icon"),
      this.saveBtn, this.moreBtn, this.fileInput);
    this.refresh();
  }

  entries() {
    return [
      ...this.factory.map((p) => ({ kind: "factory", name: p.name, patch: p.patch })),
      ...Object.keys(this.user).sort((a, b) => a.localeCompare(b)).map((n) => ({ kind: "user", name: n, patch: this.user[n] })),
    ];
  }
  value(e) { return e.kind + ":" + e.name; }

  refresh() {
    this.select.textContent = "";
    const groups = { factory: h("optgroup", { label: "Factory" }), user: h("optgroup", { label: "Yours" }) };
    for (const e of this.entries()) groups[e.kind].append(h("option", { value: this.value(e), text: e.name }));
    if (this.current.kind === "session") groups.user.prepend(h("option", { value: "session:", text: this.current.name + " (unsaved)" }));
    for (const g of Object.values(groups)) if (g.children.length) this.select.append(g);
    this.select.value = this.current.kind === "session" ? "session:" : this.value(this.current);
    this.dirtyDot.hidden = !this.model.dirty;
    this.notify();
  }

  notify() {
    const state = { ...this.current, dirty: !!this.model.dirty };
    for (const fn of this.listeners) { try { fn(state); } catch (err) { console.error(err); } }
  }

  changed() {
    const was = this.dirtyDot.hidden;
    this.dirtyDot.hidden = !this.model.dirty;
    if (was !== this.dirtyDot.hidden) this.notify();
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.saveSession(), 400);
  }

  saveSession() {
    // In the plugin the DAW project keeps the sound; the plugin just notes
    // which preset is showing.
    if (skHost) { this.app.audio.send({ t: "meta", ui: { current: this.current, dirty: this.model.dirty } }); return; }
    skStore.set(this.key("session"), { patch: this.model.savePatch(), current: this.current, dirty: this.model.dirty });
  }

  // The plugin's sound (on opening the window, or when the DAW loads a project).
  applyHostState(patch, ui) {
    const res = this.model.loadPatch(patch, { fromHost: true });
    if (!res.ok) { this.app.toast(`Couldn't show the plugin's sound: ${res.error}`, "error"); return false; }
    ui = ui || {};
    const name = patch && patch.name;
    const factory = this.factory.find((p) => p.name === name);
    this.current = ui.current || (factory ? { kind: "factory", name } : { kind: "session", name: name || "Untitled" });
    this.model.dirty = !!ui.dirty;
    this.refresh();
    return true;
  }

  restoreSession() {
    if (skHost) return this.applyHostState(skHost.state.patch, skHost.state.ui);
    const s = skStore.get(this.key("session"), null);
    if (s && s.patch && this.model.loadPatch(s.patch).ok) {
      this.current = s.current || { kind: "session", name: s.patch.name || "Untitled" };
      this.model.dirty = !!s.dirty;
      this.refresh();
      return true;
    }
    // First visit: start from Init if the synth has one.
    const init = this.factory.find((p) => /(^|\/)init\.json$/.test(p.file)) || this.factory[0];
    if (init) this.load({ kind: "factory", name: init.name, patch: init.patch });
    return false;
  }

  load(e) {
    const res = this.model.loadPatch(e.patch);
    if (!res.ok) { this.app.toast(`Couldn't load "${e.name}": ${res.error}`, "error"); return false; }
    for (const w of res.warnings || []) this.app.toast(`${e.name}: ${w}`, "warn");
    this.current = { kind: e.kind, name: e.name };
    this.refresh();
    this.saveSession();
    return true;
  }

  pick(v) {
    const e = this.entries().find((x) => this.value(x) === v);
    if (e) this.load(e);
  }
  step(d) {
    const list = this.entries();
    if (!list.length) return;
    let i = list.findIndex((x) => x.kind === this.current.kind && x.name === this.current.name);
    i = i < 0 ? 0 : (i + d + list.length) % list.length;
    this.load(list[i]);
  }

  save() {
    if (this.current.kind === "user") this.store(this.current.name);
    else this.startNaming("save", this.current.kind === "factory" ? this.current.name + " copy" : this.current.name);
  }
  store(name) {
    this.model.setName(name);
    this.user[name] = this.model.savePatch();
    if (!skStore.set(this.key("presets"), this.user)) this.app.toast("This browser isn't letting the page store presets. Use Export to keep a file instead.", "error");
    this.model.dirty = false;
    this.current = { kind: "user", name };
    this.refresh();
    this.saveSession();
    this.app.toast(`Saved "${name}"`);
  }

  startNaming(mode, initial) {
    this.naming = mode;
    this.select.hidden = true;
    this.nameInput.hidden = false;
    this.nameInput.value = initial;
    this.nameInput.focus();
    this.nameInput.select();
  }
  finishNaming(commit) {
    const name = this.nameInput.value.trim();
    const mode = this.naming;
    this.naming = null;
    this.nameInput.hidden = true;
    this.select.hidden = false;
    if (!commit || !name) return;
    if (mode === "rename") this.renameTo(name);
    else this.store(name);
  }

  renameTo(name) {
    if (this.current.kind !== "user" || !name) return false;
    const p = this.user[this.current.name];
    delete this.user[this.current.name];
    this.user[name] = { ...p, name };
    this.current = { kind: "user", name };
    skStore.set(this.key("presets"), this.user);
    this.model.setName(name);
    this.refresh();
    this.saveSession();
    return true;
  }

  remove() {
    if (this.current.kind !== "user") return;
    const name = this.current.name;
    delete this.user[name];
    skStore.set(this.key("presets"), this.user);
    this.current = { kind: "session", name };
    this.model.dirty = true;
    this.refresh();
    this.app.toast(`Deleted "${name}". The sound stays loaded until you pick another preset.`);
  }

  init() {
    const init = this.factory.find((p) => /(^|\/)init\.json$/.test(p.file));
    this.load(init ? { kind: "factory", name: init.name, patch: init.patch }
                   : { kind: "factory", name: "Init", patch: { synth: this.model.info.synth.id, name: "Init", params: {} } });
  }

  exportFile() {
    const patch = this.model.savePatch();
    if (skHost) { this.app.audio.send({ t: "export", name: patch.name || "patch", json: JSON.stringify(patch, null, 2) }); return; }
    const blob = new Blob([JSON.stringify(patch, null, 2) + "\n"], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: (patch.name || "patch").replace(/[^\w\- ]+/g, "") + ".json" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  async importFile() {
    const f = this.fileInput.files[0];
    this.fileInput.value = "";
    if (!f) return;
    this.importText(await f.text(), f.name);
  }
  startImport() {
    if (skHost) this.app.audio.send({ t: "import" });   // the plugin shows a file dialog
    else this.fileInput.click();
  }
  importText(text, fileName) {
    const res = this.model.loadPatch(text);
    if (!res.ok) { this.app.toast(`Couldn't import ${fileName}: ${res.error}`, "error"); return; }
    for (const w of res.warnings || []) this.app.toast(`${fileName}: ${w}`, "warn");
    let name = this.model.patchName || fileName.replace(/\.json$/i, "");
    for (let k = 2; this.user[name]; k++) name = `${this.model.patchName} ${k}`;
    this.store(name);
  }

  moreMenu(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const user = this.current.kind === "user";
    this.app.menu(r.left, r.bottom + 4, [
      { label: "Save as new\u2026", run: () => this.startNaming("save", this.current.name + (user ? " 2" : "")) },
      { label: "Rename\u2026", run: () => this.startNaming("rename", this.current.name), disabled: !user },
      { label: "Delete", run: () => this.remove(), disabled: !user },
      null,
      { label: "Export to file", run: () => this.exportFile() },
      { label: "Import from file\u2026", run: () => this.startImport() },
      null,
      { label: "Start from Init", run: () => this.init() },
    ]);
  }
}

// ---- keyboard.js
// On-screen keyboard, pitch/mod wheels, and the computer keyboard:
//   A W S E D F T G Y H U J K O L P ; '  play notes
//   Z / X  octave down / up     C / V  velocity down / up

const SK_KEYMAP = {
  KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9,
  KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16, Quote: 17,
};
const SK_BLACK = new Set([1, 3, 6, 8, 10]);

function skNoteName(n) { return ["C", "C\u266f", "D", "D\u266f", "E", "F", "F\u266f", "G", "G\u266f", "A", "A\u266f", "B"][n % 12] + (Math.floor(n / 12) - 1); }

class Keyboard {
  constructor(app) {
    this.app = app;
    this.base = skStore.get("synthkit:keyboard:base", 36);  // lowest C on screen
    this.typingOctave = skStore.get("synthkit:keyboard:typing", 60);
    this.velocity = skStore.get("synthkit:keyboard:velocity", 100);
    this.pointers = new Map();     // pointerId -> note
    this.typed = new Map();        // key code -> note
    this.keys = new Map();         // note -> element
    this.lit = new Map();          // note -> count (all sources)
    this.typing = true;            // computer keys play notes (off on a page without the keyboard)
    this.build();
    document.addEventListener("keydown", (e) => this.key(e, true));
    document.addEventListener("keyup", (e) => this.key(e, false));
    window.addEventListener("blur", () => this.releaseTyped());
    new ResizeObserver(() => this.layout()).observe(this.keysEl);
  }

  build() {
    this.keysEl = h("div", { class: "keys", role: "group", "aria-label": "Keyboard" });
    this.range = h("span", { class: "kb-range" });
    this.velLabel = h("span", { class: "kb-vel" });
    const shift = (d) => { this.base = Math.min(96, Math.max(0, this.base + d)); skStore.set("synthkit:keyboard:base", this.base); this.layout(); };
    this.bend = this.wheel("Pitch bend", true, (v) => {
      const val = Math.round((v + 1) * 8191.5);
      this.app.sendMidi([0xe0, val & 127, (val >> 7) & 127]);
    });
    this.mod = this.wheel("Mod wheel", false, (v) => this.app.sendMidi([0xb0, 1, Math.round(v * 127)]));
    this.root = h("div", { class: "keyboard" },
      h("div", { class: "kb-wheels" }, this.bend.root, this.mod.root),
      h("div", { class: "kb-main" },
        this.bar = h("div", { class: "kb-bar" },
          h("div", { class: "kb-octave" },
            h("button", { type: "button", class: "btn btn-icon", title: "Octave down", "aria-label": "Octave down", onclick: () => shift(-12) }, "\u2039"),
            this.range,
            h("button", { type: "button", class: "btn btn-icon", title: "Octave up", "aria-label": "Octave up", onclick: () => shift(12) }, "\u203a")),
          this.slot = h("div", { class: "kb-slot" }),
          h("span", { class: "kb-spacer" }),
          h("span", { class: "kb-hint", title: "Z / X shift the octave, C / V change velocity" }, "Play with A\u2013K on your keyboard"),
          this.velLabel),
        this.keysEl));
    this.keysEl.addEventListener("pointerdown", (e) => this.press(e));
    this.keysEl.addEventListener("pointermove", (e) => this.slide(e));
    for (const t of ["pointerup", "pointercancel", "pointerleave"]) this.keysEl.addEventListener(t, (e) => this.lift(e));
    this.showVelocity();
  }

  addToBar(...els) { if (this.slot.parentNode) this.slot.replaceWith(...els); }

  wheel(label, spring, send) {
    const thumb = h("div", { class: "wheel-thumb" });
    const el = h("div", { class: "wheel" + (spring ? " is-bend" : ""), role: "slider", tabindex: 0, "aria-label": label, "aria-valuemin": spring ? -1 : 0, "aria-valuemax": 1 }, thumb);
    const w = { value: spring ? 0 : 0, root: h("div", { class: "wheel-wrap" }, el, h("div", { class: "wheel-label", text: spring ? "Bend" : "Mod" })) };
    const setv = (v) => {
      v = Math.max(spring ? -1 : 0, Math.min(1, v));
      if (v === w.value) return;
      w.value = v;
      const n = spring ? (v + 1) / 2 : v;
      thumb.style.bottom = `calc(${(n * 100).toFixed(1)}% - ${(n * 14).toFixed(1)}px)`;
      el.setAttribute("aria-valuenow", v.toFixed(2));
      if (w.ready) send(v);
    };
    w.set = setv;
    w.value = NaN;  // force the first draw
    setv(0);
    w.ready = true;
    const fromY = (e) => { const r = el.getBoundingClientRect(); const n = 1 - (e.clientY - r.top) / r.height; return spring ? n * 2 - 1 : n; };
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); w.drag = true; setv(fromY(e)); });
    el.addEventListener("pointermove", (e) => { if (w.drag) setv(fromY(e)); });
    const up = () => { w.drag = false; if (spring) setv(0); };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") { e.preventDefault(); setv(w.value + 0.05); }
      if (e.key === "ArrowDown") { e.preventDefault(); setv(w.value - 0.05); }
    });
    if (spring) el.addEventListener("keyup", (e) => { if (e.key.startsWith("Arrow")) setv(0); });
    return w;
  }

  layout() {
    // As many octaves as fit at a comfortable key width, up to five.
    const width = this.keysEl.clientWidth || 600;
    const octaves = Math.max(1, Math.min(5, Math.floor(width / (7 * (width < 520 ? 34 : 30)))));
    const low = this.base, high = Math.min(127, low + octaves * 12);
    this.keysEl.textContent = "";
    this.keys.clear();
    const wcount = [...Array(high - low + 1).keys()].filter((i) => !SK_BLACK.has((low + i) % 12)).length;
    let wi = 0;
    for (let n = low; n <= high; n++) {
      const black = SK_BLACK.has(n % 12);
      const k = h("div", { class: "key " + (black ? "key-black" : "key-white"), "data-note": n, "aria-label": skNoteName(n) });
      if (black) k.style.left = `calc(${(wi / wcount) * 100}% - var(--black-w) / 2)`;
      else {
        k.style.left = `${(wi / wcount) * 100}%`;
        k.style.width = `${100 / wcount}%`;
        if (n % 12 === 0) k.append(h("span", { class: "key-name", text: skNoteName(n) }));
        wi++;
      }
      if (this.lit.get(n)) k.classList.add("is-down");
      this.keysEl.append(k);
      this.keys.set(n, k);
    }
    this.range.textContent = `${skNoteName(low)} \u2013 ${skNoteName(high)}`;
  }

  velocityFrom(e, key) {
    const r = key.getBoundingClientRect();
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    return Math.round(40 + y * 87);  // nearer the front of the key = louder
  }
  noteAt(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const key = el && el.closest && el.closest(".key");
    return key ? { note: Number(key.dataset.note), key } : null;
  }
  press(e) {
    if (e.button !== 0) return;
    e.preventDefault();
    const hit = this.noteAt(e);
    if (!hit) return;
    this.pointers.set(e.pointerId, hit.note);
    this.app.noteOn(hit.note, this.velocityFrom(e, hit.key));
  }
  slide(e) {
    if (!this.pointers.has(e.pointerId)) return;
    const hit = this.noteAt(e);
    const cur = this.pointers.get(e.pointerId);
    if (!hit || hit.note === cur) return;
    this.app.noteOff(cur);
    this.pointers.set(e.pointerId, hit.note);
    this.app.noteOn(hit.note, this.velocityFrom(e, hit.key));
  }
  lift(e) {
    if (!this.pointers.has(e.pointerId)) return;
    this.app.noteOff(this.pointers.get(e.pointerId));
    this.pointers.delete(e.pointerId);
  }

  key(e, down) {
    if (!this.typing) return;
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
    if (down && !e.repeat) {
      if (e.code === "KeyZ") { this.typingOctave = Math.max(0, this.typingOctave - 12); this.app.toast(`Typing keys start at ${skNoteName(this.typingOctave)}`); skStore.set("synthkit:keyboard:typing", this.typingOctave); return; }
      if (e.code === "KeyX") { this.typingOctave = Math.min(108, this.typingOctave + 12); this.app.toast(`Typing keys start at ${skNoteName(this.typingOctave)}`); skStore.set("synthkit:keyboard:typing", this.typingOctave); return; }
      if (e.code === "KeyC") { this.velocity = Math.max(10, this.velocity - 15); this.showVelocity(); return; }
      if (e.code === "KeyV") { this.velocity = Math.min(127, this.velocity + 15); this.showVelocity(); return; }
    }
    if (!(e.code in SK_KEYMAP)) return;
    // Arrow-key style focus on a control shouldn't swallow notes; but a focused
    // slider uses arrows, not letters, so letters always play.
    e.preventDefault();
    if (down) {
      if (e.repeat || this.typed.has(e.code)) return;
      const n = this.typingOctave + SK_KEYMAP[e.code];
      if (n > 127) return;
      this.typed.set(e.code, n);
      this.app.noteOn(n, this.velocity);
    } else if (this.typed.has(e.code)) {
      this.app.noteOff(this.typed.get(e.code));
      this.typed.delete(e.code);
    }
  }
  releaseTyped() {
    for (const n of this.typed.values()) this.app.noteOff(n);
    this.typed.clear();
    for (const n of this.pointers.values()) this.app.noteOff(n);
    this.pointers.clear();
  }
  showVelocity() {
    this.velLabel.textContent = `Velocity ${this.velocity}`;
    skStore.set("synthkit:keyboard:velocity", this.velocity);
  }

  // Light keys for notes from any source (mouse, typing, MIDI).
  light(n, on) {
    const c = (this.lit.get(n) || 0) + (on ? 1 : -1);
    if (c <= 0) this.lit.delete(n); else this.lit.set(n, c);
    const k = this.keys.get(n);
    if (k) k.classList.toggle("is-down", c > 0);
  }
  clearLights() {
    this.lit.clear();
    for (const k of this.keys.values()) k.classList.remove("is-down");
  }
}

// ---- midi.js
// Web MIDI input and MIDI learn. Learned CCs move their control and are not
// passed on to the synth (so CC 1 learned to cutoff stops being mod wheel).

class MidiInput {
  constructor(app) {
    this.app = app;
    this.key = `synthkit:${app.model.info.synth.id}:midiLearn`;
    this.map = skStore.get(this.key, {});       // cc -> param id
    this.learning = null;
    this.access = null;
    this.choice = skStore.get("synthkit:midi:input", "all");
    this.build();
  }

  build() {
    this.btn = h("button", { type: "button", class: "btn btn-quiet", onclick: () => this.connect() }, "Connect MIDI");
    this.select = h("select", { class: "midi-select", "aria-label": "MIDI input", hidden: true, onchange: () => this.choose(this.select.value) });
    this.dot = h("span", { class: "midi-dot", "aria-hidden": "true" });
    this.root = h("div", { class: "midi" }, this.dot, this.btn, this.select);
    if (skHost) return;   // the plugin gets MIDI from the DAW
    if (!navigator.requestMIDIAccess) {
      this.btn.disabled = true;
      this.btn.textContent = "No MIDI in this browser";
      this.btn.title = "Web MIDI works in Chrome, Edge, Firefox and Opera.";
    } else if (skStore.get("synthkit:midi:auto", false)) {
      this.connect();
    }
  }

  async connect() {
    try {
      this.access = await navigator.requestMIDIAccess({ sysex: false });
    } catch (err) {
      this.app.toast("MIDI access was blocked. Allow MIDI for this page in the browser's site settings, then try again.", "error");
      return;
    }
    skStore.set("synthkit:midi:auto", true);
    this.access.onstatechange = () => this.refresh();
    this.btn.hidden = true;
    this.select.hidden = false;
    this.refresh();
  }

  refresh() {
    const inputs = [...this.access.inputs.values()];
    this.select.textContent = "";
    this.select.append(h("option", { value: "all", text: inputs.length ? "All MIDI inputs" : "No MIDI devices found" }));
    for (const i of inputs) this.select.append(h("option", { value: i.id, text: i.name || i.id }));
    if (![...this.select.options].some((o) => o.value === this.choice)) this.choice = "all";
    this.select.value = this.choice;
    for (const i of inputs) i.onmidimessage = (e) => { if (this.choice === "all" || this.choice === i.id) this.message(e.data, e.timeStamp); };
  }
  choose(id) { this.choice = id; skStore.set("synthkit:midi:input", id); }

  message(d, time) {
    const st = d[0];
    if (st >= 0xf0) {
      // Clock and transport messages, when following MIDI clock.
      if (this.app.clockSource === "midi" && (st === 0xf8 || st === 0xfa || st === 0xfb || st === 0xfc || st === 0xf2)) this.app.clock.message(d, time || performance.now());
      return;
    }
    this.dot.classList.remove("is-flash");
    void this.dot.offsetWidth;
    this.dot.classList.add("is-flash");
    if (this.app.tapMidi(d)) return;   // a synth's own page took it
    const type = st & 0xf0;
    if (type === 0xb0) {
      const cc = d[1], v = d[2];
      if (this.learning) { this.assign(cc, this.learning); return; }
      const id = this.map[cc];
      if (id && this.app.model.param(id)) { this.app.model.setNorm(id, v / 127, "midi"); return; }
    }
    if (type === 0x90 && d[2] > 0) this.app.keyboard.light(d[1], true);
    else if (type === 0x80 || (type === 0x90 && d[2] === 0)) this.app.keyboard.light(d[1], false);
    this.app.sendMidi([d[0], d[1] | 0, d[2] | 0], true);
  }

  learn(ctl) {
    if (!this.access) this.connect();
    if (this.learning) this.learningCtl.root.classList.remove("is-learning");
    this.learning = ctl.p.id;
    this.learningCtl = ctl;
    ctl.root.classList.add("is-learning");
    this.app.toast(`Move a knob or slider on your MIDI controller to control ${ctl.label}. Press Esc to cancel.`);
  }
  cancelLearn() {
    if (!this.learning) return;
    this.learningCtl.root.classList.remove("is-learning");
    this.learning = null;
  }
  assign(cc, id) {
    for (const [k, v] of Object.entries(this.map)) if (v === id) delete this.map[k];
    this.map[cc] = id;
    skStore.set(this.key, this.map);
    const ctl = this.learningCtl;
    this.cancelLearn();
    this.app.refreshLearned();
    this.app.toast(`${ctl.label} now follows CC ${cc}`);
  }
  forget(id) {
    for (const [k, v] of Object.entries(this.map)) if (v === id) delete this.map[k];
    skStore.set(this.key, this.map);
    this.app.refreshLearned();
  }
  ccFor(id) {
    for (const [k, v] of Object.entries(this.map)) if (v === id) return Number(k);
    return null;
  }
}

// ---- clock.js
// Following an external MIDI clock (24 ticks per quarter note, plus start,
// continue, stop and song position). Tempo comes from the tick spacing; the
// position is sent to the audio thread every beat, which absorbs small
// differences smoothly.

class MidiClock {
  constructor(app) {
    this.app = app;
    this.ticks = 0;
    this.last = 0;
    this.interval = 0;      // smoothed ms per tick
    this.running = false;
    this.lastTick = 0;
  }
  get bpm() { return this.interval > 0 ? 60000 / (this.interval * 24) : this.app.transport.bpm; }

  message(d, time) {
    const st = d[0];
    if (st === 0xf8) {
      if (this.last) {
        const dt = time - this.last;
        if (dt > 2 && dt < 200) this.interval = this.interval ? this.interval + (dt - this.interval) * 0.08 : dt;
      }
      this.last = time;
      this.lastTick = performance.now();
      if (!this.running) return;
      this.ticks++;
      if (this.ticks % 24 === 0) this.send();
    } else if (st === 0xfa) {           // start
      this.ticks = 0; this.running = true; this.send();
    } else if (st === 0xfb) {           // continue
      this.running = true; this.send();
    } else if (st === 0xfc) {           // stop
      this.running = false; this.send();
    } else if (st === 0xf2) {           // song position, in 16ths
      this.ticks = ((d[2] << 7) | d[1]) * 6;
      this.send();
    }
  }
  send() {
    const bpm = Math.round(this.bpm * 10) / 10;
    this.app.followClock(bpm, this.running, this.ticks / 24);
  }
}

// ---- app.js
// Boot and glue: header (presets, tempo, MIDI, output), panels, keyboard,
// toasts and menus.

class App {
  constructor(model, wasmBytes, layout) {
    this.model = model;
    this.wasm = wasmBytes;
    this.layout = layout || {};
    this.host = skHost;          // set when running inside the plugin
    this.audio = skHost ? new HostAudio() : new Audio(wasmBytes);
    this.controls = [];
    this.widgets = new Map();
    this.transport = skStore.get("synthkit:transport", { bpm: 120, playing: false, num: 4, den: 4 });
    this.transport.playing = false;
    this.transportSubs = new Set();
    this.modMeters = new ModMeters(model);
    this.clock = new MidiClock(this);
    this.clockSource = skStore.get("synthkit:clock", "internal");
  }

  boot(rootEl) {
    const m = this.model;
    const theme = this.layout.theme || {};
    if (theme.accent) document.documentElement.style.setProperty("--accent-base", theme.accent);
    const mode = skStore.get("synthkit:theme", "auto");
    if (mode !== "auto") document.documentElement.dataset.theme = mode;

    if (window.__skCustomRegister) {
      try { window.__skCustomRegister({ widget: (name, factory) => this.widgets.set(name, factory) }); }
      catch (err) { console.error(err); this.later(`ui/custom.js failed to load: ${err.message}`, "error"); }
    }

    // Messages to and from the synth (API.md \u00a79b).
    this.messageIds = m.info.messages || [];
    this.messageSubs = new Map();
    this.midiTaps = new Set();        // a page taking MIDI messages (sk.takeMidi)
    this.midiListeners = new Set();   // a page listening to MIDI (sk.onMidi)
    this.spacePlays = true;           // Space starts the tempo clock (a page can turn it off)

    this.presets = new PresetBar(this);
    this.midi = new MidiInput(this);
    this.keyboard = new Keyboard(this);
    this.buildParts();

    this.toasts = h("div", { class: "toasts", role: "status", "aria-live": "polite" });
    this.banner = h("button", { type: "button", class: "start-banner", onclick: () => this.startAudio() },
      h("span", { class: "start-dot", "aria-hidden": "true" }),
      "Sound is off. Click here, or anywhere, to start it.");

    // A synth with ui/page.js brings its own page (API.md \u00a79a); otherwise the
    // kit builds the standard one from layout.json.
    const ownPage = typeof window.__skPage === "function" ? window.__skPage : null;
    const problems = [];
    if (!ownPage) {
      const panels = new Panels(this);
      const panelEl = panels.build(this.layout.sections ? this.layout : null);
      problems.push(...panels.problems);
      rootEl.append(
        this.header(),
        this.banner,
        h("main", { class: "main" }, panelEl),
        this.layout.keyboard === false ? null : this.keyboard.root,
        this.toasts);
      if (this.layout.keyboard === false) this.keyboard.typing = false;
    } else {
      this.keyboard.typing = false;   // until the page mounts the keyboard
      rootEl.classList.add("sk-own-page");
      rootEl.append(this.toasts);
    }
    rootEl.removeAttribute("aria-busy");
    this.keyboard.layout();

    // Tempo saved in patches (features.tempoInPatch): a patch that has one
    // sets the browser's tempo controls.
    this.tempoInPatch = !!m.info.synth.tempoInPatch;
    m.onPatch(() => this.applyPatchTempo());
    // Parameters the engine moved (mapped MIDI controllers, ctx.setParam).
    this.audio.onParams = (changes) => { for (const [i, v] of changes) this.model.applyHost(i, v); };

    this.presets.restoreSession();
    if (this.host) {
      // The plugin makes the sound: changes go straight to it.
      this.model.sink = this.audio.sink();
      this.banner.hidden = true;
      this.audio.onHost = (msg) => this.hostMessage(msg);
    }
    this.audio.onMessages = (list) => this.receiveMessages(list);

    if (ownPage) {
      const pageRoot = h("div", { class: "sk-page" });
      const tpl = document.getElementById("sk-page-html");
      if (tpl) pageRoot.append(tpl.content.cloneNode(true));
      rootEl.prepend(pageRoot);
      this.pageProblems = problems;
      try { ownPage(this.pageApi(), pageRoot); }
      catch (err) { console.error(err); problems.push({ msg: `ui/page.js failed: ${err.message}`, kind: "error" }); }
      this.buildHostBar(pageRoot);
    }

    this.refreshLearned();
    // Live modulation rings on knobs.
    const ringed = this.controls.filter((c) => c.modulated && !c.ringed);
    for (const c of ringed) c.ringed = true;
    this.modMeters.on((mm) => { for (const c of ringed) c.modulated(mm.active ? mm.param(c.p.index) : NaN); });
    this.pageProblems = null;
    for (const p of problems.concat(this.pending || [])) this.toast(p.msg || p, p.kind || "warn");

    // Browsers only allow audio during a click or key press: every one starts
    // (or resumes) it until it's running.
    const kick = () => { if (!this.audio.running) this.startAudio(); };
    document.addEventListener("pointerdown", kick, { capture: true });
    document.addEventListener("keydown", kick, { capture: true });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { this.midi.cancelLearn(); this.closeMenu(); } });

    if (this.clockSource === "midi" && !this.host) this.setClockSource("midi");
    this.audio.onMeter = (mtr) => this.meter(mtr);
    this.audio.onLog = (msg, kind) => this.toast(msg, kind || "error");
    for (const l of m.logs) this.toast(l, "error");
  }

  later(msg, kind) { (this.pending = this.pending || []).push({ msg, kind }); }

  async startAudio() {
    if (this.audio.running) return;
    try {
      await this.audio.start(this.model, this.transport);
      this.model.sink = this.audio.sink();
      this.banner.hidden = true;
      this.sendTransport();
    } catch (err) {
      console.error(err);
      this.toast(`Audio couldn't start: ${err.message}`, "error");
    }
  }

  // Messages from the plugin (see host.js).
  hostMessage(m) {
    if (m.t === "params") { for (const [i, v] of m.changes || []) this.model.applyHost(i, v); }
    else if (m.t === "state") this.presets.applyHostState(m.patch, m.ui);
    else if (m.t === "store") skStore.external(m.key, m.value);
    else if (m.t === "imported") this.presets.importText(m.text, m.file);
  }

  sendMidi(bytes) {
    if (!this.audio.node) { this.startAudio().then(() => this.audio.midi(bytes)); return; }
    this.audio.midi(bytes);
  }
  noteOn(n, v) { this.keyboard.light(n, true); this.sendMidi([0x90, n, v]); }
  noteOff(n) { this.keyboard.light(n, false); this.sendMidi([0x80, n, 64]); }

  // ---- messages (API.md \u00a79b) -----------------------------------------------

  sendMessage(id, values = []) {
    const i = this.messageIds.indexOf(id);
    if (i < 0) { console.warn(`[synthkit] no message "${id}" (declare it in defineMessages)`); return false; }
    const v = Array.from(values, Number).slice(0, 4);
    if (!this.audio.node) { this.startAudio().then(() => this.audio.send({ t: "msg", i, v })); return true; }
    this.audio.send({ t: "msg", i, v });
    return true;
  }
  onMessage(id, fn) {
    if (!this.messageSubs.has(id)) this.messageSubs.set(id, new Set());
    this.messageSubs.get(id).add(fn);
    return () => this.messageSubs.get(id).delete(fn);
  }
  receiveMessages(list) {
    for (const [i, v] of list) {
      const id = this.messageIds[i];
      for (const fn of this.messageSubs.get(id) || []) {
        try { fn(...v); } catch (err) { console.error(err); }
      }
    }
  }
  // MIDI from Web MIDI, before the synth sees it. Listeners (sk.onMidi) see
  // every message; a taker (sk.takeMidi) returning true takes it, and the
  // synth doesn't get it.
  tapMidi(d) {
    for (const fn of this.midiListeners) { try { fn(d); } catch (err) { console.error(err); } }
    for (const fn of this.midiTaps) { try { if (fn(d) === true) return true; } catch (err) { console.error(err); } }
    return false;
  }

  // ---- header --------------------------------------------------------------

  // The header's parts, built once: the default page places them, and a
  // synth's own page can mount them (API.md \u00a79a).
  buildParts() {
    const t = this.transport;
    this.bpm = h("input", { class: "bpm-input", type: "number", min: 30, max: 300, step: 1, value: t.bpm, "aria-label": "Tempo in BPM" });
    this.bpm.addEventListener("change", () => {
      const v = Math.min(300, Math.max(30, Number(this.bpm.value) || 120));
      this.bpm.value = v; t.bpm = v; this.sendTransport(); this.recordTempo();
    });
    this.bpm.addEventListener("keydown", (e) => e.stopPropagation());
    this.sig = h("select", { class: "sig-select", "aria-label": "Time signature", onchange: () => {
      const [n, d] = this.sig.value.split("/").map(Number); t.num = n; t.den = d; this.buildBeats(); this.sendTransport(); this.recordTempo();
      for (const fn of this.transportSubs) fn(t);
    } }, ...["2/4", "3/4", "4/4", "5/4", "6/8", "7/8", "12/8"].map((s) => h("option", { value: s, text: s })));
    this.clockSel = h("select", { class: "sig-select", "aria-label": "Tempo source", onchange: () => this.setClockSource(this.clockSel.value) },
      h("option", { value: "internal", text: "Internal" }), h("option", { value: "midi", text: "MIDI clock" }));
    this.clockSel.value = this.clockSource;
    this.sig.value = `${t.num}/${t.den}`;
    this.play = h("button", { type: "button", class: "btn play-btn", "aria-pressed": "false", title: "Start the tempo clock (space)", onclick: () => this.togglePlay() }, "Play");
    document.addEventListener("keydown", (e) => {
      if (this.host || !this.tempoShown || !this.spacePlays) return;   // the DAW's transport, no tempo on the page, or the page uses Space
      if (e.code === "Space" && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) { e.preventDefault(); this.togglePlay(); }
    });
    this.beats = h("div", { class: "beats", "aria-hidden": "true" });
    this.buildBeats();

    this.scope = h("canvas", { class: "scope", width: 240, height: 64, "aria-label": "Output waveform", role: "img" });
    this.levelFill = h("div", { class: "level-fill" });
    this.levelEl = h("div", { class: "level", "aria-hidden": "true" }, this.levelFill);
    this.voices = h("span", { class: "voice-count", text: "0 voices" });
    this.panicBtn = h("button", { type: "button", class: "btn btn-quiet", title: "Silence everything right now", onclick: () => this.panic() }, "Stop all sound");
    const icon = svg("svg", { viewBox: "0 0 16 16", width: 16, height: 16, "aria-hidden": "true" });
    icon.append(svg("circle", { cx: 8, cy: 8, r: 6.25, fill: "none", stroke: "currentColor", "stroke-width": 1.5 }),
                svg("path", { d: "M8 1.75 A6.25 6.25 0 0 1 8 14.25 Z", fill: "currentColor" }));
    this.themeBtn = h("button", { type: "button", class: "btn btn-quiet btn-icon theme-btn", title: "Switch light / dark", "aria-label": "Switch light or dark theme", onclick: () => this.cycleTheme() }, icon);
    this.tempoReadout = h("span", { class: "tempo-readout", text: "" });
    this.outputEl = h("div", { class: "output" }, this.scope, h("div", { class: "output-side" }, this.levelEl, this.voices));
  }

  // Tempo controls (play, BPM, signature, clock source, beat lights); in the
  // plugin, a readout of the DAW's tempo.
  tempoEl() {
    this.tempoShown = true;
    if (this.host) return h("div", { class: "tempo is-host", title: "Tempo and time signature come from your DAW" }, this.tempoReadout, this.beats);
    return h("div", { class: "tempo" }, this.play, h("label", { class: "bpm" }, this.bpm, h("span", { text: "BPM" })), this.sig, this.clockSel, this.beats);
  }

  panic() { this.audio.send({ t: "panic" }); this.keyboard.clearLights(); }

  header() {
    const info = this.model.info.synth;
    // Playing controls (tempo, MIDI) live with the keyboard. In the plugin the
    // DAW sets the tempo, so they become a readout.
    if (this.host) this.keyboard.addToBar(this.tempoEl());
    else this.keyboard.addToBar(this.tempoEl(), this.midi.root);
    return h("header", { class: "top" },
      h("div", { class: "brand" },
        h("h1", { class: "synth-name", text: info.name }),
        h("span", { class: "synth-meta", text: [info.vendor, info.version && "v" + info.version].filter(Boolean).join(" ") })),
      this.presets.root,
      this.outputEl,
      h("div", { class: "top-actions" }, this.panicBtn, this.themeBtn));
  }

  buildBeats() {
    this.beats.textContent = "";
    for (let i = 0; i < this.transport.num; i++) this.beats.append(h("span", { class: "beat" + (i === 0 ? " is-down" : "") }));
  }

  togglePlay() {
    this.transport.playing = !this.transport.playing;
    this.play.setAttribute("aria-pressed", String(this.transport.playing));
    this.play.textContent = this.transport.playing ? "Stop" : "Play";
    this.startAudio().then(() => this.sendTransport());
  }

  sendTransport() {
    const t = this.transport;
    skStore.set("synthkit:transport", { bpm: t.bpm, num: t.num, den: t.den });
    this.audio.send({ t: "transport", bpm: t.bpm, playing: t.playing, num: t.num, den: t.den, source: this.clockSource === "midi" ? "midi" : "internal" });
  }

  // Tempo in patches (features.tempoInPatch): the tempo controls write the
  // patch's tempo, and loading a patch with one sets them.
  recordTempo() {
    if (!this.tempoInPatch || this.host) return;
    const t = this.transport;
    this.model.setPatchTempo(t.bpm, t.num, t.den);
  }
  applyPatchTempo() {
    if (!this.tempoInPatch || this.host || this.clockSource === "midi") return;
    const pt = this.model.patchTempo();
    if (!pt) return;
    const t = this.transport;
    if (t.bpm === pt.bpm && t.num === pt.num && t.den === pt.den) return;
    t.bpm = pt.bpm; t.num = pt.num; t.den = pt.den;
    if (this.bpm) { this.bpm.value = pt.bpm; this.sig.value = `${pt.num}/${pt.den}`; this.buildBeats(); }
    if (this.audio.node) this.sendTransport();
    for (const fn of this.transportSubs) fn(t);
  }

  // The host bar: on a synth's own page, the parts a DAW would provide (start
  // the sound, MIDI input, tempo, stop all sound) that the page didn't place
  // itself. At the top of the page, or where the page mounted "hostbar";
  // sk.hostBar(false) or { midi / tempo / panic: false } leave parts out.
  buildHostBar(pageRoot) {
    const o = this.hostBarOpts || {};
    if (o === false || this.hostBarOpts === false) return;
    const parts = [];
    if (!this.host) parts.push(this.banner);
    if (!this.host && o.midi !== false && !this.midi.root.parentNode) parts.push(this.midi.root);
    if (o.tempo !== false && !this.noTempo && !this.tempoShown) parts.push(this.tempoEl());
    if (o.panic !== false && !this.panicBtn.parentNode) parts.push(this.panicBtn);
    if (o.space === false) this.spacePlays = false;
    this.banner.classList.add("in-hostbar");
    const bar = h("div", { class: "sk-hostbar" }, ...parts);
    if (this.hostBarEl) this.hostBarEl.append(bar);
    else pageRoot.prepend(bar);
  }

  cycleTheme() {
    const order = ["auto", "light", "dark"];
    const cur = document.documentElement.dataset.theme || "auto";
    const next = order[(order.indexOf(cur) + 1) % order.length];
    if (next === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = next;
    skStore.set("synthkit:theme", next);
    this.toast(next === "auto" ? "Theme follows your system" : `${next[0].toUpperCase() + next.slice(1)} theme`);
  }

  onTransport(fn) { this.transportSubs.add(fn); return () => this.transportSubs.delete(fn); }

  followClock(bpm, playing, beat) {
    if (this.clockSource !== "midi") return;
    const t = this.transport;
    t.bpm = bpm;
    t.playing = playing;
    this.bpm.value = bpm;
    this.play.setAttribute("aria-pressed", String(playing));
    this.play.textContent = playing ? "Stop" : "Play";
    this.audio.send({ t: "clock", bpm, playing, beat });
  }

  setClockSource(src) {
    this.clockSource = src;
    skStore.set("synthkit:clock", src);
    const midi = src === "midi";
    this.bpm.disabled = midi;
    this.play.disabled = midi;
    this.play.title = midi ? "Follows your MIDI clock's start and stop" : "Start the tempo clock (space)";
    if (midi) {
      if (!this.midi.access) this.midi.connect();
      this.toast("Following MIDI clock. Start your sequencer or DAW to play.");
    } else {
      this.transport.playing = false;
      this.play.setAttribute("aria-pressed", "false");
      this.play.textContent = "Play";
      this.sendTransport();
    }
  }

  meter(mtr) {
    if (this.host) this.followHost(mtr);
    for (const fn of this.meterTaps || []) { try { fn(mtr); } catch (err) { console.error(err); } }
    this.modMeters.update(mtr.mod, mtr.voices > 0);
    this.voices.textContent = `${mtr.voices} ${mtr.voices === 1 ? "voice" : "voices"}`;
    const db = mtr.peak > 0 ? 20 * Math.log10(mtr.peak) : -100;
    const n = Math.max(0, Math.min(1, (db + 48) / 48));
    this.levelFill.style.width = (n * 100).toFixed(1) + "%";
    this.levelEl.classList.toggle("is-hot", mtr.limiterDb > 0.5);
    const beats = [...this.beats.children];
    const per = (4 / this.transport.den);
    const idx = mtr.playing ? Math.floor(mtr.beat / per) % this.transport.num : -1;
    beats.forEach((b, i) => b.classList.toggle("is-on", i === idx));
    this.drawScope(mtr.scope);
  }

  // The DAW's tempo and time signature, as the plugin last saw them.
  followHost(mtr) {
    const t = this.transport;
    const bpm = Math.round(mtr.bpm * 100) / 100;
    const sigChanged = mtr.num !== t.num || mtr.den !== t.den;
    t.bpm = bpm; t.playing = mtr.playing; t.num = mtr.num; t.den = mtr.den;
    const text = `${bpm} BPM \u00b7 ${t.num}/${t.den}`;
    if (this.tempoReadout.textContent !== text) this.tempoReadout.textContent = text;
    if (sigChanged) { this.buildBeats(); for (const fn of this.transportSubs) fn(t); }
  }

  drawScope(data) {
    const c = this.scope, g = c.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, hgt = c.clientHeight;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(hgt * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, hgt);
    // Start at a rising zero crossing so periodic waves stand still.
    let s = 0;
    for (let i = 1; i < data.length / 2; i++) if (data[i - 1] <= 0 && data[i] > 0) { s = i; break; }
    const n = Math.min(512, data.length - s);
    g.strokeStyle = getComputedStyle(c).color;
    g.lineWidth = 1.5;
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * w, y = hgt / 2 - data[s + i] * (hgt / 2 - 3);
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.stroke();
  }

  // ---- menus, toasts, learn ------------------------------------------------

  paramMenu(ctl, x, y) {
    const cc = this.midi.ccFor(ctl.p.id);
    const learning = this.midi.learning === ctl.p.id;
    const canMod = ctl.p.modulatable && this.model.mod.slots > 0;
    this.menu(x, y, [
      { label: `Reset to ${this.model.format(ctl.p.index, ctl.p.def)}`, run: () => ctl.reset() },
      canMod ? { label: "Modulate\u2026", run: () => this.modulateMenu(ctl, x, y) } : null,
      // In the plugin, map controllers with the DAW's own MIDI mapping instead.
      this.host ? null : learning ? { label: "Stop MIDI learn", run: () => this.midi.cancelLearn() } : { label: "MIDI learn", run: () => this.midi.learn(ctl) },
      !this.host && cc !== null ? { label: `Forget CC ${cc}`, run: () => this.midi.forget(ctl.p.id) } : null,
    ].filter(Boolean));
  }

  modulateMenu(ctl, x, y) {
    const items = [];
    for (const [label, test] of SK_SOURCE_GROUPS) {
      const group = this.model.mod.sources.filter(test);
      if (!group.length) continue;
      if (items.length) items.push(null);
      for (const s of group) items.push({ label: s.name, run: () => this.addModulation(s, ctl) });
    }
    const custom = this.model.mod.sources.filter((s) => !SK_SOURCE_GROUPS.some(([, t]) => t(s)));
    if (custom.length) { items.push(null); for (const s of custom) items.push({ label: s.name, run: () => this.addModulation(s, ctl) }); }
    this.menu(x, y, items);
  }
  addModulation(src, ctl) {
    const routes = this.model.routes();
    if (routes.length >= this.model.mod.slots) { this.toast(`All ${this.model.mod.slots} modulation routes are in use. Remove one to add another.`); return; }
    routes.push({ src: src.id, dst: ctl.p.id, amt: 0.25 });
    this.model.setRoutes(routes);
