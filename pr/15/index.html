  const wasi = {
    fd_write(fd, iovs, iovsLen, nwritten) {
      const dv = view();
      let total = 0, text = "";
      for (let i = 0; i < iovsLen; i++) {
        const p = dv.getUint32(iovs + i * 8, true), n = dv.getUint32(iovs + i * 8 + 4, true);
        text += skUtf8Decode(bytes(p, n));
        total += n;
      }
      dv.setUint32(nwritten, total, true);
      if (text.trim()) log(text.trim());
      return 0;
    },
    proc_exit(code) { throw new Error("synth stopped (exit " + code + ")"); },
    environ_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    environ_get() { return 0; },
    args_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    args_get() { return 0; },
    clock_time_get(id, precision, out) { view().setBigUint64(out, BigInt(Date.now()) * 1000000n, true); return 0; },
    random_get(buf, len) { const b = bytes(buf, len); for (let i = 0; i < len; i++) b[i] = (Math.random() * 256) | 0; return 0; },
    fd_prestat_get() { return EBADF; },
    fd_close() { return EBADF; },
    fd_fdstat_get() { return EBADF; },
    fd_seek() { return EBADF; },
    fd_read() { return EBADF; },
  };
  return {
    wasi_snapshot_preview1: new Proxy(wasi, { get: (t, k) => t[k] || (() => ENOSYS) }),
    env: {
      sk_log(ptr, len) { log(skUtf8Decode(bytes(ptr, len))); },
    },
  };
}

// Thin wrapper over an instantiated synth module.
class SkWasm {
  constructor(instance) {
    this.x = instance.exports;
    if (this.x._initialize) this.x._initialize();
    this.x.sk_init();
  }
  get memory() { return this.x.memory; }
  // Read a NUL-terminated UTF-8 string.
  str(ptr) {
    const m = new Uint8Array(this.x.memory.buffer);
    let end = ptr;
    while (m[end] !== 0) end++;
    return skUtf8Decode(m.subarray(ptr, end));
  }
  // Call fn with pointers to NUL-terminated copies of each string argument.
  withStrings(strings, fn) {
    const ptrs = strings.map((s) => {
      const enc = skUtf8Encode(String(s));
      const p = this.x.sk_alloc(enc.length + 1);
      const m = new Uint8Array(this.x.memory.buffer);
      m.set(enc, p);
      m[p + enc.length] = 0;
      return p;
    });
    try { return fn(...ptrs); } finally { ptrs.forEach((p) => this.x.sk_free(p)); }
  }
  json(ptr) { return JSON.parse(this.str(ptr)); }
}

// ---- model.js
// The page's copy of the engine. It never makes sound: it holds the current
// parameter values, formats and parses them exactly like the plugin will,
// and saves/loads patches. Changes are forwarded to the audio thread.

class Model {
  static async create(bytes) {
    let memory = null;
    const logs = [];
    const { instance } = await WebAssembly.instantiate(bytes, skImports(() => memory, (m) => { logs.push(m); console.error("[synth]", m); }));
    memory = instance.exports.memory;
    return new Model(new SkWasm(instance), logs);
  }

  constructor(w, logs) {
    this.w = w;
    this.x = w.x;
    this.logs = logs;
    this.info = w.json(this.x.sk_info());
    this.params = this.info.params.map((p, i) => ({ ...p, index: i }));
    this.byId = new Map(this.params.map((p) => [p.id, p]));
    this.listeners = new Map();   // index -> Set(fn)
    this.anyListeners = new Set();
    this.customListeners = new Map();
    this.sink = null;             // audio forwarding: {param(i, v), gesture?(i, on), patch(json), custom(id, json), mod(json), shapes(json)}
    this.mod = this.info.mod || { sources: [], slots: 0, lfos: 0, shapes: 0 };
    this.sourceIndex = new Map(this.mod.sources.map((s, i) => [s.id, i]));
    this.modListeners = new Set();
    this.shapeListeners = new Set();
    this.dirty = false;
    this.patchListeners = new Set();   // after any patch load
  }

  param(id) { return typeof id === "number" ? this.params[id] : this.byId.get(id); }
  get(id) { const p = this.param(id); return p ? this.x.sk_get_param(p.index) : NaN; }
  norm(id) { const p = this.param(id); return this.x.sk_to_norm(p.index, this.get(p.index)); }
  toNorm(id, v) { return this.x.sk_to_norm(this.param(id).index, v); }
  fromNorm(id, n) { return this.x.sk_from_norm(this.param(id).index, n); }
  format(id, v) { const p = this.param(id); return this.w.str(this.x.sk_format(p.index, v === undefined ? this.get(p.index) : v)); }
  parse(id, text) {
    const p = this.param(id);
    const v = this.w.withStrings([text], (t) => this.x.sk_parse(p.index, t));
    return Number.isNaN(v) ? null : v;
  }

  set(id, v, source) {
    const p = this.param(id);
    if (!p) return;
    const before = this.get(p.index);
    this.x.sk_set_param(p.index, v);
    const now = this.get(p.index);
    if (now === before) return;
    this.dirty = true;
    if (this.sink) this.sink.param(p.index, now);
    this.emit(p.index, now, source);
  }
  setNorm(id, n, source) { this.set(id, this.fromNorm(id, Math.min(1, Math.max(0, n))), source); }
  // A value that changed in the plugin (automation, the host's own controls):
  // update the page without sending it back.
  applyHost(i, v) {
    const p = this.param(i);
    if (!p) return;
    const before = this.get(p.index);
    this.x.sk_set_param(p.index, v);
    const now = this.get(p.index);
    if (now !== before) { this.dirty = true; this.emit(p.index, now, "host"); }
  }
  // Start/end of a drag, so a DAW records the change as one gesture.
  gesture(id, on) { const p = this.param(id); if (p && this.sink && this.sink.gesture) this.sink.gesture(p.index, on); }
  reset(id) { const p = this.param(id); this.set(p.index, p.def); }

  on(id, fn) {
    const p = this.param(id);
    if (!p) return () => {};
    if (!this.listeners.has(p.index)) this.listeners.set(p.index, new Set());
    this.listeners.get(p.index).add(fn);
    return () => this.listeners.get(p.index).delete(fn);
  }
  onAny(fn) { this.anyListeners.add(fn); return () => this.anyListeners.delete(fn); }
  emit(i, v, source) {
    for (const fn of this.listeners.get(i) || []) fn(v, source);
    for (const fn of this.anyListeners) fn(i, v, source);
  }
  emitAll() { this.params.forEach((p) => this.emit(p.index, this.get(p.index), "patch")); }

  // Patches ----------------------------------------------------------------
  savePatch() { return JSON.parse(this.w.str(this.x.sk_save_patch())); }
  get patchName() { return this.savePatch().name; }
  setName(name) { this.w.withStrings([name], (p) => this.x.sk_set_name(p)); }

  // fromHost: the plugin already has this patch, so don't send it back.
  loadPatch(patch, { fromHost = false } = {}) {
    const text = typeof patch === "string" ? patch : JSON.stringify(patch);
    const res = this.w.json(this.w.withStrings([text], (p) => this.x.sk_load_patch(p)));
    if (!res.ok) return res;
    const saved = JSON.stringify(this.savePatch());
    if (this.sink && !fromHost) this.sink.patch(saved);
    this.dirty = false;
    this.emitAll();
    for (const id of this.info.custom) this.emitCustom(id);
    this.emitMod();
    this.emitShapes();
    for (const fn of this.patchListeners) { try { fn(); } catch (err) { console.error(err); } }
    return res;
  }
  onPatch(fn) { this.patchListeners.add(fn); return () => this.patchListeners.delete(fn); }

  // The patch's tempo (features.tempoInPatch): {bpm, num, den}, or null.
  patchTempo() { const t = this.w.str(this.x.sk_patch_tempo()); return t ? JSON.parse(t) : null; }
  setPatchTempo(bpm, num, den) {
    const t = this.patchTempo();
    if (t && t.bpm === bpm && t.num === num && t.den === den) return;
    this.x.sk_set_patch_tempo(bpm, num, den);
    this.dirty = true;
    for (const fn of this.anyListeners) fn(-1, 0, "tempo");
  }

  // Modulation -------------------------------------------------------------
  routes() { return this.mod.slots ? this.w.json(this.x.sk_get_mod()) : []; }
  setRoutes(routes) {
    const warnings = this.w.json(this.w.withStrings([JSON.stringify(routes)], (p) => this.x.sk_set_mod(p)));
    this.dirty = true;
    if (this.sink) this.sink.mod(JSON.stringify(this.routes()));
    this.emitMod();
    for (const fn of this.anyListeners) fn(-1, 0, "mod");
    return warnings;
  }
  onMod(fn) { this.modListeners.add(fn); return () => this.modListeners.delete(fn); }
  emitMod() { const r = this.routes(); for (const fn of this.modListeners) fn(r); }
  modulatable() { return this.params.filter((p) => p.modulatable); }

  shapes() { return this.mod.shapes ? this.w.json(this.x.sk_get_shapes()) : []; }
  setShapes(shapes, quiet) {
    this.w.withStrings([JSON.stringify(shapes)], (p) => this.x.sk_set_shapes(p));
    this.dirty = true;
    if (this.sink) this.sink.shapes(JSON.stringify(shapes));
    if (!quiet) this.emitShapes();
    for (const fn of this.anyListeners) fn(-1, 0, "shapes");
  }
  onShapes(fn) { this.shapeListeners.add(fn); return () => this.shapeListeners.delete(fn); }
  emitShapes() { const s = this.shapes(); for (const fn of this.shapeListeners) fn(s); }

  // Custom state -----------------------------------------------------------
  custom(id) { return this.w.json(this.w.withStrings([id], (p) => this.x.sk_get_custom(p))); }
  setCustom(id, value) {
    const json = JSON.stringify(value);
    const ok = this.w.withStrings([id, json], (a, b) => this.x.sk_set_custom(a, b));
    if (!ok) return false;
    this.dirty = true;
    if (this.sink) this.sink.custom(id, JSON.stringify(this.custom(id)));
    this.emitCustom(id);
    return true;
  }
  onCustom(id, fn) {
    if (!this.customListeners.has(id)) this.customListeners.set(id, new Set());
    this.customListeners.get(id).add(fn);
    return () => this.customListeners.get(id).delete(fn);
  }
  emitCustom(id) { const v = this.custom(id); for (const fn of this.customListeners.get(id) || []) fn(v); }
  customSnapshot() {
    const o = {};
    for (const id of this.info.custom) o[id] = JSON.stringify(this.custom(id));
    return o;
  }
}

// ---- audio.js
// Audio output: creates the AudioContext and the worklet running the synth.

// A data: URL rather than a blob: URL, because Chrome refuses blob: worklets
// on pages opened straight from disk (file://).
function skWorkletUrl() {
  if (!skWorkletUrl.url) {
    const src = document.getElementById("sk-worklet").textContent;
    const bytes = skUtf8Encode(src);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.slice(i, i + 0x8000));
    skWorkletUrl.url = "data:text/javascript;base64," + btoa(bin);
  }
  return skWorkletUrl.url;
}

class Audio {
  constructor(wasmBytes) {
    this.wasm = wasmBytes;
    this.ctx = null;
    this.node = null;
    this.onMeter = null;
    this.onLog = null;
    this.onMessages = null;   // ([[index, values], \u2026]) from the synth
    this.onParams = null;     // ([[index, value], \u2026]) parameters the engine moved
    this.starting = null;
  }

  get running() { return !!this.node && this.ctx.state === "running"; }

  // Browsers only let audio start during a click or key press. Called outside
  // one (a message or MIDI before the first click), the context starts
  // suspended; the next call, from a click, resumes it, and the first
  // attempt then completes.
  start(model, transport) {
    if (this.starting) {
      if (this.ctx && this.ctx.state !== "running") this.ctx.resume().catch(() => {});
      return this.starting;
    }
    const attempt = (async () => {
      this.ctx = new AudioContext({ latencyHint: "interactive" });
      await this.ctx.audioWorklet.addModule(skWorkletUrl());
      this.node = new AudioWorkletNode(this.ctx, "synthkit", {
        numberOfInputs: 0,
        numberOfOutputs: 1,
        outputChannelCount: [2],
        processorOptions: {
          wasm: this.wasm.slice().buffer,
          patch: JSON.stringify(model.savePatch()),
          custom: model.customSnapshot(),
          transport,
        },
      });
      this.node.port.onmessage = (e) => {
        const m = e.data;
        if (m.t === "meter" && this.onMeter) this.onMeter(m);
        else if (m.t === "msgs" && this.onMessages) this.onMessages(m.list);
        else if (m.t === "params" && this.onParams) this.onParams(m.changes);
        else if (m.t === "log") { console.error("[synth]", m.msg); if (this.onLog) this.onLog(m.msg); }
      };
      this.node.onprocessorerror = () => { if (this.onLog) this.onLog("The synth stopped with an error. Reload the page to restart it."); };
      this.node.connect(this.ctx.destination);
      if (this.ctx.state !== "running") await this.ctx.resume();
    })();
    this.starting = attempt.catch((err) => {
      // Let the next click try again from scratch.
      this.starting = null;
      if (this.ctx) this.ctx.close().catch(() => {});
      this.ctx = null;
      this.node = null;
      throw err;
    });
    return this.starting;
  }

  send(msg) { if (this.node) this.node.port.postMessage(msg); }
  midi(bytes) { this.send({ t: "midi", d: bytes }); }

  // Sink interface used by Model.
  sink() {
    return {
      param: (i, v) => this.send({ t: "param", i, v }),
      patch: (json) => this.send({ t: "patch", json }),
      custom: (id, json) => this.send({ t: "custom", id, json }),
      mod: (json) => this.send({ t: "mod", json }),
      shapes: (json) => this.send({ t: "shapes", json }),
      message: (i, v) => this.send({ t: "msg", i, v }),
    };
  }

  // Render offline through the same worklet (used by tests, and handy for
  // bouncing a phrase). events: [{t: seconds, d: [status, d1, d2]}].
  static async renderOffline(wasmBytes, { patch, custom, events = [], seconds = 2, sampleRate = 48000, transport }) {
    const len = Math.ceil(seconds * sampleRate);
    const ctx = new OfflineAudioContext(2, len, sampleRate);
    await ctx.audioWorklet.addModule(skWorkletUrl());
    // events: {t, d: [MIDI bytes]} or {t, m: [message index, values]}; at the
    // same time, messages go first (as in the native render tool).
    const schedule = events.map((e) => (e.m ? { sample: Math.round(e.t * sampleRate), m: e.m } : { sample: Math.round(e.t * sampleRate), d: e.d }))
      .sort((a, b) => a.sample - b.sample || (b.m ? 1 : 0) - (a.m ? 1 : 0));
    const node = new AudioWorkletNode(ctx, "synthkit", {
      numberOfInputs: 0,
      numberOfOutputs: 1,
      outputChannelCount: [2],
      processorOptions: { wasm: wasmBytes.slice().buffer, patch, custom, schedule, transport, meters: false },
    });
    node.connect(ctx.destination);
    const buf = await ctx.startRendering();
    return { left: buf.getChannelData(0), right: buf.getChannelData(1), sampleRate };
  }
}

// ---- host.js
// Running inside the plugin. The plugin serves this page with its current
// state in window.__skHost and talks to it through JUCE's web view bridge
// (window.__JUCE__.backend). HostAudio stands in for Audio: the sound comes
// from the plugin, so there is nothing to start, and changes go to the plugin
// instead of an AudioWorklet.

const skHost = (typeof window !== "undefined" && window.__skHost && window.__JUCE__ && window.__JUCE__.backend) ? window.__skHost : null;

class HostAudio {
  constructor() {
    this.onMeter = null;
    this.onLog = null;
    this.onHost = null;      // (message) for params / state / store / imported
    this.onMessages = null;  // ([[index, values], \u2026]) from the synth
    this.node = true;        // App checks this before sending MIDI
    window.__JUCE__.backend.addEventListener("sk", (m) => this.receive(m));
  }

  get running() { return true; }
  start() { return Promise.resolve(); }

  send(msg) { window.__JUCE__.backend.emitEvent("sk", msg); }
  midi(bytes) { this.send({ t: "midi", d: bytes }); }

  sink() {
    return {
      param: (i, v) => this.send({ t: "param", i, v }),
      gesture: (i, on) => this.send({ t: "gesture", i, on }),
      patch: (json) => this.send({ t: "patch", json }),
      custom: (id, json) => this.send({ t: "custom", id, json }),
      mod: (json) => this.send({ t: "mod", json }),
      shapes: (json) => this.send({ t: "shapes", json }),
      message: (i, v) => this.send({ t: "msg", i, v }),
    };
  }

  receive(m) {
    if (!m) return;
    if (m.t === "meter") {
      // JSON has no NaN: the plugin sends null for "not modulated".
      m.mod = Float32Array.from(m.mod || [], (v) => (v === null ? NaN : v));
      if (this.onMeter) this.onMeter(m);
    } else if (m.t === "log") {
      if (this.onLog) this.onLog(m.msg, m.kind);
    } else if (m.t === "msgs") {
      if (this.onMessages) this.onMessages(m.list || []);
    } else if (this.onHost) {
      this.onHost(m);
    }
  }
}

// ---- controls.js
// Controls bound to parameters. Every control: drag (Shift = fine), wheel,
// arrow keys, double-click to reset, click the value to type one, right-click
// for MIDI learn.

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

function svg(tag, attrs = {}) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

const KNOB_START = -135, KNOB_END = 135;

function arcPath(cx, cy, r, a0, a1) {
  const rad = (a) => ((a - 90) * Math.PI) / 180;
  const x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));
  const x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  const sweep = a1 > a0 ? 1 : 0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

// Vertical/horizontal drag on an element, in normalised units.
function attachDrag(target, ctl, axis = "y") {
  let start = null;
  target.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    target.setPointerCapture(e.pointerId);
    start = { x: e.clientX, y: e.clientY, n: ctl.norm(), moved: false };
    ctl.model.gesture(ctl.p.index, true);
    ctl.root.classList.add("is-active");
    ctl.focus();
  });
  target.addEventListener("pointermove", (e) => {
    if (!start) return;
    const range = e.shiftKey ? 1200 : axis === "x" ? Math.max(120, target.clientWidth) : 180;
    const d = axis === "x" ? e.clientX - start.x : start.y - e.clientY;
    if (Math.abs(d) > 2) start.moved = true;
    ctl.setNorm(start.n + d / range);
  });
  const end = () => {
    if (start) ctl.model.gesture(ctl.p.index, false);
    start = null;
    ctl.root.classList.remove("is-active");
  };
  target.addEventListener("pointerup", end);
  target.addEventListener("pointercancel", end);
  target.addEventListener("dblclick", () => ctl.reset());
  target.addEventListener("wheel", (e) => {
    e.preventDefault();
    const step = e.shiftKey ? 0.002 : 0.01;
    ctl.setNorm(ctl.norm() + (e.deltaY < 0 ? step : -step) * (ctl.stepScale || 1));
  }, { passive: false });
}

class Control {
  constructor(app, param, opts = {}) {
    this.app = app;
    this.model = app.model;
    this.p = param;
    this.opts = opts;
    this.label = opts.label || param.name;
    this.discrete = param.type !== "float";
    this.steps = this.discrete ? Math.round((param.max - param.min) / (param.step || 1)) : 0;
    this.stepScale = this.discrete ? Math.max(1, 100 / Math.max(1, this.steps)) : 1;
    this.root = h("div", { class: "ctl ctl-" + this.kind() + (opts.size ? " is-" + opts.size : ""), "data-param": param.id });
    this.build();
    this.unsub = this.model.on(param.index, (v) => this.update(v));
    this.root.addEventListener("contextmenu", (e) => { e.preventDefault(); app.paramMenu(this, e.clientX, e.clientY); });
    this.update(this.model.get(param.index));
  }
  kind() { return "base"; }
  norm() { return this.model.norm(this.p.index); }
  setNorm(n) {
    if (this.discrete && this.steps > 0) n = Math.round(Math.min(1, Math.max(0, n)) * this.steps) / this.steps;
    this.model.setNorm(this.p.index, n, "ui");
  }
  set(v) { this.model.set(this.p.index, v, "ui"); }
  reset() { this.model.reset(this.p.index); }
  focus() { const f = this.root.querySelector("[tabindex]"); if (f) f.focus({ preventScroll: true }); }
  text(v) { return this.model.format(this.p.index, v); }

  keyHandler(e) {
    const big = e.shiftKey ? 0.001 : 0.01;
    const step = this.discrete ? 1 / Math.max(1, this.steps) : big;
    let n = null;
    if (e.key === "ArrowUp" || e.key === "ArrowRight") n = this.norm() + step;
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") n = this.norm() - step;
    else if (e.key === "PageUp") n = this.norm() + 0.1;
    else if (e.key === "PageDown") n = this.norm() - 0.1;
    else if (e.key === "Home") n = 0;
    else if (e.key === "End") n = 1;
    else if (e.key === "Delete" || e.key === "Backspace") { this.reset(); e.preventDefault(); return; }
    if (n !== null) { e.preventDefault(); e.stopPropagation(); this.setNorm(n); }
  }

  // The value readout doubles as a text field.
  valueField() {
    const v = h("button", { class: "ctl-value", type: "button", title: "Type a value" });
    v.addEventListener("click", () => this.editValue(v));
    return v;
  }
  editValue(btn) {
    const input = h("input", { class: "ctl-edit", type: "text", value: this.text(), "aria-label": this.label });
    btn.replaceWith(input);
    input.select();
    let finished = false;
    const done = (commit) => {
      if (finished) return;
      finished = true;
      if (commit) {
        const v = this.model.parse(this.p.index, input.value.trim());
        if (v !== null) this.set(v);
      }
      input.replaceWith(btn);
      this.update(this.model.get(this.p.index));
    };
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") done(true);
      if (e.key === "Escape") done(false);
    });
    input.addEventListener("blur", () => done(true));
  }
  aria(el, v) {
    el.setAttribute("aria-valuetext", this.text(v));
    el.setAttribute("aria-valuenow", Math.round(this.model.toNorm(this.p.index, v) * 100));
  }
  learned(cc) { this.root.classList.toggle("has-cc", cc !== null && cc !== undefined); this.root.title = cc != null ? `${this.label}: MIDI CC ${cc}` : ""; }
}

class Knob extends Control {
  kind() { return "knob"; }
  build() {
    const p = this.p;
    this.origin = p.min < 0 && p.max > 0 ? this.model.toNorm(p.index, 0) : 0;
    const s = svg("svg", { viewBox: "0 0 100 100", class: "knob-svg", "aria-hidden": "true" });
    s.append(svg("path", { class: "knob-track", d: arcPath(50, 50, 42, KNOB_START, KNOB_END) }));
    this.arc = svg("path", { class: "knob-arc" });
    this.modArc = svg("path", { class: "knob-mod" });
    s.append(this.arc, this.modArc);
    s.append(svg("circle", { class: "knob-cap", cx: 50, cy: 50, r: 31 }));
    this.pointer = svg("line", { class: "knob-pointer", x1: 50, y1: 50, x2: 50, y2: 23 });
    s.append(this.pointer);
    this.dial = h("div", { class: "knob-dial", role: "slider", tabindex: 0, "aria-label": this.label, "aria-valuemin": 0, "aria-valuemax": 100 }, s);
    this.dial.addEventListener("keydown", (e) => this.keyHandler(e));
    attachDrag(this.dial, this);
    this.value = this.valueField();
    this.root.append(this.dial, h("div", { class: "ctl-label", text: this.label }), this.value);
  }
  update(v) {
    const n = this.model.toNorm(this.p.index, v);
    const a = KNOB_START + (KNOB_END - KNOB_START) * n;
    const a0 = KNOB_START + (KNOB_END - KNOB_START) * this.origin;
    this.arc.setAttribute("d", Math.abs(a - a0) < 0.5 ? "" : arcPath(50, 50, 42, Math.min(a0, a), Math.max(a0, a)));
    this.pointer.setAttribute("transform", `rotate(${a.toFixed(1)} 50 50)`);
    this.value.textContent = this.text(v);
    this.aria(this.dial, v);
    this.base = v;
    if (this.modValue !== undefined) this.modulated(this.modValue);
  }
  // Live modulation: a thin outer arc from the set value to where modulation
  // has taken it (for the most recent voice).
  modulated(v) {
    this.modValue = v;
    if (Number.isNaN(v) || v === undefined) { this.modArc.setAttribute("d", ""); this.root.classList.remove("is-modulated"); return; }
    const a0 = KNOB_START + (KNOB_END - KNOB_START) * this.model.toNorm(this.p.index, this.model.get(this.p.index));
    const a1 = KNOB_START + (KNOB_END - KNOB_START) * this.model.toNorm(this.p.index, v);
    this.root.classList.add("is-modulated");
    this.modArc.setAttribute("d", Math.abs(a1 - a0) < 0.8 ? "" : arcPath(50, 50, 49, Math.min(a0, a1), Math.max(a0, a1)));
  }
}

class Slider extends Control {
  kind() { return "slider"; }
  build() {
    this.fill = h("div", { class: "slider-fill" });
    this.thumb = h("div", { class: "slider-thumb" });
    this.track = h("div", { class: "slider-track", role: "slider", tabindex: 0, "aria-label": this.label, "aria-valuemin": 0, "aria-valuemax": 100 }, this.fill, this.thumb);
    this.track.addEventListener("keydown", (e) => this.keyHandler(e));
    attachDrag(this.track, this, "x");
    this.value = this.valueField();
    this.root.append(h("div", { class: "ctl-row" }, h("div", { class: "ctl-label", text: this.label }), this.value), this.track);
  }
  update(v) {
    const n = this.model.toNorm(this.p.index, v);
    this.fill.style.width = (n * 100).toFixed(2) + "%";
    this.thumb.style.left = (n * 100).toFixed(2) + "%";
    this.value.textContent = this.text(v);
    this.aria(this.track, v);
  }
}

class Segmented extends Control {
  kind() { return "segmented"; }
  build() {
    const choices = this.p.choices || (this.p.type === "toggle" ? ["Off", "On"] : []);
    this.group = h("div", { class: "seg", role: "radiogroup", "aria-label": this.label });
    this.buttons = choices.map((c, i) =>
      h("button", { type: "button", class: "seg-btn", role: "radio", text: c, onclick: () => this.set(this.p.min + i) }));
    this.group.append(...this.buttons);
    this.group.addEventListener("keydown", (e) => this.keyHandler(e));
    this.root.append(h("div", { class: "ctl-label", text: this.label }), this.group);
  }
  update(v) {
    const idx = Math.round(v - this.p.min);
    this.buttons.forEach((b, i) => {
      b.setAttribute("aria-checked", i === idx ? "true" : "false");
      b.tabIndex = i === idx ? 0 : -1;
    });
  }
}

class Menu extends Control {
  kind() { return "menu"; }
  build() {
    this.select = h("select", { class: "menu-select", "aria-label": this.label, onchange: () => this.set(Number(this.select.value)) });
    const n = this.p.choices ? this.p.choices.length : this.steps + 1;
    for (let i = 0; i < n; i++) {
      const v = this.p.min + i * (this.p.step || 1);
      this.select.append(h("option", { value: v, text: this.p.choices ? this.p.choices[i] : this.text(v) }));
    }
    this.root.append(h("label", { class: "ctl-label", text: this.label }), this.select);
  }
  update(v) { this.select.value = String(Math.round(v)); }
}

class Toggle extends Control {
  kind() { return "toggle"; }
  build() {
    this.btn = h("button", { type: "button", class: "toggle", role: "switch", "aria-label": this.label, onclick: () => this.set(this.model.get(this.p.index) >= 0.5 ? 0 : 1) },
      h("span", { class: "toggle-knob" }));
    this.root.append(this.btn, h("div", { class: "ctl-label", text: this.label }));
  }
  update(v) { this.btn.setAttribute("aria-checked", v >= 0.5 ? "true" : "false"); }
}

// Two parameters on one pad: x = params[0], y = params[1].
class XYPad {
  constructor(app, px, py, opts = {}) {
    this.app = app; this.model = app.model; this.px = px; this.py = py;
    this.dot = h("div", { class: "xy-dot" });
    this.pad = h("div", { class: "xy-pad", role: "group", tabindex: 0, "aria-label": `${px.name} and ${py.name}` }, this.dot);
    this.readout = h("div", { class: "ctl-value is-static" });
    this.root = h("div", { class: "ctl ctl-xy" }, this.pad, h("div", { class: "ctl-label", text: opts.label || `${px.name} / ${py.name}` }), this.readout);
    const move = (e) => {
      const r = this.pad.getBoundingClientRect();
      this.model.setNorm(px.index, (e.clientX - r.left) / r.width, "ui");
      this.model.setNorm(py.index, 1 - (e.clientY - r.top) / r.height, "ui");
    };
    this.pad.addEventListener("pointerdown", (e) => {
      this.pad.setPointerCapture(e.pointerId); this.dragging = true;
      this.model.gesture(px.index, true); this.model.gesture(py.index, true);
      move(e);
    });
    this.pad.addEventListener("pointermove", (e) => { if (this.dragging) move(e); });
    const up = () => {
      if (this.dragging) { this.model.gesture(px.index, false); this.model.gesture(py.index, false); }
      this.dragging = false;
    };
    this.pad.addEventListener("pointerup", up);
    this.pad.addEventListener("pointercancel", up);
    this.pad.addEventListener("dblclick", () => { this.model.reset(px.index); this.model.reset(py.index); });
    this.pad.addEventListener("keydown", (e) => {
      const s = e.shiftKey ? 0.002 : 0.02;
      const map = { ArrowLeft: [px, -s], ArrowRight: [px, s], ArrowUp: [py, s], ArrowDown: [py, -s] };
      if (map[e.key]) { e.preventDefault(); const [p, d] = map[e.key]; this.model.setNorm(p.index, this.model.norm(p.index) + d, "ui"); }
    });
    this.model.on(px.index, () => this.update());
    this.model.on(py.index, () => this.update());
    this.update();
  }
  update() {
    const x = this.model.norm(this.px.index), y = this.model.norm(this.py.index);
    this.dot.style.left = x * 100 + "%";
    this.dot.style.top = (1 - y) * 100 + "%";
    this.readout.textContent = `${this.model.format(this.px.index)}, ${this.model.format(this.py.index)}`;
  }
}

function makeControl(app, param, spec = {}) {
  let type = spec.type;
  if (!type) {
    if (param.type === "toggle") type = "toggle";
    else if (param.type === "choice") type = (param.choices || []).length <= 4 ? "segmented" : "menu";
    else type = "knob";
  }
  const C = { knob: Knob, slider: Slider, segmented: Segmented, menu: Menu, toggle: Toggle }[type];
  if (!C) return null;
  return new C(app, param, spec);
}

// ---- panels.js
// Builds the panel of sections from ui/layout.json, or automatically from
// parameter groups when a synth has no layout.

const KIT_PANELS = {
  voices: { title: "Voices", controls: [
    ["voiceMode", "Mode"], ["glide", "Glide"], ["unison", "Unison"], ["unisonDetune", "Detune"],
    ["unisonSpread", "Spread"], ["bendRange", "Bend"]] },
  master: { title: "Output", controls: [["master", "Level"], ["sk.a4", "A4"]] },
};

function envPanel(n, model) {
  const amp = n === 1 && model.info.synth.ampEnv;
  return {
    title: amp ? "Amp envelope" : `Envelope ${n}`,
    env: n,
    controls: ["attack", "decay", "sustain", "release", "velocity"].map((s) => [`env${n}.${s}`, s[0].toUpperCase() + s.slice(1)]),
  };
}

// Small drawing of an ADSR's shape, redrawn as its knobs move.
class EnvPreview {
  constructor(model, n) {
    this.model = model;
    this.ids = ["attack", "decay", "sustain", "release"].map((s) => `env${n}.${s}`);
    this.path = svg("path", { class: "env-line" });
    this.fill = svg("path", { class: "env-fill" });
    this.root = svg("svg", { class: "env-preview", viewBox: "0 0 200 60", preserveAspectRatio: "none", "aria-hidden": "true" });
    this.root.append(this.fill, this.path);
    for (const id of this.ids) model.on(id, () => this.draw());
    this.draw();
  }
  draw() {
    const [a, d, s, r] = this.ids.map((id) => this.model.get(id));
    // Times on a soft log scale so short and long envelopes both read well.
    const w = (t) => Math.log1p(t * 40);
    const hold = 0.6;
    const total = w(a) + w(d) + hold + w(r);
    const sx = 196 / total, top = 6, bottom = 56, y = (v) => bottom - v * (bottom - top);
    let x = 2;
    const pts = [[x, bottom]];
    x += w(a) * sx; pts.push([x, y(1)]);
    x += w(d) * sx; pts.push([x, y(s)]);
    x += hold * sx; pts.push([x, y(s)]);
    x += w(r) * sx; pts.push([x, bottom]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    this.path.setAttribute("d", line);
    this.fill.setAttribute("d", line + " Z");
  }
}

class Panels {
  constructor(app) {
    this.app = app;
    this.model = app.model;
    this.problems = [];
    this.placed = new Set();
    this.root = h("div", { class: "panels" });
  }

  build(layout) {
    const sections = layout && Array.isArray(layout.sections) ? layout.sections : this.autoSections();
    for (const s of sections) {
      const el = this.section(s);
      if (el) this.root.append(el);
    }
    // Anything the layout forgot still gets a place, so no parameter is unreachable.
    const rest = this.model.params.filter((p) => !p.hidden && !p.kit && !this.placed.has(p.id));
    if (rest.length) this.root.append(this.section({ title: "More", controls: rest.map((p) => ({ param: p.id })) }));
    return this.root;
  }

  autoSections() {
    const groups = new Map();
    for (const p of this.model.params) {
      if (p.hidden || p.kit) continue;
      const g = p.group || "Sound";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push({ param: p.id });
    }
    const out = [...groups].map(([title, controls]) => ({ title, controls }));
    out.push({ kit: "voices" });
    for (let n = 1; n <= this.model.info.synth.standardEnvelopes; n++) out.push({ kit: "env" + n });
    for (let n = 1; n <= this.model.mod.lfos; n++) out.push({ kit: "lfo" + n });
    for (let n = 1; n <= this.model.mod.shapes; n++) out.push({ kit: "shape" + n });
    if (this.model.mod.slots) out.push({ kit: "modMatrix" });
    out.push({ kit: "master" });
    return out;
  }

  section(spec) {
    let s = spec;
    const lfo = spec.kit && /^lfo(\d+)$/.exec(spec.kit);
    if (lfo) return Number(lfo[1]) <= this.model.mod.lfos ? new LfoPanel(this.app, Number(lfo[1])).root : this.missing(spec.kit);
    const shape = spec.kit && /^shape(\d+)$/.exec(spec.kit);
    if (shape) return Number(shape[1]) <= this.model.mod.shapes ? new ShapePanel(this.app, Number(shape[1]), spec.title).root : this.missing(spec.kit);
    if (spec.kit === "modMatrix") {
      if (!this.model.mod.slots) return this.missing(spec.kit);
      this.app.matrix = new MatrixPanel(this.app);
      return this.app.matrix.root;
    }
    if (spec.kit) {
      const m = /^env(\d+)$/.exec(spec.kit);
      if (m) s = envPanel(Number(m[1]), this.model);
      else if (KIT_PANELS[spec.kit]) s = KIT_PANELS[spec.kit];
      else return this.missing(spec.kit);
      s = { ...s, title: spec.title || s.title, controls: s.controls.map(([param, label]) => ({ param, label })) };
    }
    const controls = h("div", { class: "controls" });
    for (const c of s.controls || []) {
      const el = this.control(c);
      if (el) controls.append(el);
    }
    if (!controls.children.length) return null;
    const sec = h("section", { class: "panel" + (s.wide ? " is-wide" : "") },
      h("h2", { class: "panel-title", text: s.title || "" }));
    if (s.env) sec.append(new EnvPreview(this.model, s.env).root);
    sec.append(controls);
    return sec;
  }

  missing(kit) {
    this.problems.push(`layout.json asks for the "${kit}" panel, but synth.json doesn't enable that feature.`);
    return null;
  }

  control(c) {
    if (c.type === "xy") {
      const [a, b] = (c.params || []).map((id) => this.model.param(id));
      if (!a || !b) { this.problems.push(`An xy control needs two known params (got ${JSON.stringify(c.params)}).`); return null; }
      this.placed.add(a.id); this.placed.add(b.id);
      return new XYPad(this.app, a, b, c).root;
    }
    if (c.type && this.app.widgets.has(c.type)) return this.app.customWidget(c);
    const p = this.model.param(c.param);
    if (!p) {
      // Kit params only exist for some feature combinations; skip those quietly.
      if (!/^(voiceMode|glide|unison|unisonDetune|unisonSpread)$/.test(c.param)) this.problems.push(`layout.json mentions "${c.param}", which isn't a parameter.`);
      return null;
    }
    this.placed.add(p.id);
    const ctl = makeControl(this.app, p, c);
    if (!ctl) { this.problems.push(`Unknown control type "${c.type}" for ${c.param}.`); return null; }
    this.app.controls.push(ctl);
    return ctl.root;
  }
}

// ---- modulation.js
// Modulation UI: LFO panels, shape editors, the matrix, and the live
// meters that drive knob rings, LFO meters and shape playheads.

// ---- meters -------------------------------------------------------------------

class ModMeters {
  constructor(model) {
    this.model = model;
    this.ns = model.mod.sources.length;
    this.np = model.params.length;
    this.data = null;
    this.active = false;   // any voice sounding? Live displays rest when not.
    this.subs = new Set();
    this.sourceSubs = new Set();   // (meters) on every update, sounding or not
  }
  update(arr, active) {
    if (!arr || !arr.length) return;
    this.latest = arr;
    // Sources a synth drives globally (a wind gauge) move with nothing playing.
    for (const fn of this.sourceSubs) fn(this);
    // Settle once when playing stops, then stay quiet until it starts again.
    if (!active && !this.active) return;
    this.data = arr;
    this.active = !!active;
    for (const fn of this.subs) fn(this);
  }
  on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
  // A source's latest value, whenever meters arrive (for custom widgets and pages).
  onSource(id, fn) {
    const i = this.model.sourceIndex.get(id);
    if (i === undefined) { console.warn(`[synthkit] no mod source "${id}"`); return () => {}; }
    const sub = () => fn(this.latest[i]);
    this.sourceSubs.add(sub);
    return () => this.sourceSubs.delete(sub);
  }
  source(i) { return this.data ? this.data[i] : 0; }
  sourceById(id) { const i = this.model.sourceIndex.get(id); return i === undefined ? 0 : this.source(i); }
  param(i) { return this.data ? this.data[this.ns + i] : NaN; }
  shape(n) {  // n is 0-based
    if (!this.data) return { phase: -1, value: 0 };
    const k = this.ns + this.np + n * 2;
    return { phase: this.data[k], value: this.data[k + 1] };
  }
}

// ---- helpers -------------------------------------------------------------------

function skDivisionBeats(name, transport) {
  const bars = /^(\d+)\s*bars?$/.exec(name);
  if (bars) return Number(bars[1]) * transport.num * (4 / transport.den);
  const m = /^(\d+)\/(\d+)([T.]?)$/.exec(name);
  if (!m) return 1;
  let b = (4 * Number(m[1])) / Number(m[2]);
  if (m[3] === "T") b *= 2 / 3;
  if (m[3] === ".") b *= 1.5;
  return b;
}

function skSection(title, cls) {
  const controls = h("div", { class: "controls" });
  const root = h("section", { class: "panel " + (cls || "") }, h("h2", { class: "panel-title", text: title }));
  return { root, controls };
}

function skAddControls(app, target, specs) {
  const out = {};
  for (const [id, label, type] of specs) {
    const p = app.model.param(id);
    if (!p) continue;
    const ctl = makeControl(app, p, { label, type });
    app.controls.push(ctl);
    target.append(ctl.root);
    out[id] = ctl;
  }
  return out;
}

// ---- LFO panel --------------------------------------------------------------------

class LfoPanel {
  constructor(app, n) {
    const m = app.model, pre = `lfo${n}.`;
    const { root, controls } = skSection(`LFO ${n}`, "lfo-panel");
    this.preview = svg("svg", { class: "lfo-preview", viewBox: "0 0 120 40", preserveAspectRatio: "none", "aria-hidden": "true" });
    this.line = svg("path", { class: "lfo-line" });
    this.dot = svg("circle", { class: "lfo-dot", r: 3.2, cx: 116, cy: 20 });
    this.preview.append(svg("line", { class: "lfo-axis", x1: 0, x2: 120, y1: 20, y2: 20 }), this.line, this.dot);
    root.append(this.preview, controls);
    const c = skAddControls(app, controls, [
      [pre + "shape", "Shape", "menu"], [pre + "sync", "Sync", "toggle"], [pre + "rate", "Rate"], [pre + "division", "Division", "menu"],
      [pre + "mode", "Mode", "segmented"], [pre + "phase", "Phase"], [pre + "depth", "Depth"], [pre + "fade", "Fade in"]]);
    m.on(pre + "sync", (v) => {
      if (c[pre + "rate"]) c[pre + "rate"].root.hidden = v >= 0.5;
      if (c[pre + "division"]) c[pre + "division"].root.hidden = v < 0.5;
    });
    m.on(pre + "shape", () => this.draw());
    m.on(pre + "phase", () => this.draw());
    this.m = m; this.pre = pre;
    const syncOn = m.get(pre + "sync") >= 0.5;
    c[pre + "rate"].root.hidden = syncOn;
    c[pre + "division"].root.hidden = !syncOn;
    this.draw();
    this.src = m.sourceIndex.get(`lfo${n}`);
    app.modMeters.on((mm) => {
      this.dot.setAttribute("visibility", mm.active ? "visible" : "hidden");
      const v = mm.source(this.src);
      this.dot.setAttribute("cy", (20 - Math.max(-1, Math.min(1, v)) * 17).toFixed(1));
    });
    this.dot.setAttribute("visibility", "hidden");
    this.root = root;
  }
  draw() {
    const shape = Math.round(this.m.get(this.pre + "shape"));
    const ph = this.m.get(this.pre + "phase");
    let held = [0.6, -0.4, 0.9, -0.8, 0.2, 0.7];
    const f = (p) => {
      const q = (p + ph) % 1;
      switch (shape) {
        case 0: return Math.sin(2 * Math.PI * q);
        case 1: return 1 - 4 * Math.abs(((q + 0.25) % 1) - 0.5);
        case 2: return 2 * q - 1;
        case 3: return 1 - 2 * q;
        case 4: return q < 0.5 ? 1 : -1;
        case 5: return held[Math.floor(p * 3) % held.length];
        default: { const i = Math.floor(p * 3), t = p * 3 - i, w = 0.5 - 0.5 * Math.cos(Math.PI * t); return held[i] + (held[i + 1] - held[i]) * w; }
      }
    };
    let d = "";
    for (let i = 0; i <= 108; i++) d += (i ? "L" : "M") + (2 + i).toFixed(1) + " " + (20 - f(i / 108) * 17).toFixed(1) + " ";
    this.line.setAttribute("d", d);
  }
}

// ---- shape editor -----------------------------------------------------------------

const SK_SHAPE_PRESETS = [
  ["Ramp down", [[0, 1, -0.5, 0], [1, 0, 0, 0]]],
  ["Ramp up", [[0, 0, 0.5, 0], [1, 1, 0, 0]]],
  ["Pump", [[0, 0.15, -0.4, 0], [0.1, 1, 0.5, 0], [0.5, 0.3, -0.3, 0], [0.6, 1, 0.5, 0], [1, 0.15, 0, 0]]],
  ["Swell", [[0, 0, 0.6, 0], [0.7, 1, -0.3, 0], [1, 0.6, 0, 0]]],
  ["Triangle", [[0, 0, 0, 0], [0.5, 1, 0, 0], [1, 0, 0, 0]]],
  ["Square", [[0, 1, 0, 1], [0.5, 0, 0, 1], [1, 0, 0, 0]]],
];

// Curve points: [x, y, curvature, step, outX, outY, inX, inY, corner].
// Points with 8+ entries have handles (offsets from the point); a segment with
// handles at either end is a cubic Bezier, otherwise the older curvature
// model applies. This must match ShapeCurve::eval in the engine.
function skHasHandles(p) { return p.length >= 8; }

function skBez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
}

function skEvalCurve(pts, x) {
  if (!pts.length) return 0;
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 0; i + 1 < pts.length; i++) {
    const a = pts[i], b = pts[i + 1];
    const [x0, y0, c, hold] = a, [x1, y1] = b;
    if (x > x1) continue;
    if (hold) return y0;
    const w = x1 - x0;
    if (w < 1e-6) return y1;
    if (skHasHandles(a) || skHasHandles(b)) {
      const c1x = x0 + (skHasHandles(a) ? Math.min(Math.max(a[4], 0), w / 2) : 0);
      const c2x = x1 + (skHasHandles(b) ? Math.max(Math.min(b[6], 0), -w / 2) : 0);
      const c1y = y0 + (skHasHandles(a) ? a[5] : 0), c2y = y1 + (skHasHandles(b) ? b[7] : 0);
      let lo = 0, hi = 1, t = (x - x0) / w;
      for (let k = 0; k < 24; k++) {
        const xt = skBez(x0, c1x, c2x, x1, t);
        if (Math.abs(xt - x) < 1e-6) break;
        if (xt < x) lo = t; else hi = t;
        t = 0.5 * (lo + hi);
      }
      return Math.min(1, Math.max(0, skBez(y0, c1y, c2y, y1, t)));
    }
    let t = (x - x0) / w;
    if (c) t = Math.pow(t, Math.pow(2, 3 * c));
    return y0 + (y1 - y0) * t;
  }
  return pts[pts.length - 1][1];
}

// Fit handles to one segment of the older curvature model, keeping both
// handles inside the editor (heights 0..1) so they can always be grabbed.
// Tries a grid of handle reaches and solves the heights by least squares.
// Returns [outX, outY, inX, inY] as offsets from the segment's ends.
function skFitSegment(x0, y0, x1, y1, curvature) {
  const w = x1 - x0, e = Math.pow(2, 3 * (curvature || 0));
  const N = 31, target = [], xs = [];
  for (let k = 1; k <= N; k++) { const f = k / (N + 1); xs.push(f); target.push(y0 + (y1 - y0) * Math.pow(f, e)); }
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  let best = null;
  for (let ia = 0; ia <= 6; ia++) for (let ib = 0; ib <= 6; ib++) {
    const a = ia / 12, b = 1 - ib / 12;   // control x's, in units of the width
    let s11 = 0, s12 = 0, s22 = 0, r1 = 0, r2 = 0;
    const basis = xs.map((x, k) => {
      let lo = 0, hi = 1, t = x;
      for (let j = 0; j < 30; j++) { const xt = skBez(0, a, b, 1, t); if (xt < x) lo = t; else hi = t; t = 0.5 * (lo + hi); }
      const u = 1 - t, b0 = u * u * u, b1 = 3 * u * u * t, b2 = 3 * u * t * t, b3 = t * t * t;
      const r = target[k] - y0 * b0 - y1 * b3;
      s11 += b1 * b1; s12 += b1 * b2; s22 += b2 * b2; r1 += b1 * r; r2 += b2 * r;
      return [b0, b1, b2, b3];
    });
    const det = s11 * s22 - s12 * s12;
    let Y1 = det > 1e-12 ? (r1 * s22 - r2 * s12) / det : y0, Y2 = det > 1e-12 ? (s11 * r2 - s12 * r1) / det : y1;
    // Keep inside the box; if one height had to move, re-solve the other.
    if (Y1 !== clamp01(Y1)) { Y1 = clamp01(Y1); if (s22 > 1e-12) Y2 = (r2 - s12 * Y1) / s22; }
    if (Y2 !== clamp01(Y2)) { Y2 = clamp01(Y2); if (s11 > 1e-12) Y1 = clamp01((r1 - s12 * Y2) / s11); }
    Y2 = clamp01(Y2);
    let err = 0;
    basis.forEach(([b0, b1, b2, b3], k) => { const d = y0 * b0 + Y1 * b1 + Y2 * b2 + y1 * b3 - target[k]; err += d * d; });
    if (!best || err < best.err - 1e-12) best = { err, out: [a * w, Y1 - y0, (b - 1) * w, Y2 - y1] };
  }
  return best.out;
}

// Convert a curve that uses the older curvature model to handles, fitting
// each segment.
function skToHandles(pts) {
  if (pts.every(skHasHandles)) return;
  const out = pts.map((p) => [p[0], p[1], 0, p[3] ? 1 : 0, 0, 0, 0, 0, skHasHandles(p) ? (p[8] || 0) : 1]);
  for (let i = 0; i + 1 < pts.length; i++) {
    const a = pts[i], b = pts[i + 1];
    const w = b[0] - a[0];
    if (a[3] || w < 1e-6) continue;
    if (skHasHandles(a) || skHasHandles(b)) {  // already a Bezier segment
      if (skHasHandles(a)) { out[i][4] = a[4]; out[i][5] = a[5]; }
      if (skHasHandles(b)) { out[i + 1][6] = b[6]; out[i + 1][7] = b[7]; }
      continue;
    }
    if (!a[2]) continue;  // a straight line needs no handles
    const [ox, oy, ix, iy] = skFitSegment(a[0], a[1], b[0], b[1], a[2]);
    out[i][4] = ox; out[i][5] = oy;
    out[i + 1][6] = ix; out[i + 1][7] = iy;
  }
  pts.length = 0;
  pts.push(...out);
}

// Shorten a handle (keeping its direction) so its end stays inside the editor:
// heights 0..1, and no further than xMax across (xMax is signed: + for out
// handles, - for in handles).
function skFitHandle(py, dx, dy, xMax) {
  let s = 1;
  if (Math.abs(dx) > Math.abs(xMax) && dx !== 0) s = Math.min(s, Math.abs(xMax / dx));
  if (py + dy > 1) s = Math.min(s, (1 - py) / dy);
  if (py + dy < 0) s = Math.min(s, -py / dy);
  s = Math.max(0, s);
  return [dx * s, dy * s];
}

// Smooth handles for point i: tangent through its neighbours, a third of the
// way to each (shortened if that would leave the editor).
function skSmoothHandles(pts, i) {
  const p = pts[i], prev = pts[i - 1], next = pts[i + 1];
  const slope = prev && next ? (next[1] - prev[1]) / Math.max(1e-6, next[0] - prev[0])
    : next ? (next[1] - p[1]) / Math.max(1e-6, next[0] - p[0])
    : prev ? (p[1] - prev[1]) / Math.max(1e-6, p[0] - prev[0]) : 0;
  const wo = next ? (next[0] - p[0]) / 3 : 0, wi = prev ? (p[0] - prev[0]) / 3 : 0;
  [p[4], p[5]] = skFitHandle(p[1], wo, slope * wo, wo);
  [p[6], p[7]] = skFitHandle(p[1], -wi, -slope * wi, -wi);
  p[8] = 0;
}

class ShapeEditor {
  constructor(app, n) {
    this.app = app; this.m = app.model; this.n = n; this.pre = `shape${n}.`;
    this.tool = "points";
    this.snap = true;
    this.sel = -1;
    this.W = 600; this.H = 170; this.pad = 10;
    this.svg = svg("svg", { class: "shape-svg", "aria-hidden": "true" });
    this.g = { grid: svg("g"), fill: svg("path", { class: "shape-fill" }), line: svg("path", { class: "shape-line" }),
      rel: svg("g", { class: "shape-release" }), handles: svg("g"), points: svg("g"), head: svg("line", { class: "shape-head" }) };
    this.svg.append(this.g.grid, this.g.fill, this.g.line, this.g.rel, this.g.handles, this.g.points, this.g.head);
    this.g.head.setAttribute("visibility", "hidden");
    this.area = h("div", { class: "shape-area", tabindex: 0, role: "application",
      "aria-label": `Shape ${n} curve editor. Comma and period select points; arrow keys move the selected point; S smooths it; H makes it a step; Delete removes it.` }, this.svg);
    const toolSeg = h("div", { class: "seg seg-small", role: "radiogroup", "aria-label": "Editing tool" });
    this.toolBtns = ["points", "steps"].map((t) => h("button", { type: "button", class: "seg-btn", role: "radio", text: t === "points" ? "Points" : "Steps", onclick: () => this.setTool(t) }));
    toolSeg.append(...this.toolBtns);
    this.snapBtn = h("button", { type: "button", class: "btn btn-small", "aria-pressed": "true", title: "Snap to the beat grid (hold Shift to place freely)", onclick: () => { this.snap = !this.snap; this.snapBtn.setAttribute("aria-pressed", String(this.snap)); } }, "Snap");
    const presets = h("button", { type: "button", class: "btn btn-small btn-quiet", onclick: (e) => this.presetMenu(e) }, "Curves\u2026");
    this.hint = h("span", { class: "shape-hint" });
    this.bar = h("div", { class: "shape-bar" }, toolSeg, this.snapBtn, presets, this.hint);
    this.root = h("div", { class: "shape-editor" }, this.bar, this.area);
    this.setTool("points");

    this.load();
    this.m.onShapes(() => { this.load(); this.draw(); });
    for (const id of ["curve", "loop", "length", "sync"]) this.m.on(this.pre + id, () => { this.load(); this.draw(); });
    this.app.onTransport(() => this.draw());
    new ResizeObserver(() => this.resize()).observe(this.area);
    this.app.modMeters.on((mm) => this.playhead(mm.active ? mm.shape(n - 1) : null));
    this.bindPointer();
    this.bindKeys();
  }

  setTool(t) {
    this.tool = t;
    this.toolBtns.forEach((b, i) => b.setAttribute("aria-checked", String(["points", "steps"][i] === t)));
    this.hint.textContent = t === "points"
      ? "Click a point to show its handles, then drag them to curve the line. Double-click to add or remove a point; right-click a point for more."
      : "Click or drag to set each step's level.";
    this.draw();
  }

  // Data ---------------------------------------------------------------------------
  curveIndex() { return Math.max(0, Math.round(this.m.get(this.pre + "curve")) - 1); }
  load() {
    this.all = this.m.shapes();
    const s = this.all[this.n - 1] || (this.all[this.n - 1] = { curves: [] });
    while (s.curves.length <= this.curveIndex()) s.curves.push({ points: [[0, 1, -0.5, 0], [1, 0, 0, 0]] });
    this.curve = s.curves[this.curveIndex()];
    this.preview = null;
    if (this.sel >= this.curve.points.length) this.sel = -1;
  }
  // Older curves switch to handles the first time they're edited; until then
  // they display (and play) exactly as saved.
  editable() { skToHandles(this.curve.points); this.preview = null; return this.curve.points; }
  // Points with handles for display: an older curve shows the handles it will
  // get, without changing it until it's edited.
  shown() {
    const pts = this.curve.points;
    if (pts.every(skHasHandles)) return pts;
    if (!this.preview) { this.preview = pts.map((p) => p.slice()); skToHandles(this.preview); }
    return this.preview;
  }
  commit() {
    // Keep points ordered and the ends pinned to 0 and 1.
    const p = this.curve.points;
    this.preview = null;
    p.sort((a, b) => a[0] - b[0]);
    p[0][0] = 0;
    p[p.length - 1][0] = 1;
    // Write only this shape's curve into the current data: other shape
    // editors may have changed theirs since this one loaded.
    const fresh = this.m.shapes();
    const mine = this.all[this.n - 1];
    fresh[this.n - 1] = mine;
    this.all = fresh;
    this.m.setShapes(fresh, true);
    this.draw();
  }
  lengthBeats() {
    if (this.m.get(this.pre + "sync") < 0.5) return 0;
    const p = this.m.param(this.pre + "length");
    return skDivisionBeats(p.choices[Math.round(this.m.get(p.index))], this.app.transport);
  }
  snapStep() {
    const beats = this.lengthBeats();
    if (!beats) return 1 / 16;
    return Math.max(1 / 64, 0.25 / beats);  // sixteenth notes
  }

  // Geometry -------------------------------------------------------------------------
  resize() {
    const w = Math.max(240, Math.round(this.area.clientWidth));
    this.W = w;
    this.H = w < 480 ? 140 : 170;
    this.svg.setAttribute("viewBox", `0 0 ${this.W} ${this.H}`);
    this.svg.setAttribute("width", this.W);
    this.svg.setAttribute("height", this.H);
    this.draw();
  }
  px(x) { return this.pad + x * (this.W - 2 * this.pad); }
  py(y) { return this.pad + (1 - y) * (this.H - 2 * this.pad); }
  sx() { return this.W - 2 * this.pad; }   // pixels per unit x
  sy() { return this.H - 2 * this.pad; }   // pixels per unit y
  local(e) {
    const r = this.svg.getBoundingClientRect();
    return { mx: (e.clientX - r.left) * (this.W / r.width), my: (e.clientY - r.top) * (this.H / r.height) };
  }
  fromEvent(e) {
    const { mx, my } = this.local(e);
    const x = (mx - this.pad) / this.sx(), y = 1 - (my - this.pad) / this.sy();
    return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
  }
  snapX(x, e) {
    if (!this.snap || (e && e.shiftKey)) return x;
    const s = this.snapStep();
    return Math.round(x / s) * s;
  }

  // Where the selected point's handles are drawn (in pixels). Handles of zero
  // length are shown a short way out along the curve's direction, so there's
  // always something to grab.
  handlePositions(i) {
    const pts = this.shown(), p = pts[i];
    const out = [];
    const ghost = 26;
    const add = (kind, dx, dy, neighbour) => {
      if (!neighbour) return;
      let hx = this.px(p[0] + dx), hy = this.py(p[1] + dy);
      if (Math.hypot(hx - this.px(p[0]), hy - this.py(p[1])) < 3) {
        const dirx = this.px(neighbour[0]) - this.px(p[0]), diry = this.py(neighbour[1]) - this.py(p[1]);
        const len = Math.hypot(dirx, diry) || 1, reach = Math.min(ghost, len / 3);
        hx = this.px(p[0]) + (dirx / len) * reach; hy = this.py(p[1]) + (diry / len) * reach;
      }
      // A handle outside the editor (from an older patch) is shown pinned to
      // the edge, where it can still be grabbed; dragging brings it inside.
      const top = this.py(1), bottom = this.py(0);
      const pinned = hy < top - 0.5 || hy > bottom + 0.5;
      if (pinned) {
        const cy = Math.min(bottom, Math.max(top, hy));
        hx = this.px(p[0]) + (hx - this.px(p[0])) * ((cy - this.py(p[1])) / ((hy - this.py(p[1])) || 1));
        hy = cy;
      }
      out.push({ kind, x: hx, y: hy, pinned });
    };
    const has = skHasHandles(p);
    if (!p[3]) add("out", has ? Math.min(Math.max(p[4], 0), pts[i + 1] ? (pts[i + 1][0] - p[0]) / 2 : 0) : 0, has ? p[5] : 0, pts[i + 1]);
    add("in", has ? Math.max(Math.min(p[6], 0), pts[i - 1] ? -(p[0] - pts[i - 1][0]) / 2 : 0) : 0, has ? p[7] : 0, pts[i - 1]);
    return out;
  }

  // What's under the pointer, by position rather than by DOM element (the
  // editor redraws between clicks, so element targets go stale).
  hit(e) {
    const { mx, my } = this.local(e);
    const pts = this.curve.points;
    if (Math.round(this.m.get(this.pre + "loop")) === 4) {
      const rx = this.px(this.curve.release >= 0 ? this.curve.release : 1);
      if (Math.abs(mx - rx) <= 8 && my <= 16) return { kind: "rel" };
    }
    if (this.tool === "points" && this.sel >= 0 && this.sel < pts.length) {
      for (const hp of this.handlePositions(this.sel)) if (Math.hypot(mx - hp.x, my - hp.y) < 9) return { kind: "handle", i: this.sel, which: hp.kind };
    }
    let best = null, bd = 10;
    pts.forEach((p, i) => { const d = Math.hypot(mx - this.px(p[0]), my - this.py(p[1])); if (d < bd) { bd = d; best = { kind: "pt", i }; } });
    return best || { kind: "none" };
  }

  // Drawing ----------------------------------------------------------------------------
  draw() {
    if (!this.curve) return;
    const { grid } = this.g;
    grid.textContent = "";
    const beats = this.lengthBeats();
    const t = this.app.transport;
    const lines = [];
    if (beats) {
      const beatUnit = 4 / t.den, barLen = t.num * beatUnit;
      for (let b = 0; b <= beats + 1e-9; b += 0.25) {
        const x = b / beats;
        const kind = Math.abs(b / barLen - Math.round(b / barLen)) < 1e-9 ? "bar" : Math.abs(b / beatUnit - Math.round(b / beatUnit)) < 1e-9 ? "beat" : "sub";
        lines.push([x, kind]);
      }
      if (lines.filter((l) => l[1] === "sub").length > 64) for (const l of lines) if (l[1] === "sub") l[1] = "";
    } else {
      for (let i = 0; i <= 16; i++) lines.push([i / 16, i % 4 === 0 ? "beat" : "sub"]);
    }
    for (const [x, kind] of lines) {
      if (!kind) continue;
      grid.append(svg("line", { class: "grid-" + kind, x1: this.px(x), x2: this.px(x), y1: this.pad, y2: this.H - this.pad }));
    }
    for (const y of [0, 0.5, 1]) grid.append(svg("line", { class: y === 0.5 ? "grid-sub" : "grid-beat", x1: this.pad, x2: this.W - this.pad, y1: this.py(y), y2: this.py(y) }));

    const pts = this.curve.points;
    let d = "";
    const steps = Math.max(120, Math.round(this.W / 2));
    for (let i = 0; i <= steps; i++) {
      const x = i / steps;
      d += (i ? "L" : "M") + this.px(x).toFixed(1) + " " + this.py(skEvalCurve(pts, x)).toFixed(1) + " ";
    }
    this.g.line.setAttribute("d", d);
    this.g.fill.setAttribute("d", d + `L ${this.px(1)} ${this.py(0)} L ${this.px(0)} ${this.py(0)} Z`);

    this.g.points.textContent = "";
    this.g.handles.textContent = "";
    if (this.tool === "points") {
      if (this.sel >= 0 && this.sel < pts.length) {
        const p = this.shown()[this.sel];
        for (const hp of this.handlePositions(this.sel)) {
          this.g.handles.append(svg("line", { class: "handle-arm", x1: this.px(p[0]), y1: this.py(p[1]), x2: hp.x, y2: hp.y }),
            svg("circle", { class: "handle-knob" + (hp.pinned ? " is-pinned" : ""), cx: hp.x, cy: hp.y, r: 4.5 }));
        }
      }
      pts.forEach((p, i) => {
        const smooth = skHasHandles(p) && !p[8];
        this.g.points.append(svg(smooth || !skHasHandles(p) ? "circle" : "rect", Object.assign(
          { class: "shape-point" + (p[3] ? " is-step" : "") + (i === this.sel ? " is-sel" : "") },
          smooth || !skHasHandles(p)
            ? { cx: this.px(p[0]), cy: this.py(p[1]), r: i === this.sel ? 6 : 5 }
            : { x: this.px(p[0]) - 5, y: this.py(p[1]) - 5, width: 10, height: 10, rx: 1.5 })));
      });
    }

    this.g.rel.textContent = "";
    if (Math.round(this.m.get(this.pre + "loop")) === 4) {
      const rx = this.px(this.curve.release >= 0 ? this.curve.release : 1);
      this.g.rel.append(svg("line", { x1: rx, x2: rx, y1: this.pad, y2: this.H - this.pad }),
        svg("rect", { class: "release-grip", x: rx - 6, y: 0, width: 12, height: 12, rx: 2 }));
    }
  }

  playhead(s) {
    if (!s || s.phase < 0) { this.g.head.setAttribute("visibility", "hidden"); return; }
    const x = this.px(s.phase);
    this.g.head.setAttribute("visibility", "visible");
    this.g.head.setAttribute("x1", x); this.g.head.setAttribute("x2", x);
    this.g.head.setAttribute("y1", this.pad); this.g.head.setAttribute("y2", this.H - this.pad);
  }

  // Editing ---------------------------------------------------------------------------
  moveHandle(i, which, e) {
    const pts = this.editable(), p = pts[i];
    const { mx, my } = this.local(e);
    const sx = this.sx(), sy = this.sy();
    let dx = (mx - this.px(p[0])) / sx, dy = -(my - this.py(p[1])) / sy;
    const wOut = pts[i + 1] ? (pts[i + 1][0] - p[0]) / 2 : 0, wIn = pts[i - 1] ? (p[0] - pts[i - 1][0]) / 2 : 0;
    if (e.altKey) p[8] = 1;  // Alt/Option breaks the pair
    dy = Math.min(1 - p[1], Math.max(-p[1], dy));   // keep the handle inside the editor
    if (which === "out") { p[4] = Math.min(Math.max(dx, 0), wOut); p[5] = dy; }
    else { p[6] = Math.max(Math.min(dx, 0), -wIn); p[7] = dy; }
    if (!p[8]) {
      // Smooth point: the other handle points the opposite way, keeping its length.
      const [ax, ay] = which === "out" ? [p[4], p[5]] : [p[6], p[7]];
      const [ox, oy] = which === "out" ? [p[6], p[7]] : [p[4], p[5]];
      const aLen = Math.hypot(ax * sx, ay * sy);
      let oLen = Math.hypot(ox * sx, oy * sy);
      if (oLen < 3) oLen = aLen;
      if (aLen > 0.5) {
        const nx = (-ax * sx / aLen) * oLen / sx, ny = (-ay * sy / aLen) * oLen / sy;
        if (which === "out") [p[6], p[7]] = skFitHandle(p[1], Math.min(nx, 0), ny, -wIn);
        else [p[4], p[5]] = skFitHandle(p[1], Math.max(nx, 0), ny, wOut);
      }
    }
  }

  bindPointer() {
    let drag = null;
    let lastDown = { t: 0, x: 0, y: 0 };
    this.svg.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      // Without this the browser starts selecting text as the drag drifts out
      // of the editor, and a selection over the editor hijacks the next press.
      e.preventDefault();
      window.getSelection().removeAllRanges();
      this.area.focus({ preventScroll: true });
      const now = performance.now();
      const isDouble = now - lastDown.t < 400 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 8;
      lastDown = isDouble ? { t: 0, x: 0, y: 0 } : { t: now, x: e.clientX, y: e.clientY };
      if (isDouble && this.tool === "points") { e.preventDefault(); this.onDouble(e); return; }
      const hit = this.hit(e);
      this.svg.setPointerCapture(e.pointerId);
      if (hit.kind === "rel") { drag = { kind: "rel" }; return; }
      if (this.tool === "steps") { drag = { kind: "steps" }; this.paintStep(e); return; }
      if (hit.kind === "handle") { drag = hit; return; }
      if (hit.kind === "pt") { this.sel = hit.i; drag = { kind: "pt", i: hit.i }; this.draw(); return; }
      this.sel = -1;
      this.draw();
    });
    this.svg.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (drag.kind === "steps") { this.paintStep(e); return; }
      const { x, y } = this.fromEvent(e);
      if (drag.kind === "pt") {
        const pts = this.editable(), i = drag.i;
        const lo = i === 0 ? 0 : pts[i - 1][0], hi = i === pts.length - 1 ? 1 : pts[i + 1][0];
        if (i !== 0 && i !== pts.length - 1) pts[i][0] = Math.min(hi, Math.max(lo, this.snapX(x, e)));
        pts[i][1] = y;
      } else if (drag.kind === "handle") {
        this.moveHandle(drag.i, drag.which, e);
      } else if (drag.kind === "rel") {
        this.curve.release = Math.min(1, Math.max(0, this.snapX(x, e)));
      }
      this.commit();
    });
    const end = () => { drag = null; };
    this.svg.addEventListener("pointerup", end);
    this.svg.addEventListener("pointercancel", end);
    // Double-click (or double-tap), detected here rather than with the dblclick
    // event, which browsers drop when the editor redraws between the clicks.
    this.onDouble = (e) => {
      const hit = this.hit(e);
      if (hit.kind === "pt") { this.removePoint(hit.i); return; }
      if (hit.kind !== "none") return;
      const pts = this.editable();
      if (pts.length >= 64) { this.app.toast("A curve can have up to 64 points."); return; }
      const { x, y } = this.fromEvent(e);
      const sx = this.snapX(x, e);
      if (sx <= 0 || sx >= 1) return;
      const p = [sx, y, 0, 0, 0, 0, 0, 0, 0];
      pts.push(p);
      pts.sort((a, b) => a[0] - b[0]);
      this.sel = pts.indexOf(p);
      skSmoothHandles(pts, this.sel);
      this.commit();
    };
    this.svg.addEventListener("contextmenu", (e) => {
      const hit = this.hit(e);
      if (hit.kind !== "pt") return;
      e.preventDefault();
      this.sel = hit.i;
      this.draw();
      this.pointMenu(hit.i, e.clientX, e.clientY);
    });
  }

  removePoint(i) {
    const pts = this.editable();
    if (i <= 0 || i >= pts.length - 1) { this.app.toast("The first and last points can't be removed, but you can drag them up and down."); return; }
    pts.splice(i, 1);
    this.sel = -1;
    this.commit();
  }

  pointMenu(i, x, y) {
    const pts = this.editable(), p = pts[i];
    const mid = i > 0 && i < pts.length - 1;
    this.app.menu(x, y, [
      { label: "Smooth (handles move together)", run: () => { skSmoothHandles(pts, i); this.commit(); } },
      { label: "Corner (handles move separately)", run: () => { p[8] = 1; this.commit(); } },
      { label: "Straight lines", run: () => { p[4] = p[5] = p[6] = p[7] = 0; p[8] = 1; this.commit(); } },
      { label: p[3] ? "Not a step" : "Step (hold until the next point)", run: () => { p[3] = p[3] ? 0 : 1; this.commit(); } },
      null,
      { label: "Delete point", run: () => this.removePoint(i), disabled: !mid },
    ]);
  }

  // Steps tool: cells on the snap grid, each a flat step.
  paintStep(e) {
    const { x, y } = this.fromEvent(e);
    const step = this.snapStep();
    const cells = Math.round(1 / step);
    const pts = this.curve.points;
    const isSteps = pts.length === cells + 1 && pts.slice(0, -1).every((p, i) => p[3] && Math.abs(p[0] - i * step) < 1e-6);
    const levels = isSteps ? pts.slice(0, -1).map((p) => p[1]) : [...Array(cells).keys()].map((i) => skEvalCurve(pts, (i + 0.5) * step));
    const c = Math.min(cells - 1, Math.floor(x / step));
    levels[c] = Math.round(y * 20) / 20;
    this.curve.points = levels.map((v, i) => [i * step, v, 0, 1]).concat([[1, levels[cells - 1], 0, 0]]);
    this.sel = -1;
    this.commit();
  }

  bindKeys() {
    this.area.addEventListener("keydown", (e) => {
      const n = this.curve.points.length;
      if (e.key === "," || e.key === ".") {
        this.sel = this.sel < 0 ? 0 : (this.sel + (e.key === "." ? 1 : -1) + n) % n;
        e.preventDefault(); e.stopPropagation(); this.draw(); return;
      }
      if (this.sel < 0) return;
      const pts = this.editable(), p = pts[this.sel], fine = e.shiftKey;
      const dx = fine ? 0.005 : this.snapStep(), dy = fine ? 0.01 : 0.05;
      let used = true;
      if (e.key === "ArrowUp") p[1] = Math.min(1, p[1] + dy);
      else if (e.key === "ArrowDown") p[1] = Math.max(0, p[1] - dy);
      else if (e.key === "ArrowLeft" && this.sel > 0 && this.sel < pts.length - 1) p[0] = Math.max(pts[this.sel - 1][0], p[0] - dx);
      else if (e.key === "ArrowRight" && this.sel > 0 && this.sel < pts.length - 1) p[0] = Math.min(pts[this.sel + 1][0], p[0] + dx);
      else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); e.stopPropagation(); this.removePoint(this.sel); return; }
      else if (e.key === "h" || e.key === "H") p[3] = p[3] ? 0 : 1;
      else if (e.key === "s" || e.key === "S") skSmoothHandles(pts, this.sel);
      else used = false;
      if (used) { e.preventDefault(); e.stopPropagation(); this.commit(); }
    });
  }

  presetMenu(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const set = (pts) => { this.curve.points = pts.map((p) => p.slice()); this.sel = -1; this.commit(); };
    this.app.menu(r.left, r.bottom + 4, [
      ...SK_SHAPE_PRESETS.map(([name, pts]) => ({ label: name, run: () => set(pts) })),
      null,
      { label: "Random steps", run: () => {
        const step = this.snapStep(), cells = Math.round(1 / step);
        const lv = [...Array(cells)].map(() => Math.round(Math.random() * 10) / 10);
        set(lv.map((v, i) => [i * step, v, 0, 1]).concat([[1, lv[cells - 1], 0, 0]]));
      } },
      { label: this.curve.release >= 0 ? "Remove release point" : "Add release point at the middle", run: () => {
        this.curve.release = this.curve.release >= 0 ? -1 : 0.5;
        this.commit();
        if (this.curve.release >= 0 && Math.round(this.m.get(this.pre + "loop")) !== 4) this.app.toast('Set Loop to "Release" for the release point to take effect.');
      } },
    ]);
  }
}

class ShapePanel {
  constructor(app, n, title) {
    const pre = `shape${n}.`, m = app.model;
    const { root, controls } = skSection(title || `Shape ${n}`, "shape-panel is-wide");
    this.editor = new ShapeEditor(app, n);
    const body = h("div", { class: "shape-body" }, this.editor.root, controls);
    root.append(body);
    const c = skAddControls(app, controls, [
      [pre + "trigger", "Trigger", "menu"], [pre + "loop", "Loop", "menu"], [pre + "start", "Start", "menu"],
      [pre + "sync", "Sync", "toggle"], [pre + "length", "Length", "menu"], [pre + "time", "Time"],
      [pre + "curve", "Curve", "menu"], [pre + "rate", "Rate"], [pre + "offset", "Offset"], [pre + "depth", "Depth"],
      [pre + "smooth", "Smooth"], [pre + "keyLow", "Lowest key", "menu"], [pre + "keyHigh", "Highest key", "menu"],
      [pre + "velLow", "Lowest vel."], [pre + "velHigh", "Highest vel."]]);
    const sync = (v) => {
      if (c[pre + "length"]) c[pre + "length"].root.hidden = v < 0.5;
      if (c[pre + "time"]) c[pre + "time"].root.hidden = v >= 0.5;
    };
    m.on(pre + "sync", sync);
    sync(m.get(pre + "sync"));
    // Key/velocity ranges only matter for note triggers; a quantised start
    // only for triggers that start the shape (not bar, beat or free).
    const trig = (v) => {
      const t = Math.round(v);
      for (const k of ["keyLow", "keyHigh", "velLow", "velHigh"]) if (c[pre + k]) c[pre + k].root.hidden = t > 1;
      if (c[pre + "start"]) c[pre + "start"].root.hidden = t >= 2 && t <= 4;
    };
    m.on(pre + "trigger", trig);
    trig(m.get(pre + "trigger"));
    // Key ranges read better as note names.
    for (const k of ["keyLow", "keyHigh"]) {
      const sel = c[pre + k] && c[pre + k].select;
      if (sel) for (const o of sel.options) o.textContent = skNoteName(Number(o.value));
    }
    this.root = root;
  }
}
