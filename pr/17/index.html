<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synthkit Basic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
/* synthkit shell. A light instrument enclosure (graphite in dark mode);
   each synth sets --accent in ui/layout.json \002192 theme.accent. */
:root {
  --accent-base: #2457d6;
  --accent: var(--accent-base);
  --bg: #dcdfd9;
  --panel: #e9ebe6;
  --edge: #c4c9c1;
  --ink: #1f2a2e;
  --ink-soft: #5a6561;
  --cap: #2b3134;
  --cap-hi: #434b50;
  --track: #c2c7bf;
  --key: #f7f8f4;
  --key-edge: #b9beb6;
  --key-black: #262b2e;
  --field: #f5f6f2;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 1px 2px rgba(31, 42, 46, 0.12);
  --warn: #9a5b00;
  --error: #b3261e;
  --radius: 10px;
  --font: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: color-mix(in oklab, var(--accent-base) 68%, white);
    --bg: #1d2123;
    --panel: #262b2e;
    --edge: #343b3f;
    --ink: #e3e7e1;
    --ink-soft: #98a19d;
    --cap: #111518;
    --cap-hi: #30373c;
    --track: #3a4247;
    --key: #d9ddd6;
    --key-edge: #8d948f;
    --key-black: #121517;
    --field: #1f2427;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 1px 2px rgba(0, 0, 0, 0.35);
    --warn: #f0b860;
    --error: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: color-mix(in oklab, var(--accent-base) 68%, white);
  --bg: #1d2123;
  --panel: #262b2e;
  --edge: #343b3f;
  --ink: #e3e7e1;
  --ink-soft: #98a19d;
  --cap: #111518;
  --cap-hi: #30373c;
  --track: #3a4247;
  --key: #d9ddd6;
  --key-edge: #8d948f;
  --key-black: #121517;
  --field: #1f2427;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 1px 2px rgba(0, 0, 0, 0.35);
  --warn: #f0b860;
  --error: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.35 var(--font);
  font-variation-settings: "wdth" 90;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ---- header ---------------------------------------------------------- */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--edge);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: 6px; }
.synth-name {
  margin: 0; font-size: 26px; line-height: 1; font-weight: 700;
  font-variation-settings: "wdth" 75; letter-spacing: -0.01em;
}
.synth-meta { color: var(--ink-soft); font-size: 12px; }

.btn {
  border: 1px solid var(--edge); background: var(--panel); border-radius: 7px;
  padding: 5px 11px; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap;
}
.btn:hover { border-color: var(--ink-soft); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-quiet { background: transparent; box-shadow: none; }
.btn-icon { padding: 5px 9px; min-width: 32px; }

.presets { display: flex; align-items: center; gap: 6px; }
.preset-field { position: relative; display: flex; align-items: center; }
.preset-select, .preset-name, .sig-select, .midi-select, .menu-select, .bpm-input {
  background: var(--field); border: 1px solid var(--edge); border-radius: 7px; padding: 5px 8px;
}
.preset-select, .preset-name { width: 13.5rem; font-weight: 600; }
.preset-dirty {
  position: absolute; right: -4px; top: -4px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg);
}

.tempo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tempo-readout { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
.play-btn { min-width: 58px; }
.play-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.bpm { display: flex; align-items: center; gap: 5px; color: var(--ink-soft); }
.bpm-input { width: 4.2rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.beats { display: flex; gap: 4px; }
.beat { width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
.beat.is-down { width: 9px; height: 9px; margin-top: -1px; }
.beat.is-on { background: var(--accent); }

.midi { display: flex; align-items: center; gap: 6px; }
.midi-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
.midi-dot.is-flash { animation: flash 0.25s ease-out; }
@keyframes flash { from { background: var(--accent); } }
.midi-select { max-width: 12rem; }

.output { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.scope {
  width: 160px; height: 40px; color: var(--accent);
  background: var(--field); border: 1px solid var(--edge); border-radius: 7px;
}
.output-side { display: flex; flex-direction: column; gap: 5px; width: 74px; }
.level { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.level-fill { height: 100%; width: 0; background: var(--ink-soft); transition: width 60ms linear; }
.level.is-hot .level-fill { background: var(--error); }
.voice-count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.top-actions { display: flex; gap: 4px; }
.theme-btn { display: inline-flex; align-items: center; justify-content: center; }

.start-banner {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  margin: 0; padding: 9px 16px; width: 100%;
  border: 0; border-bottom: 1px solid var(--edge); background: var(--panel); cursor: pointer;
}
.start-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* The host bar on a synth's own page (API.md \0000a79a): what a DAW would provide.
   Restyle with .sk-hostbar in ui/style.css. */
.sk-hostbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 6px 12px; margin: 0 0 12px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius);
  font-size: 13px; color: var(--ink);
}
.sk-hostbar:empty { display: none; }
.start-banner.in-hostbar {
  width: auto; padding: 4px 10px; border: 1px solid var(--accent); border-radius: var(--radius);
  background: transparent; color: var(--ink); font: inherit;
}

/* ---- panels ---------------------------------------------------------- */
.main { flex: 1; padding: 18px 20px 22px; }
.panels { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.panel {
  flex: 1 1 auto;
  background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius);
  padding: 12px 16px 14px; box-shadow: var(--shadow);
}
.panel.is-wide { flex-basis: 100%; }
.panel-title {
  margin: 0 0 10px; font-size: 13px; font-weight: 650; color: var(--ink);
  font-variation-settings: "wdth" 80;
}
.controls { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-start; }
.env-preview { display: block; width: 100%; height: 44px; margin: -2px 0 10px; }
.env-line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.env-fill { fill: var(--accent); opacity: 0.1; }

/* Tabs: a row of tab buttons over the panels of the chosen tab. */
.tabs { flex: 1 1 100%; min-width: 0; }
.tab-list {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--edge); margin-bottom: 14px;
}
.tab-list::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: none; cursor: pointer; white-space: nowrap;
  padding: 7px 14px 8px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  font-weight: 600; font-variation-settings: "wdth" 80; color: var(--ink-soft);
  border-radius: 7px 7px 0 0;
}
.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--panel) 60%, transparent); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline-offset: -2px; }

/* Accordions: panels stacked in a column, each folding at its title. */
.accordion { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.accordion.is-wide { flex-basis: 100%; }
.accordion > .panel { flex: none; }
.panel.is-collapsible > .panel-title { display: flex; align-items: center; cursor: pointer; }
.panel-toggle {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; text-align: left;
  border: 0; background: none; padding: 2px 0; margin: -2px 0; cursor: pointer;
  font: inherit; font-weight: inherit; color: inherit;
}
.panel-chevron { width: 12px; height: 12px; flex: none; transition: transform 0.15s; }
.panel-chevron path { fill: none; stroke: var(--ink-soft); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.panel.is-collapsed > .panel-title .panel-chevron { transform: rotate(-90deg); }
.panel.is-collapsed { padding-bottom: 12px; }
.panel.is-collapsed > .panel-title { margin-bottom: 0; }
.panel-title:hover .panel-chevron path { stroke: var(--ink); }

/* Info icons and their popover. */
.info-btn {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 22px; height: 22px; padding: 3px; margin: -4px -4px -4px 0; vertical-align: middle;
  border: 0; border-radius: 50%; background: none; cursor: help; color: var(--ink-soft);
}
.info-btn svg { width: 14px; height: 14px; display: block; }
.info-ring { fill: none; stroke: currentColor; stroke-width: 1.3; }
.info-stem { stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.info-dot { fill: currentColor; }
.info-btn:hover, .info-btn[aria-expanded="true"] { color: var(--accent); }
.panel-title .info-btn { margin-left: 2px; }
.info-pop {
  position: fixed; z-index: 25; max-width: min(280px, calc(100vw - 16px)); padding: 8px 11px;
  border-radius: 8px; background: var(--cap); color: #f1f3ef; font-size: 12px; line-height: 1.4;
  border: 1px solid var(--cap-hi); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22); white-space: pre-line;
}

/* ---- controls -------------------------------------------------------- */
.ctl { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 62px; position: relative; }
.ctl-label { font-size: 12px; color: var(--ink-soft); text-align: center; max-width: 9em; line-height: 1.2; }
.ctl-value {
  border: 0; background: none; padding: 1px 4px; border-radius: 4px; cursor: text;
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.ctl-value:hover { background: var(--field); }
.ctl-value.is-static { cursor: default; }
.ctl-value.is-static:hover { background: none; }
.ctl-edit { width: 6.5em; font-size: 12px; text-align: center; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--field); }
.ctl.has-cc::after {
  content: ""; position: absolute; top: 0; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
}
.ctl.is-learning .knob-dial, .ctl.is-learning .slider-track, .ctl.is-learning .seg, .ctl.is-learning .toggle, .ctl.is-learning select {
  outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: 50%;
}

.knob-dial { width: 52px; height: 52px; cursor: ns-resize; touch-action: none; border-radius: 50%; }
.is-large .knob-dial { width: 70px; height: 70px; }
.is-small .knob-dial { width: 40px; height: 40px; }
.knob-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.knob-track { fill: none; stroke: var(--track); stroke-width: 7; stroke-linecap: round; }
.knob-arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
.knob-cap { fill: var(--cap); stroke: var(--cap-hi); stroke-width: 2; }
.knob-pointer { stroke: #fff; stroke-width: 4.5; stroke-linecap: round; }
.is-active .knob-cap { stroke: var(--accent); }

.ctl-slider { align-items: stretch; min-width: 150px; }
.ctl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slider-track { position: relative; height: 22px; cursor: ew-resize; touch-action: none; }
.slider-track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--track); }
.slider-fill { position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--accent); }
.slider-thumb { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--cap); border: 2px solid var(--cap-hi); }

.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 7px; overflow: hidden; background: var(--field); margin-top: 2px; }
.seg-btn { border: 0; background: none; padding: 5px 9px; cursor: pointer; font-size: 12px; }
.seg-btn + .seg-btn { border-left: 1px solid var(--edge); }
.seg-btn[aria-checked="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .seg-btn[aria-checked="true"] { color: #0f1316; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg-btn[aria-checked="true"] { color: #0f1316; } }
.ctl-segmented { align-items: flex-start; }
.ctl-segmented .ctl-label { text-align: left; }

.ctl-menu { align-items: flex-start; }
.menu-select { margin-top: 2px; font-size: 12px; }

.toggle { width: 38px; height: 22px; border-radius: 11px; border: 1px solid var(--edge); background: var(--track); position: relative; cursor: pointer; padding: 0; }
.toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--cap); transition: left 0.12s; }
.toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.toggle[aria-checked="true"] .toggle-knob { left: 18px; background: #fff; }

.xy-pad { position: relative; width: 132px; height: 132px; border-radius: 8px; background: var(--field); border: 1px solid var(--edge); cursor: crosshair; touch-action: none;
  background-image: linear-gradient(var(--edge) 1px, transparent 1px), linear-gradient(90deg, var(--edge) 1px, transparent 1px);
  background-size: 33.33% 33.33%; background-position: -1px -1px; }
.xy-dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
.ctl-custom.is-broken { color: var(--error); max-width: 16em; }

/* ---- keyboard -------------------------------------------------------- */
.keyboard {
  display: flex; gap: 14px; padding: 12px 20px 18px; border-top: 1px solid var(--edge);
  background: var(--panel); position: sticky; bottom: 0;
}
.kb-wheels { display: flex; gap: 10px; padding-top: 28px; }
.wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wheel { position: relative; width: 26px; height: 112px; border-radius: 7px; background: var(--cap); cursor: ns-resize; touch-action: none; }
.wheel.is-bend::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1px; background: var(--cap-hi); }
.wheel-thumb { position: absolute; left: 3px; right: 3px; height: 14px; border-radius: 4px; background: var(--cap-hi); border-top: 2px solid var(--accent); }
.wheel-label { font-size: 11px; color: var(--ink-soft); }
.kb-main { flex: 1; min-width: 0; }
.kb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-bottom: 8px; }
.kb-octave { display: flex; align-items: center; gap: 6px; }
.kb-spacer { flex: 1; }
.kb-range { font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; font-weight: 600; }
.kb-hint { color: var(--ink-soft); font-size: 12px; flex: 1; }
.kb-vel { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.keys { --black-w: min(2.2%, 20px); position: relative; height: 112px; touch-action: none; user-select: none; }
.key { position: absolute; top: 0; cursor: pointer; }
.key-white {
  height: 100%; background: var(--key); border: 1px solid var(--key-edge); border-top: 0;
  border-radius: 0 0 6px 6px; box-shadow: 0 -3px 0 rgba(0, 0, 0, 0.06) inset;
}
.key-black {
  width: var(--black-w); min-width: 12px; height: 62%; background: var(--key-black); z-index: 1;
  border-radius: 0 0 4px 4px; box-shadow: 0 -4px 0 rgba(255, 255, 255, 0.08) inset;
}
.key-white.is-down { background: color-mix(in srgb, var(--accent) 30%, var(--key)); }
.key-black.is-down { background: var(--accent); }
.key-name { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: #6b736f; pointer-events: none; }

/* ---- menus, toasts, errors ------------------------------------------- */
.menu {
  position: fixed; z-index: 20; min-width: 190px; padding: 5px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
}
.menu-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--field); outline: none; }
.menu-item:disabled { color: var(--ink-soft); opacity: 0.6; cursor: default; }
.menu-sep { height: 1px; background: var(--edge); margin: 4px 6px; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--cap); color: #fff; padding: 9px 13px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); }
.toast.is-warn { border-left: 4px solid var(--warn); }
.toast.is-error { border-left: 4px solid var(--error); }
.fatal { max-width: 34rem; margin: 15vh auto; padding: 0 20px; }
.fatal h1 { font-size: 24px; font-variation-settings: "wdth" 75; }

/* ---- small screens --------------------------------------------------- */
@media (max-width: 720px) {
  .top { padding: 12px 16px; gap: 10px 14px; }
  .presets { width: 100%; }
  .preset-field { flex: 1; }
  .preset-select, .preset-name { width: 100%; }
  .output { margin-left: 0; }
  .scope { width: 120px; }
  .main { padding: 14px 16px; }
  .panel { flex: 1 1 100%; }
  .keyboard { padding: 10px 16px 14px; gap: 10px; }
  .kb-hint { display: none; }
  .kb-spacer { display: none; }
  .wheel { height: 96px; width: 22px; }
  .keys { height: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---- modulation ------------------------------------------------------ */
.knob-mod { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; opacity: 0.55; }
.btn-small { padding: 3px 9px; font-size: 12px; }
.btn[aria-pressed="true"].btn-small { border-color: var(--accent); color: var(--accent); }
.seg-small .seg-btn { padding: 3px 9px; }
.menu { max-height: min(70vh, 520px); overflow-y: auto; }

.lfo-panel { flex: 1 1 280px; }
.lfo-panel > .panel-title { display: flex; align-items: center; gap: 4px; }
.lfo-group { display: contents; }
.panel-remove {
  margin: -4px -6px -4px auto; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
  background: none; color: var(--ink-soft); font-size: 17px; line-height: 1; cursor: pointer;
}
.panel-remove:hover { color: var(--ink); background: var(--field); }
.lfo-add {
  flex: 0 1 180px; min-height: 120px; align-self: stretch;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1.5px dashed var(--edge); border-radius: var(--radius); background: none;
  color: var(--ink-soft); font-weight: 600; cursor: pointer;
}
.lfo-add:hover { border-color: var(--accent); color: var(--accent); }
.lfo-add-plus { font-size: 26px; line-height: 1; font-weight: 400; }
.lfo-preview { display: block; width: 100%; height: 36px; margin: -2px 0 10px; overflow: visible; }
.lfo-axis { stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.lfo-line { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.lfo-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

.shape-body { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.shape-editor { flex: 1 1 420px; min-width: 0; }
.shape-panel .controls { flex: 1 1 300px; }
.shape-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.shape-hint { color: var(--ink-soft); font-size: 12px; }
.shape-area { border: 1px solid var(--edge); border-radius: 8px; background: var(--field); touch-action: none; overflow: hidden; }
.shape-svg { display: block; width: 100%; height: auto; cursor: crosshair; }
.grid-bar { stroke: var(--ink-soft); stroke-width: 1; opacity: 0.55; }
.grid-beat { stroke: var(--edge); stroke-width: 1; }
.grid-sub { stroke: var(--edge); stroke-width: 1; opacity: 0.5; stroke-dasharray: 2 3; }
.shape-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.shape-fill { fill: var(--accent); opacity: 0.1; }
.shape-point { fill: var(--panel); stroke: var(--accent); stroke-width: 2; cursor: grab; }
.shape-point.is-step { fill: var(--accent); }
.shape-point.is-sel { stroke: var(--ink); stroke-width: 2.5; }
.handle-arm { stroke: var(--ink-soft); stroke-width: 1.2; }
.handle-knob { fill: var(--ink); stroke: var(--panel); stroke-width: 1.5; cursor: move; }
.handle-knob.is-pinned { fill: var(--panel); stroke: var(--ink); stroke-dasharray: 2 2; }
.shape-release line { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.release-grip { fill: var(--ink); cursor: ew-resize; }
.shape-head { stroke: var(--ink); stroke-width: 1.5; opacity: 0.7; }

.matrix { display: flex; flex-direction: column; gap: 8px; }
.matrix-empty { margin: 0; color: var(--ink-soft); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 6px 0; border-bottom: 1px solid var(--edge); }
.route:last-child { border-bottom: 0; }
.route select { max-width: 13rem; }
.route-src { display: flex; flex-direction: column; gap: 3px; }
.route-to { color: var(--ink-soft); }
.route-via { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); font-size: 12px; }
.route-meter { position: relative; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
.route-meter-fill { position: absolute; top: 0; bottom: 0; background: var(--accent); }
.amt { display: flex; align-items: center; gap: 6px; }
.amt-track { position: relative; width: 140px; height: 22px; cursor: ew-resize; touch-action: none; }
.amt-track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--track); }
.amt-zero { position: absolute; left: 50%; top: 5px; width: 1px; height: 12px; background: var(--ink-soft); }
.amt-fill { position: absolute; top: 9px; height: 4px; background: var(--accent); border-radius: 2px; }
.amt-value { min-width: 4.2em; text-align: right; }
.matrix-foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.matrix-count { color: var(--ink-soft); font-size: 12px; }

@media (max-width: 720px) {
  .lfo-add { flex-basis: 100%; min-height: 52px; flex-direction: row; gap: 8px; }
  .lfo-add-plus { font-size: 20px; }
  .route select { max-width: 100%; }
  .amt-track { width: 110px; }
  .shape-hint { display: none; }
}

/* Dragging controls must never start a text selection. */
.shape-area, .amt, .knob-dial, .slider-track, .wheel, .xy-pad, .keys, .seg { -webkit-user-select: none; user-select: none; }

</style>

<script type="text/plain" id="sk-worklet">// Shared by the page and the AudioWorklet: a minimal WASI shim and helpers
// for passing strings to and from the synth's WebAssembly module.
// (TextEncoder/TextDecoder aren't available inside AudioWorklets.)

function skUtf8Encode(str) {
  const out = [];
  for (let i = 0; i < str.length; i++) {
    let c = str.codePointAt(i);
    if (c > 0xffff) i++;
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return out;
}

function skUtf8Decode(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; ) {
    const b = bytes[i++];
    let c;
    if (b < 0x80) c = b;
    else if (b < 0xe0) c = ((b & 31) << 6) | (bytes[i++] & 63);
    else if (b < 0xf0) c = ((b & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
    else c = ((b & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
    s += String.fromCodePoint(c);
  }
  return s;
}

function skBase64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Imports for the module. `log` receives text the synth prints (errors).
function skImports(getMemory, log) {
  const ENOSYS = 52, EBADF = 8;
  const view = () => new DataView(getMemory().buffer);
  const bytes = (ptr, len) => new Uint8Array(getMemory().buffer, ptr, len);
  const wasi = {
    fd_write(fd, iovs, iovsLen, nwritten) {
      const dv = view();
      let total = 0, text = "";
      for (let i = 0; i < iovsLen; i++) {
        const p = dv.getUint32(iovs + i * 8, true), n = dv.getUint32(iovs + i * 8 + 4, true);
        text += skUtf8Decode(bytes(p, n));
        total += n;
      }
      dv.setUint32(nwritten, total, true);
      if (text.trim()) log(text.trim());
      return 0;
    },
    proc_exit(code) { throw new Error("synth stopped (exit " + code + ")"); },
    environ_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    environ_get() { return 0; },
    args_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    args_get() { return 0; },
    clock_time_get(id, precision, out) { view().setBigUint64(out, BigInt(Date.now()) * 1000000n, true); return 0; },
    random_get(buf, len) { const b = bytes(buf, len); for (let i = 0; i < len; i++) b[i] = (Math.random() * 256) | 0; return 0; },
    fd_prestat_get() { return EBADF; },
    fd_close() { return EBADF; },
    fd_fdstat_get() { return EBADF; },
    fd_seek() { return EBADF; },
    fd_read() { return EBADF; },
  };
  return {
    wasi_snapshot_preview1: new Proxy(wasi, { get: (t, k) => t[k] || (() => ENOSYS) }),
    env: {
      sk_log(ptr, len) { log(skUtf8Decode(bytes(ptr, len))); },
    },
  };
}

// Thin wrapper over an instantiated synth module.
class SkWasm {
  constructor(instance) {
    this.x = instance.exports;
    if (this.x._initialize) this.x._initialize();
    this.x.sk_init();
  }
  get memory() { return this.x.memory; }
  // Read a NUL-terminated UTF-8 string.
  str(ptr) {
    const m = new Uint8Array(this.x.memory.buffer);
    let end = ptr;
    while (m[end] !== 0) end++;
    return skUtf8Decode(m.subarray(ptr, end));
  }
  // Call fn with pointers to NUL-terminated copies of each string argument.
  withStrings(strings, fn) {
    const ptrs = strings.map((s) => {
      const enc = skUtf8Encode(String(s));
      const p = this.x.sk_alloc(enc.length + 1);
      const m = new Uint8Array(this.x.memory.buffer);
      m.set(enc, p);
      m[p + enc.length] = 0;
      return p;
    });
    try { return fn(...ptrs); } finally { ptrs.forEach((p) => this.x.sk_free(p)); }
  }
  json(ptr) { return JSON.parse(this.str(ptr)); }
}

// AudioWorklet processor: runs the synth. Receives MIDI, parameter changes and
// patches from the page; sends back meters and a scope trace.
const SCOPE = 1024;

class SynthkitProcessor extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const o = options.processorOptions || {};
    this.log = (m) => this.port.postMessage({ t: "log", msg: m });
    let memory = null;
    const mod = new WebAssembly.Module(o.wasm);
    const inst = new WebAssembly.Instance(mod, skImports(() => memory, this.log));
    memory = inst.exports.memory;
    this.w = new SkWasm(inst);
    this.x = this.w.x;
    // Load the sound before prepare, so parameters start at their values
    // instead of gliding there from the defaults.
    // (The patch includes the mod matrix and shapes.)
    if (o.patch) this.w.withStrings([o.patch], (p) => this.x.sk_load_patch(p));
    for (const [id, json] of Object.entries(o.custom || {})) this.w.withStrings([id, json], (a, b) => this.x.sk_set_custom(a, b));
    this.block = 128;
    this.x.sk_prepare(sampleRate, this.block);
    this.meterCount = this.x.sk_mod_meter_count();
    this.clockCorr = 0;  // beats still to absorb when following MIDI clock

    const tr = o.transport || {};
    this.bpm = tr.bpm || 120;
    this.playing = !!tr.playing;
    this.num = tr.num || 4;
    this.den = tr.den || 4;
    this.beat = 0;
    this.source = tr.source === "midi" ? 1 : 0;   // the page's tempo controls, or MIDI clock

    this.queue = [];                   // live MIDI: [status, d1, d2]
    this.schedule = o.schedule || [];  // offline renders: {sample, d}
    this.si = 0;
    this.pos = 0;
    this.scope = new Float32Array(SCOPE);
    this.scopePos = 0;
    this.peak = 0;
    this.meterEvery = Math.round(sampleRate / 30);
    this.sinceMeter = 0;
    this.meters = o.meters !== false;
    this.port.onmessage = (e) => this.onMessage(e.data);
  }

  onMessage(m) {
    const x = this.x;
    switch (m.t) {
      case "midi": this.queue.push(m.d); break;
      case "param": x.sk_set_param(m.i, m.v); break;
      case "patch": this.w.withStrings([m.json], (p) => x.sk_load_patch(p)); break;
      case "custom": this.w.withStrings([m.id, m.json], (a, b) => x.sk_set_custom(a, b)); break;
      case "mod": this.w.withStrings([m.json], (p) => x.sk_set_mod(p)); break;
      case "shapes": this.w.withStrings([m.json], (p) => x.sk_set_shapes(p)); break;
      case "clock": {
        // Follow external MIDI clock: big differences are jumps, small ones
        // are absorbed gradually so the engine never sees a false jump.
        this.bpm = m.bpm;
        this.source = 1;
        if (m.playing && !this.playing) { this.beat = m.beat; this.clockCorr = 0; }
        this.playing = m.playing;
        const err = m.beat - this.beat;
        if (Math.abs(err) > 0.5) { this.beat = m.beat; this.clockCorr = 0; } else this.clockCorr = err;
        break;
      }
      case "transport":
        if (m.playing && !this.playing) this.beat = 0;  // start from the top
        this.bpm = m.bpm; this.playing = m.playing; this.num = m.num; this.den = m.den;
        this.source = m.source === "midi" ? 1 : 0;
        break;
      case "msg": {
        const v = m.v || [];
        x.sk_message(m.i, Math.min(4, v.length), v[0] || 0, v[1] || 0, v[2] || 0, v[3] || 0);
        break;
      }
      case "allOff": x.sk_all_notes_off(); break;
      case "panic": x.sk_panic(); break;
    }
  }

  process(inputs, outputs) {
    const out = outputs[0];
    const L = out[0], R = out[1] || out[0];
    const n = L.length;
    const x = this.x;
    const sched = this.schedule;
    for (const d of this.queue) x.sk_midi(0, d[0], d[1] | 0, d[2] | 0);
    this.queue.length = 0;
    // Offline renders may schedule messages ({sample, m: [index, values]});
    // the block is split at each, as the native render tool does, so the two
    // agree sample for sample.
    let done = 0;
    while (done < n) {
      const at = this.pos + done;
      while (this.si < sched.length && sched[this.si].m && sched[this.si].sample <= at) {
        const [i, v = []] = sched[this.si++].m;
        x.sk_message(i, Math.min(4, v.length), v[0] || 0, v[1] || 0, v[2] || 0, v[3] || 0);
      }
      let end = n;
      for (let k = this.si; k < sched.length && sched[k].sample < this.pos + n; k++)
        if (sched[k].m) { end = Math.min(end, sched[k].sample - this.pos); break; }
      if (end <= done) end = n;   // never stall
      while (this.si < sched.length && !sched[this.si].m && sched[this.si].sample < this.pos + end) {
        const ev = sched[this.si++];
        x.sk_midi(Math.max(0, ev.sample - at), ev.d[0], ev.d[1] | 0, ev.d[2] | 0);
      }
      const len = end - done;
      x.sk_process(len, this.bpm, this.playing ? 1 : 0, this.beat, this.num, this.den, this.source);
      // Views must be re-created if the module's memory grew.
      const buf = this.x.memory.buffer;
      L.set(new Float32Array(buf, x.sk_left(), len), done);
      if (R !== L) R.set(new Float32Array(buf, x.sk_right(), len), done);
      if (this.playing) {
        this.beat += (len / sampleRate) * (this.bpm / 60);
        if (this.clockCorr !== 0) {
          const step = this.clockCorr * Math.min(1, len / (sampleRate * 0.2));
          this.beat += step;
          this.clockCorr -= step;
          if (Math.abs(this.clockCorr) < 1e-6) this.clockCorr = 0;
        }
      }
      done = end;
    }
    this.pos += n;
    const l = L, r = R;

    // Parameters the engine moved (mapped MIDI controllers, ctx.setParam):
    // the page's copy follows (API.md \u00a73).
    const nc = x.sk_take_param_changes();
    if (nc) {
      const ids = new Int32Array(this.x.memory.buffer, x.sk_param_change_buffer(), nc);
      const seen = new Set(), changes = [];
      for (const i of ids) if (!seen.has(i)) { seen.add(i); changes.push([i, x.sk_get_param(i)]); }
      this.port.postMessage({ t: "params", changes });
    }

    // Messages the synth posted for the page (API.md \u00a79b).
    const nm = x.sk_take_messages();
    if (nm) {
      const mb = new Float32Array(this.x.memory.buffer, x.sk_message_buffer(), nm * 6);
      const list = [];
      for (let k = 0; k < nm; k++) list.push([mb[k * 6], Array.from(mb.subarray(k * 6 + 2, k * 6 + 2 + mb[k * 6 + 1]))]);
      this.port.postMessage({ t: "msgs", list });
    }

    if (!this.meters) return true;
    for (let i = 0; i < n; i++) {
      const v = 0.5 * (l[i] + r[i]);
      this.scope[this.scopePos] = v;
      this.scopePos = (this.scopePos + 1) % SCOPE;
      const a = Math.max(Math.abs(l[i]), Math.abs(r[i]));
      if (a > this.peak) this.peak = a;
    }
    this.sinceMeter += n;
    if (this.sinceMeter >= this.meterEvery) {
      this.sinceMeter = 0;
      const st = new Float32Array(this.x.memory.buffer, x.sk_stats(), 5);
      const trace = new Float32Array(SCOPE);
      for (let i = 0; i < SCOPE; i++) trace[i] = this.scope[(this.scopePos + i) % SCOPE];
      const mod = new Float32Array(this.meterCount);
      if (this.meterCount) mod.set(new Float32Array(this.x.memory.buffer, x.sk_mod_meters(), this.meterCount));
      this.port.postMessage({ t: "meter", voices: st[0], limiterDb: st[1], peak: this.peak, beat: this.beat, playing: this.playing, bpm: this.bpm, scope: trace, mod }, [trace.buffer, mod.buffer]);
      this.peak = 0;
    }
    return true;
  }
}

registerProcessor("synthkit", SynthkitProcessor);
</script>

<script>window.__skCustomRegister = (function () {
// "Clear echoes": sends the synth a message (API.md \u00a79b) to empty its delay,
// and shows the synth's answer. Messages aren't parameters: nothing is saved
// or automated, it just happens.
function register(sk) {
  sk.widget("clearEchoes", (el, ctx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn";
    btn.textContent = "Clear echoes";
    btn.title = "Empty the delay right now";
    btn.addEventListener("click", () => ctx.send("delay.clear"));
    const note = document.createElement("span");
    note.className = "clear-note";
    note.setAttribute("aria-live", "polite");
    ctx.onMessage("delay.cleared", () => {
      note.textContent = "Cleared";
      clearTimeout(note.timer);
      note.timer = setTimeout(() => { note.textContent = ""; }, 1200);
    });
    el.append(btn, note);
  });
}

return typeof register === 'function' ? register : null;
})();</script>

function skBase64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Imports for the module. `log` receives text the synth prints (errors).
function skImports(getMemory, log) {
  const ENOSYS = 52, EBADF = 8;
  const view = () => new DataView(getMemory().buffer);
  const bytes = (ptr, len) => new Uint8Array(getMemory().buffer, ptr, len);
  const wasi = {
    fd_write(fd, iovs, iovsLen, nwritten) {
      const dv = view();
      let total = 0, text = "";
      for (let i = 0; i < iovsLen; i++) {
        const p = dv.getUint32(iovs + i * 8, true), n = dv.getUint32(iovs + i * 8 + 4, true);
        text += skUtf8Decode(bytes(p, n));
        total += n;
      }
      dv.setUint32(nwritten, total, true);
      if (text.trim()) log(text.trim());
      return 0;
    },
    proc_exit(code) { throw new Error("synth stopped (exit " + code + ")"); },
    environ_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    environ_get() { return 0; },
    args_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    args_get() { return 0; },
    clock_time_get(id, precision, out) { view().setBigUint64(out, BigInt(Date.now()) * 1000000n, true); return 0; },
    random_get(buf, len) { const b = bytes(buf, len); for (let i = 0; i < len; i++) b[i] = (Math.random() * 256) | 0; return 0; },
    fd_prestat_get() { return EBADF; },
    fd_close() { return EBADF; },
    fd_fdstat_get() { return EBADF; },
    fd_seek() { return EBADF; },
    fd_read() { return EBADF; },
  };
  return {
    wasi_snapshot_preview1: new Proxy(wasi, { get: (t, k) => t[k] || (() => ENOSYS) }),
    env: {
      sk_log(ptr, len) { log(skUtf8Decode(bytes(ptr, len))); },
    },
  };
}

// Thin wrapper over an instantiated synth module.
class SkWasm {
  constructor(instance) {
    this.x = instance.exports;
    if (this.x._initialize) this.x._initialize();
    this.x.sk_init();
  }
  get memory() { return this.x.memory; }
  // Read a NUL-terminated UTF-8 string.
  str(ptr) {
    const m = new Uint8Array(this.x.memory.buffer);
    let end = ptr;
    while (m[end] !== 0) end++;
    return skUtf8Decode(m.subarray(ptr, end));
  }
  // Call fn with pointers to NUL-terminated copies of each string argument.
  withStrings(strings, fn) {
    const ptrs = strings.map((s) => {
      const enc = skUtf8Encode(String(s));
      const p = this.x.sk_alloc(enc.length + 1);
      const m = new Uint8Array(this.x.memory.buffer);
      m.set(enc, p);
      m[p + enc.length] = 0;
      return p;
    });
    try { return fn(...ptrs); } finally { ptrs.forEach((p) => this.x.sk_free(p)); }
  }
  json(ptr) { return JSON.parse(this.str(ptr)); }
}

// ---- model.js
// The page's copy of the engine. It never makes sound: it holds the current
// parameter values, formats and parses them exactly like the plugin will,
// and saves/loads patches. Changes are forwarded to the audio thread.

class Model {
  static async create(bytes) {
    let memory = null;
    const logs = [];
    const { instance } = await WebAssembly.instantiate(bytes, skImports(() => memory, (m) => { logs.push(m); console.error("[synth]", m); }));
    memory = instance.exports.memory;
    return new Model(new SkWasm(instance), logs);
  }

  constructor(w, logs) {
    this.w = w;
    this.x = w.x;
    this.logs = logs;
    this.info = w.json(this.x.sk_info());
    this.params = this.info.params.map((p, i) => ({ ...p, index: i }));
    this.byId = new Map(this.params.map((p) => [p.id, p]));
    this.listeners = new Map();   // index -> Set(fn)
    this.anyListeners = new Set();
    this.customListeners = new Map();
    this.sink = null;             // audio forwarding: {param(i, v), gesture?(i, on), patch(json), custom(id, json), mod(json), shapes(json)}
    this.mod = this.info.mod || { sources: [], slots: 0, lfos: 0, shapes: 0 };
    this.sourceIndex = new Map(this.mod.sources.map((s, i) => [s.id, i]));
    this.modListeners = new Set();
    this.shapeListeners = new Set();
    this.dirty = false;
    this.patchListeners = new Set();   // after any patch load
  }

  param(id) { return typeof id === "number" ? this.params[id] : this.byId.get(id); }
  get(id) { const p = this.param(id); return p ? this.x.sk_get_param(p.index) : NaN; }
  norm(id) { const p = this.param(id); return this.x.sk_to_norm(p.index, this.get(p.index)); }
  toNorm(id, v) { return this.x.sk_to_norm(this.param(id).index, v); }
  fromNorm(id, n) { return this.x.sk_from_norm(this.param(id).index, n); }
  format(id, v) { const p = this.param(id); return this.w.str(this.x.sk_format(p.index, v === undefined ? this.get(p.index) : v)); }
  parse(id, text) {
    const p = this.param(id);
    const v = this.w.withStrings([text], (t) => this.x.sk_parse(p.index, t));
    return Number.isNaN(v) ? null : v;
  }

  set(id, v, source) {
    const p = this.param(id);
    if (!p) return;
    const before = this.get(p.index);
    this.x.sk_set_param(p.index, v);
    const now = this.get(p.index);
    if (now === before) return;
    this.dirty = true;
    if (this.sink) this.sink.param(p.index, now);
    this.emit(p.index, now, source);
  }
  setNorm(id, n, source) { this.set(id, this.fromNorm(id, Math.min(1, Math.max(0, n))), source); }
  // A value that changed in the plugin (automation, the host's own controls):
  // update the page without sending it back.
  applyHost(i, v) {
    const p = this.param(i);
    if (!p) return;
    const before = this.get(p.index);
    this.x.sk_set_param(p.index, v);
    const now = this.get(p.index);
    if (now !== before) { this.dirty = true; this.emit(p.index, now, "host"); }
  }
  // Start/end of a drag, so a DAW records the change as one gesture.
  gesture(id, on) { const p = this.param(id); if (p && this.sink && this.sink.gesture) this.sink.gesture(p.index, on); }
  reset(id) { const p = this.param(id); this.set(p.index, p.def); }

  on(id, fn) {
    const p = this.param(id);
    if (!p) return () => {};
    if (!this.listeners.has(p.index)) this.listeners.set(p.index, new Set());
    this.listeners.get(p.index).add(fn);
    return () => this.listeners.get(p.index).delete(fn);
  }
  onAny(fn) { this.anyListeners.add(fn); return () => this.anyListeners.delete(fn); }
  emit(i, v, source) {
    for (const fn of this.listeners.get(i) || []) fn(v, source);
    for (const fn of this.anyListeners) fn(i, v, source);
  }
  emitAll() { this.params.forEach((p) => this.emit(p.index, this.get(p.index), "patch")); }

  // Patches ----------------------------------------------------------------
  savePatch() { return JSON.parse(this.w.str(this.x.sk_save_patch())); }
  get patchName() { return this.savePatch().name; }
  setName(name) { this.w.withStrings([name], (p) => this.x.sk_set_name(p)); }

  // fromHost: the plugin already has this patch, so don't send it back.
  loadPatch(patch, { fromHost = false } = {}) {
    const text = typeof patch === "string" ? patch : JSON.stringify(patch);
    const res = this.w.json(this.w.withStrings([text], (p) => this.x.sk_load_patch(p)));
    if (!res.ok) return res;
    const saved = JSON.stringify(this.savePatch());
    if (this.sink && !fromHost) this.sink.patch(saved);
    this.dirty = false;
    this.emitAll();
    for (const id of this.info.custom) this.emitCustom(id);
    this.emitMod();
    this.emitShapes();
    for (const fn of this.patchListeners) { try { fn(); } catch (err) { console.error(err); } }
    return res;
  }
  onPatch(fn) { this.patchListeners.add(fn); return () => this.patchListeners.delete(fn); }

  // The patch's tempo (features.tempoInPatch): {bpm, num, den}, or null.
  patchTempo() { const t = this.w.str(this.x.sk_patch_tempo()); return t ? JSON.parse(t) : null; }
  setPatchTempo(bpm, num, den) {
    const t = this.patchTempo();
    if (t && t.bpm === bpm && t.num === num && t.den === den) return;
    this.x.sk_set_patch_tempo(bpm, num, den);
    this.dirty = true;
    for (const fn of this.anyListeners) fn(-1, 0, "tempo");
  }

  // Modulation -------------------------------------------------------------
  routes() { return this.mod.slots ? this.w.json(this.x.sk_get_mod()) : []; }
  setRoutes(routes) {
    const warnings = this.w.json(this.w.withStrings([JSON.stringify(routes)], (p) => this.x.sk_set_mod(p)));
    this.dirty = true;
    if (this.sink) this.sink.mod(JSON.stringify(this.routes()));
    this.emitMod();
    for (const fn of this.anyListeners) fn(-1, 0, "mod");
    return warnings;
  }
  onMod(fn) { this.modListeners.add(fn); return () => this.modListeners.delete(fn); }
  emitMod() { const r = this.routes(); for (const fn of this.modListeners) fn(r); }
  modulatable() { return this.params.filter((p) => p.modulatable); }

  shapes() { return this.mod.shapes ? this.w.json(this.x.sk_get_shapes()) : []; }
  setShapes(shapes, quiet) {
    this.w.withStrings([JSON.stringify(shapes)], (p) => this.x.sk_set_shapes(p));
    this.dirty = true;
    if (this.sink) this.sink.shapes(JSON.stringify(shapes));
    if (!quiet) this.emitShapes();
    for (const fn of this.anyListeners) fn(-1, 0, "shapes");
  }
  onShapes(fn) { this.shapeListeners.add(fn); return () => this.shapeListeners.delete(fn); }
  emitShapes() { const s = this.shapes(); for (const fn of this.shapeListeners) fn(s); }

  // Custom state -----------------------------------------------------------
  custom(id) { return this.w.json(this.w.withStrings([id], (p) => this.x.sk_get_custom(p))); }
  setCustom(id, value) {
    const json = JSON.stringify(value);
    const ok = this.w.withStrings([id, json], (a, b) => this.x.sk_set_custom(a, b));
    if (!ok) return false;
    this.dirty = true;
    if (this.sink) this.sink.custom(id, JSON.stringify(this.custom(id)));
    this.emitCustom(id);
    return true;
  }
  onCustom(id, fn) {
    if (!this.customListeners.has(id)) this.customListeners.set(id, new Set());
    this.customListeners.get(id).add(fn);
    return () => this.customListeners.get(id).delete(fn);
  }
  emitCustom(id) { const v = this.custom(id); for (const fn of this.customListeners.get(id) || []) fn(v); }
  customSnapshot() {
    const o = {};
    for (const id of this.info.custom) o[id] = JSON.stringify(this.custom(id));
    return o;
  }
}

// ---- audio.js
// Audio output: creates the AudioContext and the worklet running the synth.

// A data: URL rather than a blob: URL, because Chrome refuses blob: worklets
// on pages opened straight from disk (file://).
function skWorkletUrl() {
  if (!skWorkletUrl.url) {
    const src = document.getElementById("sk-worklet").textContent;
    const bytes = skUtf8Encode(src);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.slice(i, i + 0x8000));
    skWorkletUrl.url = "data:text/javascript;base64," + btoa(bin);
  }
  return skWorkletUrl.url;
}

class Audio {
  constructor(wasmBytes) {
    this.wasm = wasmBytes;
    this.ctx = null;
    this.node = null;
    this.onMeter = null;
    this.onLog = null;
    this.onMessages = null;   // ([[index, values], \u2026]) from the synth
    this.onParams = null;     // ([[index, value], \u2026]) parameters the engine moved
    this.starting = null;
  }

  get running() { return !!this.node && this.ctx.state === "running"; }

  // Browsers only let audio start during a click or key press. Called outside
  // one (a message or MIDI before the first click), the context starts
  // suspended; the next call, from a click, resumes it, and the first
  // attempt then completes.
  start(model, transport) {
    if (this.starting) {
      if (this.ctx && this.ctx.state !== "running") this.ctx.resume().catch(() => {});
      return this.starting;
    }
    const attempt = (async () => {
      this.ctx = new AudioContext({ latencyHint: "interactive" });
      await this.ctx.audioWorklet.addModule(skWorkletUrl());
      this.node = new AudioWorkletNode(this.ctx, "synthkit", {
        numberOfInputs: 0,
        numberOfOutputs: 1,
        outputChannelCount: [2],
        processorOptions: {
          wasm: this.wasm.slice().buffer,
          patch: JSON.stringify(model.savePatch()),
          custom: model.customSnapshot(),
          transport,
        },
      });
      this.node.port.onmessage = (e) => {
        const m = e.data;
        if (m.t === "meter" && this.onMeter) this.onMeter(m);
        else if (m.t === "msgs" && this.onMessages) this.onMessages(m.list);
        else if (m.t === "params" && this.onParams) this.onParams(m.changes);
        else if (m.t === "log") { console.error("[synth]", m.msg); if (this.onLog) this.onLog(m.msg); }
      };
      this.node.onprocessorerror = () => { if (this.onLog) this.onLog("The synth stopped with an error. Reload the page to restart it."); };
      this.node.connect(this.ctx.destination);
      if (this.ctx.state !== "running") await this.ctx.resume();
    })();
    this.starting = attempt.catch((err) => {
      // Let the next click try again from scratch.
      this.starting = null;
      if (this.ctx) this.ctx.close().catch(() => {});
      this.ctx = null;
      this.node = null;
      throw err;
    });
    return this.starting;
  }

  send(msg) { if (this.node) this.node.port.postMessage(msg); }
  midi(bytes) { this.send({ t: "midi", d: bytes }); }

  // Sink interface used by Model.
  sink() {
    return {
      param: (i, v) => this.send({ t: "param", i, v }),
      patch: (json) => this.send({ t: "patch", json }),
      custom: (id, json) => this.send({ t: "custom", id, json }),
      mod: (json) => this.send({ t: "mod", json }),
      shapes: (json) => this.send({ t: "shapes", json }),
      message: (i, v) => this.send({ t: "msg", i, v }),
    };
  }

  // Render offline through the same worklet (used by tests, and handy for
  // bouncing a phrase). events: [{t: seconds, d: [status, d1, d2]}].
  static async renderOffline(wasmBytes, { patch, custom, events = [], seconds = 2, sampleRate = 48000, transport }) {
    const len = Math.ceil(seconds * sampleRate);
    const ctx = new OfflineAudioContext(2, len, sampleRate);
    await ctx.audioWorklet.addModule(skWorkletUrl());
    // events: {t, d: [MIDI bytes]} or {t, m: [message index, values]}; at the
    // same time, messages go first (as in the native render tool).
    const schedule = events.map((e) => (e.m ? { sample: Math.round(e.t * sampleRate), m: e.m } : { sample: Math.round(e.t * sampleRate), d: e.d }))
      .sort((a, b) => a.sample - b.sample || (b.m ? 1 : 0) - (a.m ? 1 : 0));
    const node = new AudioWorkletNode(ctx, "synthkit", {
      numberOfInputs: 0,
      numberOfOutputs: 1,
      outputChannelCount: [2],
      processorOptions: { wasm: wasmBytes.slice().buffer, patch, custom, schedule, transport, meters: false },
    });
    node.connect(ctx.destination);
    const buf = await ctx.startRendering();
    return { left: buf.getChannelData(0), right: buf.getChannelData(1), sampleRate };
  }
}

// ---- host.js
// Running inside the plugin. The plugin serves this page with its current
// state in window.__skHost and talks to it through JUCE's web view bridge
// (window.__JUCE__.backend). HostAudio stands in for Audio: the sound comes
// from the plugin, so there is nothing to start, and changes go to the plugin
// instead of an AudioWorklet.

const skHost = (typeof window !== "undefined" && window.__skHost && window.__JUCE__ && window.__JUCE__.backend) ? window.__skHost : null;

class HostAudio {
  constructor() {
    this.onMeter = null;
    this.onLog = null;
    this.onHost = null;      // (message) for params / state / store / imported
    this.onMessages = null;  // ([[index, values], \u2026]) from the synth
    this.node = true;        // App checks this before sending MIDI
    window.__JUCE__.backend.addEventListener("sk", (m) => this.receive(m));
  }

  get running() { return true; }
  start() { return Promise.resolve(); }

  send(msg) { window.__JUCE__.backend.emitEvent("sk", msg); }
  midi(bytes) { this.send({ t: "midi", d: bytes }); }

  sink() {
    return {
      param: (i, v) => this.send({ t: "param", i, v }),
      gesture: (i, on) => this.send({ t: "gesture", i, on }),
      patch: (json) => this.send({ t: "patch", json }),
      custom: (id, json) => this.send({ t: "custom", id, json }),
      mod: (json) => this.send({ t: "mod", json }),
      shapes: (json) => this.send({ t: "shapes", json }),
      message: (i, v) => this.send({ t: "msg", i, v }),
    };
  }

  receive(m) {
    if (!m) return;
    if (m.t === "meter") {
      // JSON has no NaN: the plugin sends null for "not modulated".
      m.mod = Float32Array.from(m.mod || [], (v) => (v === null ? NaN : v));
      if (this.onMeter) this.onMeter(m);
    } else if (m.t === "log") {
      if (this.onLog) this.onLog(m.msg, m.kind);
    } else if (m.t === "msgs") {
      if (this.onMessages) this.onMessages(m.list || []);
    } else if (this.onHost) {
      this.onHost(m);
    }
  }
}

// ---- controls.js
// Controls bound to parameters. Every control: drag (Shift = fine), wheel,
// arrow keys, double-click to reset, click the value to type one, right-click
// for MIDI learn.

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

function svg(tag, attrs = {}) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// Info icons: a small (i) beside a control's label or a panel's title. Its
// text shows in a popover while the mouse is over it or it has keyboard
// focus, and stays up after a click or tap until the next click elsewhere.
const skInfo = {
  pop: null, btn: null, pinned: false,
  init() {
    this.pop = h("div", { class: "info-pop", role: "tooltip", id: "sk-info-pop", hidden: true });
    document.body.append(this.pop);
    document.addEventListener("pointerdown", (e) => { if (this.btn && !this.btn.contains(e.target) && !this.pop.contains(e.target)) this.hide(); }, true);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") this.hide(); });
    window.addEventListener("scroll", () => { if (this.btn) this.place(); }, true);
    window.addEventListener("resize", () => this.hide());
  },
  show(btn, pinned) {
    if (!this.pop) this.init();
    if (this.btn && this.btn !== btn) this.release();
    this.btn = btn;
    this.pinned = pinned;
    this.pop.textContent = btn.skInfo;
    this.pop.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    btn.setAttribute("aria-describedby", this.pop.id);
    this.place();
  },
  place() {
    const r = this.btn.getBoundingClientRect(), p = this.pop, m = 8;
    if (!r.width) { this.hide(); return; }   // its panel was hidden
    p.style.left = "0px"; p.style.top = "0px";
    const w = p.offsetWidth, ht = p.offsetHeight;
    const x = Math.max(m, Math.min(window.innerWidth - w - m, r.left + r.width / 2 - w / 2));
    let y = r.bottom + 6;
    if (y + ht > window.innerHeight - m && r.top - 6 - ht >= m) y = r.top - 6 - ht;
    p.style.left = x.toFixed(0) + "px"; p.style.top = y.toFixed(0) + "px";
  },
  release() {
    this.btn.setAttribute("aria-expanded", "false");
    this.btn.removeAttribute("aria-describedby");
  },
  // hide(btn) only hides if btn is the one showing.
  hide(btn) {
    if (!this.btn || (btn && btn !== this.btn)) return;
    this.release();
    this.pop.hidden = true;
    this.btn = null;
    this.pinned = false;
  },
};

function skInfoButton(text, about) {
  const b = h("button", { type: "button", class: "info-btn", "aria-label": about ? `About ${about}` : "More information", "aria-expanded": "false" });
  const s = svg("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
  s.append(svg("circle", { cx: 8, cy: 8, r: 6.6, class: "info-ring" }), svg("path", { d: "M8 7.2v4.4", class: "info-stem" }), svg("circle", { cx: 8, cy: 4.7, r: 1.05, class: "info-dot" }));
  b.append(s);
  b.skInfo = String(text);
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    if (skInfo.btn === b && skInfo.pinned) skInfo.hide(); else skInfo.show(b, true);
  });
  b.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse" && !skInfo.pinned) skInfo.show(b, false); });
  b.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !skInfo.pinned) skInfo.hide(b); });
  b.addEventListener("focus", () => { if (b.matches(":focus-visible") && !skInfo.pinned) skInfo.show(b, false); });
  b.addEventListener("blur", () => { if (!skInfo.pinned) skInfo.hide(b); });
  // Keys on the button belong to it, not to the computer keyboard's notes.
  b.addEventListener("keydown", (e) => e.stopPropagation());
  return b;
}

const KNOB_START = -135, KNOB_END = 135;

function arcPath(cx, cy, r, a0, a1) {
  const rad = (a) => ((a - 90) * Math.PI) / 180;
  const x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));
  const x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  const sweep = a1 > a0 ? 1 : 0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

// Vertical/horizontal drag on an element, in normalised units.
function attachDrag(target, ctl, axis = "y") {
  let start = null;
  target.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    target.setPointerCapture(e.pointerId);
    start = { x: e.clientX, y: e.clientY, n: ctl.norm(), moved: false };
    ctl.model.gesture(ctl.p.index, true);
    ctl.root.classList.add("is-active");
    ctl.focus();
  });
  target.addEventListener("pointermove", (e) => {
    if (!start) return;
    const range = e.shiftKey ? 1200 : axis === "x" ? Math.max(120, target.clientWidth) : 180;
    const d = axis === "x" ? e.clientX - start.x : start.y - e.clientY;
    if (Math.abs(d) > 2) start.moved = true;
    ctl.setNorm(start.n + d / range);
  });
  const end = () => {
    if (start) ctl.model.gesture(ctl.p.index, false);
    start = null;
    ctl.root.classList.remove("is-active");
  };
  target.addEventListener("pointerup", end);
  target.addEventListener("pointercancel", end);
  target.addEventListener("dblclick", () => ctl.reset());
  target.addEventListener("wheel", (e) => {
    e.preventDefault();
    const step = e.shiftKey ? 0.002 : 0.01;
    ctl.setNorm(ctl.norm() + (e.deltaY < 0 ? step : -step) * (ctl.stepScale || 1));
  }, { passive: false });
}

class Control {
  constructor(app, param, opts = {}) {
    this.app = app;
    this.model = app.model;
    this.p = param;
    this.opts = opts;
    this.label = opts.label || param.name;
    this.info = opts.info || (app.paramInfo && app.paramInfo[param.id]) || "";
    this.discrete = param.type !== "float";
    this.steps = this.discrete ? Math.round((param.max - param.min) / (param.step || 1)) : 0;
    this.stepScale = this.discrete ? Math.max(1, 100 / Math.max(1, this.steps)) : 1;
    this.root = h("div", { class: "ctl ctl-" + this.kind() + (opts.size ? " is-" + opts.size : ""), "data-param": param.id });
    this.build();
    this.unsub = this.model.on(param.index, (v) => this.update(v));
    this.root.addEventListener("contextmenu", (e) => { e.preventDefault(); app.paramMenu(this, e.clientX, e.clientY); });
    this.update(this.model.get(param.index));
  }
  kind() { return "base"; }
  norm() { return this.model.norm(this.p.index); }
  setNorm(n) {
    if (this.discrete && this.steps > 0) n = Math.round(Math.min(1, Math.max(0, n)) * this.steps) / this.steps;
    this.model.setNorm(this.p.index, n, "ui");
  }
  set(v) { this.model.set(this.p.index, v, "ui"); }
  reset() { this.model.reset(this.p.index); }
  // The label under (or beside) a control, with its info icon if it has one.
  labelEl() {
    const el = h("div", { class: "ctl-label" }, this.label);
    if (this.info) el.append(skInfoButton(this.info, this.label));
    return el;
  }
  focus() { const f = this.root.querySelector("[tabindex]"); if (f) f.focus({ preventScroll: true }); }
  text(v) { return this.model.format(this.p.index, v); }

  keyHandler(e) {
    const big = e.shiftKey ? 0.001 : 0.01;
    const step = this.discrete ? 1 / Math.max(1, this.steps) : big;
    let n = null;
    if (e.key === "ArrowUp" || e.key === "ArrowRight") n = this.norm() + step;
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") n = this.norm() - step;
    else if (e.key === "PageUp") n = this.norm() + 0.1;
    else if (e.key === "PageDown") n = this.norm() - 0.1;
    else if (e.key === "Home") n = 0;
    else if (e.key === "End") n = 1;
    else if (e.key === "Delete" || e.key === "Backspace") { this.reset(); e.preventDefault(); return; }
    if (n !== null) { e.preventDefault(); e.stopPropagation(); this.setNorm(n); }
  }

  // The value readout doubles as a text field.
  valueField() {
    const v = h("button", { class: "ctl-value", type: "button", title: "Type a value" });
    v.addEventListener("click", () => this.editValue(v));
    return v;
  }
  editValue(btn) {
    const input = h("input", { class: "ctl-edit", type: "text", value: this.text(), "aria-label": this.label });
    btn.replaceWith(input);
    input.select();
    let finished = false;
    const done = (commit) => {
      if (finished) return;
      finished = true;
      if (commit) {
        const v = this.model.parse(this.p.index, input.value.trim());
        if (v !== null) this.set(v);
      }
      input.replaceWith(btn);
      this.update(this.model.get(this.p.index));
    };
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") done(true);
      if (e.key === "Escape") done(false);
    });
    input.addEventListener("blur", () => done(true));
  }
  aria(el, v) {
    el.setAttribute("aria-valuetext", this.text(v));
    el.setAttribute("aria-valuenow", Math.round(this.model.toNorm(this.p.index, v) * 100));
  }
  learned(cc) { this.root.classList.toggle("has-cc", cc !== null && cc !== undefined); this.root.title = cc != null ? `${this.label}: MIDI CC ${cc}` : ""; }
}

class Knob extends Control {
  kind() { return "knob"; }
  build() {
    const p = this.p;
    this.origin = p.min < 0 && p.max > 0 ? this.model.toNorm(p.index, 0) : 0;
    const s = svg("svg", { viewBox: "0 0 100 100", class: "knob-svg", "aria-hidden": "true" });
    s.append(svg("path", { class: "knob-track", d: arcPath(50, 50, 42, KNOB_START, KNOB_END) }));
    this.arc = svg("path", { class: "knob-arc" });
    this.modArc = svg("path", { class: "knob-mod" });
    s.append(this.arc, this.modArc);
    s.append(svg("circle", { class: "knob-cap", cx: 50, cy: 50, r: 31 }));
    this.pointer = svg("line", { class: "knob-pointer", x1: 50, y1: 50, x2: 50, y2: 23 });
    s.append(this.pointer);
    this.dial = h("div", { class: "knob-dial", role: "slider", tabindex: 0, "aria-label": this.label, "aria-valuemin": 0, "aria-valuemax": 100 }, s);
    this.dial.addEventListener("keydown", (e) => this.keyHandler(e));
    attachDrag(this.dial, this);
    this.value = this.valueField();
    this.root.append(this.dial, this.labelEl(), this.value);
  }
  update(v) {
    const n = this.model.toNorm(this.p.index, v);
    const a = KNOB_START + (KNOB_END - KNOB_START) * n;
    const a0 = KNOB_START + (KNOB_END - KNOB_START) * this.origin;
    this.arc.setAttribute("d", Math.abs(a - a0) < 0.5 ? "" : arcPath(50, 50, 42, Math.min(a0, a), Math.max(a0, a)));
    this.pointer.setAttribute("transform", `rotate(${a.toFixed(1)} 50 50)`);
    this.value.textContent = this.text(v);
    this.aria(this.dial, v);
    this.base = v;
    if (this.modValue !== undefined) this.modulated(this.modValue);
  }
  // Live modulation: a thin outer arc from the set value to where modulation
  // has taken it (for the most recent voice).
  modulated(v) {
    this.modValue = v;
    if (Number.isNaN(v) || v === undefined) { this.modArc.setAttribute("d", ""); this.root.classList.remove("is-modulated"); return; }
    const a0 = KNOB_START + (KNOB_END - KNOB_START) * this.model.toNorm(this.p.index, this.model.get(this.p.index));
    const a1 = KNOB_START + (KNOB_END - KNOB_START) * this.model.toNorm(this.p.index, v);
    this.root.classList.add("is-modulated");
    this.modArc.setAttribute("d", Math.abs(a1 - a0) < 0.8 ? "" : arcPath(50, 50, 49, Math.min(a0, a1), Math.max(a0, a1)));
  }
}

class Slider extends Control {
  kind() { return "slider"; }
  build() {
    this.fill = h("div", { class: "slider-fill" });
    this.thumb = h("div", { class: "slider-thumb" });
    this.track = h("div", { class: "slider-track", role: "slider", tabindex: 0, "aria-label": this.label, "aria-valuemin": 0, "aria-valuemax": 100 }, this.fill, this.thumb);
    this.track.addEventListener("keydown", (e) => this.keyHandler(e));
    attachDrag(this.track, this, "x");
    this.value = this.valueField();
    this.root.append(h("div", { class: "ctl-row" }, this.labelEl(), this.value), this.track);
  }
  update(v) {
    const n = this.model.toNorm(this.p.index, v);
    this.fill.style.width = (n * 100).toFixed(2) + "%";
    this.thumb.style.left = (n * 100).toFixed(2) + "%";
    this.value.textContent = this.text(v);
    this.aria(this.track, v);
  }
}

class Segmented extends Control {
  kind() { return "segmented"; }
  build() {
    const choices = this.p.choices || (this.p.type === "toggle" ? ["Off", "On"] : []);
    this.group = h("div", { class: "seg", role: "radiogroup", "aria-label": this.label });
    this.buttons = choices.map((c, i) =>
      h("button", { type: "button", class: "seg-btn", role: "radio", text: c, onclick: () => this.set(this.p.min + i) }));
    this.group.append(...this.buttons);
    this.group.addEventListener("keydown", (e) => this.keyHandler(e));
    this.root.append(this.labelEl(), this.group);
  }
  update(v) {
    const idx = Math.round(v - this.p.min);
    this.buttons.forEach((b, i) => {
      b.setAttribute("aria-checked", i === idx ? "true" : "false");
      b.tabIndex = i === idx ? 0 : -1;
    });
  }
}

class Menu extends Control {
  kind() { return "menu"; }
  build() {
    this.select = h("select", { class: "menu-select", "aria-label": this.label, onchange: () => this.set(Number(this.select.value)) });
    const n = this.p.choices ? this.p.choices.length : this.steps + 1;
    for (let i = 0; i < n; i++) {
      const v = this.p.min + i * (this.p.step || 1);
      this.select.append(h("option", { value: v, text: this.p.choices ? this.p.choices[i] : this.text(v) }));
    }
    this.root.append(this.labelEl(), this.select);
  }
  update(v) { this.select.value = String(Math.round(v)); }
}

class Toggle extends Control {
  kind() { return "toggle"; }
  build() {
    this.btn = h("button", { type: "button", class: "toggle", role: "switch", "aria-label": this.label, onclick: () => this.set(this.model.get(this.p.index) >= 0.5 ? 0 : 1) },
      h("span", { class: "toggle-knob" }));
    this.root.append(this.btn, this.labelEl());
  }
  update(v) { this.btn.setAttribute("aria-checked", v >= 0.5 ? "true" : "false"); }
}

// Two parameters on one pad: x = params[0], y = params[1].
class XYPad {
  constructor(app, px, py, opts = {}) {
    this.app = app; this.model = app.model; this.px = px; this.py = py;
    this.dot = h("div", { class: "xy-dot" });
    this.pad = h("div", { class: "xy-pad", role: "group", tabindex: 0, "aria-label": `${px.name} and ${py.name}` }, this.dot);
    this.readout = h("div", { class: "ctl-value is-static" });
    const label = opts.label || `${px.name} / ${py.name}`;
    const labelEl = h("div", { class: "ctl-label" }, label);
    if (opts.info) labelEl.append(skInfoButton(opts.info, label));
    this.root = h("div", { class: "ctl ctl-xy" }, this.pad, labelEl, this.readout);
    const move = (e) => {
      const r = this.pad.getBoundingClientRect();
      this.model.setNorm(px.index, (e.clientX - r.left) / r.width, "ui");
      this.model.setNorm(py.index, 1 - (e.clientY - r.top) / r.height, "ui");
    };
    this.pad.addEventListener("pointerdown", (e) => {
      this.pad.setPointerCapture(e.pointerId); this.dragging = true;
      this.model.gesture(px.index, true); this.model.gesture(py.index, true);
      move(e);
    });
    this.pad.addEventListener("pointermove", (e) => { if (this.dragging) move(e); });
    const up = () => {
      if (this.dragging) { this.model.gesture(px.index, false); this.model.gesture(py.index, false); }
      this.dragging = false;
    };
    this.pad.addEventListener("pointerup", up);
    this.pad.addEventListener("pointercancel", up);
    this.pad.addEventListener("dblclick", () => { this.model.reset(px.index); this.model.reset(py.index); });
    this.pad.addEventListener("keydown", (e) => {
      const s = e.shiftKey ? 0.002 : 0.02;
      const map = { ArrowLeft: [px, -s], ArrowRight: [px, s], ArrowUp: [py, s], ArrowDown: [py, -s] };
      if (map[e.key]) { e.preventDefault(); const [p, d] = map[e.key]; this.model.setNorm(p.index, this.model.norm(p.index) + d, "ui"); }
    });
    this.model.on(px.index, () => this.update());
    this.model.on(py.index, () => this.update());
    this.update();
  }
  update() {
    const x = this.model.norm(this.px.index), y = this.model.norm(this.py.index);
    this.dot.style.left = x * 100 + "%";
    this.dot.style.top = (1 - y) * 100 + "%";
    this.readout.textContent = `${this.model.format(this.px.index)}, ${this.model.format(this.py.index)}`;
  }
}

function makeControl(app, param, spec = {}) {
  let type = spec.type;
  if (!type) {
    if (param.type === "toggle") type = "toggle";
    else if (param.type === "choice") type = (param.choices || []).length <= 4 ? "segmented" : "menu";
    else type = "knob";
  }
  const C = { knob: Knob, slider: Slider, segmented: Segmented, menu: Menu, toggle: Toggle }[type];
  if (!C) return null;
  return new C(app, param, spec);
}

// ---- panels.js
// Builds the panel of sections from ui/layout.json, or automatically from
// parameter groups when a synth has no layout.

const KIT_PANELS = {
  voices: { title: "Voices", controls: [
    ["voiceMode", "Mode"], ["glide", "Glide"], ["unison", "Unison"], ["unisonDetune", "Detune"],
    ["unisonSpread", "Spread"], ["bendRange", "Bend"]] },
  master: { title: "Output", controls: [["master", "Level"], ["sk.a4", "A4"]] },
};

function envPanel(n, model) {
  const amp = n === 1 && model.info.synth.ampEnv;
  return {
    title: amp ? "Amp envelope" : `Envelope ${n}`,
    env: n,
    controls: ["attack", "decay", "sustain", "release", "velocity"].map((s) => [`env${n}.${s}`, s[0].toUpperCase() + s.slice(1)]),
  };
}

// Small drawing of an ADSR's shape, redrawn as its knobs move.
class EnvPreview {
  constructor(model, n) {
    this.model = model;
    this.ids = ["attack", "decay", "sustain", "release"].map((s) => `env${n}.${s}`);
    this.path = svg("path", { class: "env-line" });
    this.fill = svg("path", { class: "env-fill" });
    this.root = svg("svg", { class: "env-preview", viewBox: "0 0 200 60", preserveAspectRatio: "none", "aria-hidden": "true" });
    this.root.append(this.fill, this.path);
    for (const id of this.ids) model.on(id, () => this.draw());
    this.draw();
  }
  draw() {
    const [a, d, s, r] = this.ids.map((id) => this.model.get(id));
    // Times on a soft log scale so short and long envelopes both read well.
    const w = (t) => Math.log1p(t * 40);
    const hold = 0.6;
    const total = w(a) + w(d) + hold + w(r);
    const sx = 196 / total, top = 6, bottom = 56, y = (v) => bottom - v * (bottom - top);
    let x = 2;
    const pts = [[x, bottom]];
    x += w(a) * sx; pts.push([x, y(1)]);
    x += w(d) * sx; pts.push([x, y(s)]);
    x += hold * sx; pts.push([x, y(s)]);
    x += w(r) * sx; pts.push([x, bottom]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    this.path.setAttribute("d", line);
    this.fill.setAttribute("d", line + " Z");
  }
}

// Opens whatever tab or collapsed panel is hiding an element, so it can be
// shown (e.g. the matrix after Modulate\u2026).
function skReveal(el) {
  const chain = [];
  for (let n = el; n; n = n.parentElement) if (n.skReveal) chain.push(n.skReveal);
  for (const fn of chain.reverse()) fn();
}

const SK_CHEVRON = () => {
  const s = svg("svg", { class: "panel-chevron", viewBox: "0 0 12 12", "aria-hidden": "true" });
  s.append(svg("path", { d: "M3 4.5 6 7.5 9 4.5" }));
  return s;
};

class Panels {
  constructor(app) {
    this.app = app;
    this.model = app.model;
    this.problems = [];
    this.placed = new Set();
    this.ids = 0;
    this.root = h("div", { class: "panels" });
  }

  build(layout) {
    // Info text for parameters wherever they appear (kit panels included).
    const info = layout && layout.paramInfo;
    this.app.paramInfo = info && typeof info === "object" ? info : {};
    for (const id of Object.keys(this.app.paramInfo)) if (!this.model.param(id)) this.problems.push(`layout.json has paramInfo for "${id}", which isn't a parameter.`);
    // Which tabs were showing and which panels were folded, per synth.
    this.storeKey = `synthkit:${this.model.info.synth.id}:ui`;
    this.ui = skStore.get(this.storeKey, {}) || {};
    this.blocks(layout && Array.isArray(layout.sections) ? layout.sections : this.autoSections(), this.root);
    // Anything the layout forgot still gets a place, so no parameter is unreachable.
    const rest = this.model.params.filter((p) => !p.hidden && !p.kit && !this.placed.has(p.id));
    if (rest.length) this.root.append(this.section({ title: "More", controls: rest.map((p) => ({ param: p.id })) }));
    return this.root;
  }

  remember(key, value) {
    this.ui[key] = value;
    skStore.set(this.storeKey, this.ui);
  }

  autoSections() {
    const groups = new Map();
    for (const p of this.model.params) {
      if (p.hidden || p.kit) continue;
      const g = p.group || "Sound";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push({ param: p.id });
    }
    const out = [...groups].map(([title, controls]) => ({ title, controls }));
    out.push({ kit: "voices" });
    for (let n = 1; n <= this.model.info.synth.standardEnvelopes; n++) out.push({ kit: "env" + n });
    const lfos = this.model.mod.lfos ? [{ kit: "lfos" }] : [], shapes = [];
    for (let n = 1; n <= this.model.mod.shapes; n++) shapes.push({ kit: "shape" + n });
    // LFOs and shapes together make a long page: give each kind a tab.
    if (lfos.length && shapes.length) {
      out.push({ tabs: [
        { title: this.model.mod.lfos > 1 || this.model.param("sk.lfos") ? "LFOs" : "LFO", sections: lfos },
        { title: shapes.length > 1 ? "Shapes" : "Shape", sections: shapes }] });
    } else out.push(...lfos, ...shapes);
    if (this.model.mod.slots) out.push({ kit: "modMatrix" });
    out.push({ kit: "master" });
    return out;
  }

  blocks(list, into) {
    for (const spec of list) {
      const el = this.block(spec);
      if (el) into.append(el);
    }
  }

  // One entry of "sections": a panel, a row of tabs, or an accordion.
  block(spec, collapsible = false) {
    if (!spec || typeof spec !== "object") { this.problems.push(`layout.json has a section that isn't an object: ${JSON.stringify(spec)}.`); return null; }
    if ("tabs" in spec) return this.tabs(spec);
    if ("accordion" in spec) return this.accordion(spec);
    if (spec.kit === "lfos") return this.lfos(spec, collapsible);
    const el = this.section(spec);
    if (el) this.decorate(el, spec, collapsible);
    return el;
  }

  // Every LFO panel, plus (when the player adds LFOs) an Add LFO button. Its
  // children sit in the surrounding row as if listed one by one.
  lfos(spec, collapsible) {
    if (!this.model.mod.lfos) return this.missing("lfos");
    const wrap = h("div", { class: "lfo-group" });
    for (let n = 1; n <= this.model.mod.lfos; n++) {
      const el = this.section({ kit: "lfo" + n });
      this.decorate(el, { ...spec, kit: "lfo" + n, id: spec.id && `${spec.id}.${n}`, title: undefined }, collapsible);
      wrap.append(el);
    }
    const cap = this.model.param("sk.lfos");
    if (cap) {
      const add = h("button", { type: "button", class: "lfo-add", onclick: () => skAddLfo(this.app) }, h("span", { class: "lfo-add-plus", "aria-hidden": "true", text: "+" }), "Add LFO");
      const show = (v) => {
        add.hidden = Math.round(v) >= cap.max;
        add.lastChild.textContent = Math.round(v) ? "Add LFO" : "Add an LFO";
      };
      this.model.on("sk.lfos", show);
      show(this.model.get("sk.lfos"));
      wrap.append(add);
    }
    return wrap;
  }

  // Info icon and folding for a panel (the kit's own panels included).
  decorate(sec, spec, collapsible) {
    const title = sec.querySelector(":scope > .panel-title");
    if (!title) return;
    if (spec.title && !title.textContent.trim()) title.prepend(spec.title);
    // The title's text; buttons already in it (an LFO's remove) stay put.
    const text = [...title.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join("").trim();
    const extras = [...title.children];
    if (collapsible || typeof spec.collapsed === "boolean") {
      if (!text) this.problems.push("A collapsible panel in layout.json needs a title to click.");
      const body = h("div", { class: "panel-body", id: `sk-panel-${++this.ids}` });
      while (title.nextSibling) body.append(title.nextSibling);
      sec.append(body);
      const btn = h("button", { type: "button", class: "panel-toggle", "aria-controls": body.id }, SK_CHEVRON(), h("span", { text }));
      title.textContent = "";
      title.append(btn, ...extras);
      sec.classList.add("is-collapsible");
      const key = "open:" + (spec.id || spec.kit || text);
      sec.skOpen = (open, save) => {
        body.hidden = !open;
        sec.classList.toggle("is-collapsed", !open);
        btn.setAttribute("aria-expanded", String(open));
        if (save) this.remember(key, open);
        if (open && save && sec.skSiblings) for (const o of sec.skSiblings) if (o !== sec && !o.querySelector(":scope > .panel-body").hidden) o.skOpen(false, true);
      };
      sec.skReveal = () => { if (body.hidden) sec.skOpen(true, true); };
      btn.addEventListener("click", () => sec.skOpen(body.hidden, true));
      // The whole title row folds it (the button is there for the keyboard).
      title.addEventListener("click", (e) => { if (!e.target.closest(".panel-toggle, .info-btn")) sec.skOpen(body.hidden, true); });
      sec.skOpen(typeof this.ui[key] === "boolean" ? this.ui[key] : spec.collapsed !== true, false);
    }
    if (spec.info) title.insertBefore(skInfoButton(spec.info, text), extras[0] || null);
  }

  // { "accordion": [ sections\u2026 ], "single": true }: panels stacked in one
  // column, each folding at its title; "single" keeps one open at a time.
  accordion(spec) {
